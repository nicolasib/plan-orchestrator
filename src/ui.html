  Lane: kvSvg('<path d="M1.6 3.3 h9.8 M1.6 6.5 h6.4 M1.6 9.7 h8.2" />'),
  Duration: kvSvg('<circle cx="6.5" cy="6.5" r="5.1" /><path d="M6.5 3.6 V6.7 L8.6 8.1" />'),
  Turns: kvSvg('<path d="M11 6.5a4.5 4.5 0 1 1-1.6-3.4" /><path d="M11.2 1.9 V4.1 H9" />'),
  Attempts: kvSvg('<path d="M2 6.5a4.5 4.5 0 1 0 1.6-3.4" /><path d="M1.8 1.9 V4.1 H4" />'),
  'Output tokens': kvSvg('<path d="M2.4 10.6 V7.4 M6.5 10.6 V4.6 M10.6 10.6 V2.4" stroke-width="1.45" />'),
  Model: kvSvg('<rect x="3.4" y="3.4" width="6.2" height="6.2" rx="1.4" /><path d="M5.2 1.5v1.9 M7.8 1.5v1.9 M5.2 9.6v1.9 M7.8 9.6v1.9 M1.5 5.2h1.9 M1.5 7.8h1.9 M9.6 5.2h1.9 M9.6 7.8h1.9" />'),
  Session: kvSvg('<path d="M7.6 2.1 H10a.9.9 0 0 1 .9.9v7a.9.9 0 0 1-.9.9H7.6" /><path d="M5.4 2.1H3a.9.9 0 0 0-.9.9v7a.9.9 0 0 0 .9.9h2.4" /><path d="M4.5 6.5h4" />'),
  Commits: kvSvg('<circle cx="6.5" cy="6.5" r="2.4" /><path d="M1.4 6.5h2.7 M8.9 6.5h2.7" />'),
  Log: kvSvg('<path d="M3.1 1.7h4.3l2.5 2.5v7.1H3.1z" /><path d="M7.2 1.8v2.6h2.6 M4.7 7.1h3.6 M4.7 9.2h2.6" />'),
};

// ------------------------------------------------------------------ orbs

/*
 * Fibonacci spiral: the way to spread N points over a sphere without piling
 * them at the poles, which is what any naive latitude/longitude distribution
 * does. Computed once for every orb on the page.
 */
function orbDots(n, { jitter = 0, spread = 1, ring = false } = {}) {
  const golden = Math.PI * (3 - Math.sqrt(5));
  const noise = (k, i) => ((hash(`${k}:${i}`) % 1000) / 1000) - 0.5;
  const out = [];
  for (let i = 0; i < n; i += 1) {
    let x, y, z;
    if (ring) {
      const th = (i / n) * Math.PI * 2;
      x = Math.cos(th); z = Math.sin(th); y = noise('ring', i) * 0.22;
    } else {
      y = 1 - (i / (n - 1)) * 2;
      const r = Math.sqrt(Math.max(0, 1 - y * y));
      const th = i * golden;
      x = Math.cos(th) * r; z = Math.sin(th) * r;
    }
    if (jitter) { x += noise('x', i) * jitter; y += noise('y', i) * jitter; z += noise('z', i) * jitter; }
    const s = spread === 1 ? 1 : 1 + Math.abs(noise('s', i)) * 2 * (spread - 1);
    out.push([(x * s).toFixed(3), (y * s).toFixed(3), (z * s).toFixed(3)]);
  }
  return out;
}

/*
 * Four bodies, one per family of work.
 *
 * A uniform sphere answers "there is work happening" and stops there. But
 * `humanize()` below already knows *what kind* of work it is — it has to, to
 * pick the verb — and that classification was being thrown away at drawing
 * time. Here it becomes shape:
 *
 *   scan    a dense, regular sphere, sweeping — reading, searching, git
 *   churn   a broken-contoured sphere — editing, testing, committing
 *   think   a closed, slow sphere — thinking, planning
 *   orbit   a ring in perspective — dispatching to another agent
 *
 * The disorder is judged at 20px, not magnified: with high jitter the
 * spherical silhouette is lost and the orb reads as dirt rather than work.
 * What separates `churn` from `scan` is the broken contour, not the spread.
 */
const ORB_BODY = {
  scan: orbDots(26),
  churn: orbDots(23, { jitter: 0.2, spread: 1.1 }),
  think: orbDots(30, { spread: 0.82 }),
  orbit: orbDots(16, { ring: true }),
};

const ORB_BALL = Object.fromEntries(Object.entries(ORB_BODY).map(([k, dots]) => [k,
  `<span class="ball">${dots.map(([x, y, z]) => `<i style="--x:${x};--y:${y};--z:${z}"></i>`).join('')}</span>`]));

/**
 * An agent's orb. Two independent things: `kind` is the family of work and
 * chooses the body; `mode` is the state and chooses the colour and the
 * rhythm — `''` under way, `warn` alive after a call that failed, `stopped`
 * for one that is not moving. An agent that edits and one that reads never
 * have the same shape, and the same shape never has two colours at once.
 */
const orbHtml = (kind, mode, r = 8.5) =>
  `<span class="orb ${kind || 'scan'} ${mode}" style="--r:${r}px" aria-hidden="true">${ORB_BALL[kind] || ORB_BALL.scan}</span>`;

// --------------------------------------------------------------- avatars

/*
 * An agent is somebody working, and somebody has a face.
 *
 * The colour says the lane; the face says who. The skin comes from the lane's
 * letter, the features (eyes, the angle of the cap) from a hash of the id,
 * and the mood from the status: whoever failed is not smiling. So two lanes
 * are never the same colour, two agents in one lane are never the same face,
 * and neither can be mistaken for a state — no hue here comes near `--done`,
 * `--fail`, `--warn`, `--run` or `--accent`, which are the five the page uses
 * to say what happened.
 */
const LANE_SKIN = [
  { bg: '#3b9fe0', ink: '#f0fbff' },  // A
  { bg: '#a78bfa', ink: '#f7f3ff' },  // B
  { bg: '#e06cb0', ink: '#fff2f9' },  // C
  { bg: '#2dbfae', ink: '#f0fffd' },  // D
  { bg: '#7d8cc4', ink: '#f4f6ff' },  // E
  { bg: '#c98bd9', ink: '#fdf4ff' },  // F
];
/** A barrier belongs to no lane: it is the seam between all of them. */
const BARRIER_SKIN = { bg: '#5a5f7a', ink: '#f4f5fb' };

/** A subagent is of its parent's lane, one step behind it. */
function fadeSkin(skin) {
  const mix = (hex, t) => {
    const n = parseInt(hex.slice(1), 16);
    const to = [0x6a, 0x6e, 0x78];
    const out = [16, 8, 0].map((sh, i) => Math.round((((n >> sh) & 255) * (1 - t)) + (to[i] * t)));
    return `#${out.map((v) => v.toString(16).padStart(2, '0')).join('')}`;
  };
  return { bg: mix(skin.bg, 0.42), ink: skin.ink };
}

function skinFor(a) {
  if (a.barrier) return a.sub ? fadeSkin(BARRIER_SKIN) : BARRIER_SKIN;
  const i = a.lane ? (String(a.lane).toUpperCase().charCodeAt(0) - 65) % LANE_SKIN.length : 0;
  const skin = LANE_SKIN[i] || LANE_SKIN[0];
  return a.sub ? fadeSkin(skin) : skin;
}

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < String(str).length; i += 1) {
    h ^= String(str).charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h);
}

/** One mouth per mood. It is the only feature the id does not choose. */
function mouthPath(status) {
  switch (status) {
    case 'done': return 'M8.1 14.4 q3.9 4 7.8 0';
    case 'running': return 'M8.6 15 q3.4 2.2 6.8 0';
    case 'failed': case 'blocked': return 'M8.4 16.2 q3.6 -3 7.2 0';
    case 'interrupted': return 'M9.2 15.4 q2.8 1.6 4.6 -.6';
    default: return 'M9.4 15.3 h5.2';
  }
}

function avatarSvg(seed, size, status, skin) {
  const h = hash(seed);
  const cap = [0, 35, 70, 145, 215, 250, 290, 325][(h >> 3) % 8];
  const eyeY = 10.2 + ((h >> 6) % 3) * 0.6;
  const eyeR = 1.25 + ((h >> 9) % 2) * 0.35;
  const gap = 3.4 + ((h >> 11) % 3) * 0.35;
  const closed = status === 'pending';
  const eye = (cx) => (closed
    ? `<path d="M${(cx - 1.5).toFixed(1)} ${eyeY} h3" stroke="${skin.ink}" stroke-width="1.2" stroke-linecap="round" opacity=".75" />`
    : `<circle cx="${cx.toFixed(1)}" cy="${eyeY}" r="${eyeR}" fill="${skin.ink}" />`);
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="12" fill="${skin.bg}" />
    <path d="M0 12 A12 12 0 0 1 24 12 Z" fill="rgba(0,0,0,.17)" transform="rotate(${cap} 12 12)" />
    ${eye(12 - gap)}${eye(12 + gap)}
    <path d="${mouthPath(status)}" fill="none" stroke="${skin.ink}" stroke-width="1.35" stroke-linecap="round" opacity=".92" />
  </svg>`;
}

/** The model lives on the badge: who is working and with what, in one object. */
const MODEL_TAG = (m) => {
  const s = String(m || '').toLowerCase();
  if (s.includes('opus')) return 'O';
  if (s.includes('sonnet')) return 'S';
  if (s.includes('haiku')) return 'H';
  return s ? s.slice(0, 1).toUpperCase() : '?';
};

/*
 * The ring separated running from done from failed by hue alone — indigo,
 * green, red: exactly the axis deuteranopia collapses. The stage strip two
 * centimetres above already does this right, with shape. So every settled
 * state gets a glyph, and the shape decides before the colour does.
 */
function statusMark(status) {
  const wrap = (cls, body) => `<span class="tick ${cls}"><svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true">${body}</svg></span>`;
  switch (status) {
    case 'done':
      return wrap('ok', '<path d="M1.8 4.6 L3.6 6.4 L7.2 2.6" fill="none" stroke="var(--on-brand)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />');
    case 'failed':
      return wrap('bad', '<path d="M2.6 2.6 l3.8 3.8 M6.4 2.6 l-3.8 3.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round" />');
    case 'blocked':
      return wrap('bad', '<path d="M2.4 4.5 h4.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />');
    case 'interrupted':
      return wrap('warn', '<path d="M3.4 2.8 v3.4 M5.6 2.8 v3.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />');
    default:
      return '';
  }
}

function avatarHtml(a, size = 28, { plain = false } = {}) {
  const sm = size <= 22 ? ' sm' : '';
  if (plain) return `<span class="av plain">${avatarSvg(a.id, size, a.status, skinFor(a))}</span>`;
  const badge = a.model ? `<span class="badge" title="${esc(a.model)}">${esc(MODEL_TAG(a.model))}</span>` : '';
  return `<span class="av ${esc(a.status)}${sm}">
    ${avatarSvg(a.id, size, a.status, skinFor(a))}<span class="ring"></span>${statusMark(a.status)}${badge}</span>`;
}

// --------------------------------------------------------- what it is doing

/*
 * The last tool call, said as a sentence.
 *
 * `Bash · npx vitest run tests/theme-toggle.test.tsx` makes the reader parse a
 * command to discover that the tests are running. The verb carries the
 * meaning and the argument becomes evidence — which is the order it is read
 * in at a glance.
 */
function humanize(a) {
  if (!a) return null;
  const say = (verb, obj, kind) => ({ verb, obj, kind, ok: a.ok });
  if (a.kind === 'text') return { verb: 'thinking', obj: gist(a.text, 110), ok: true, quiet: true, kind: 'think' };
  // Neither of these is a tool call, and both reach a row: `run` opens an
  // attempt, `result` closes the spawn.
  if (a.kind === 'run') return { verb: a.label === 'started' ? 'starting up' : String(a.label || 'starting over'), obj: '', ok: true, kind: 'think' };
  if (a.kind === 'result') return { verb: a.ok === false ? 'failed' : 'finished', obj: a.text || '', ok: a.ok, kind: 'scan' };
  const t = a.target || '';
  switch (a.name) {
    case 'Bash': {
      if (/\b(vitest|jest|pytest|go test|npm test|pnpm test|yarn test)\b/.test(t)) return say('running the tests', t, 'churn');
      if (/^git commit/.test(t)) return say('committing', t, 'churn');
      if (/^git (status|log|diff|show|rev-parse)/.test(t)) return say('checking git', t, 'scan');
      if (/^git (checkout|stash|reset|merge|rebase)/.test(t)) return say('moving the tree', t, 'churn');
      if (/^(npm|pnpm|yarn) (run )?(build|typecheck|lint)/.test(t)) return say('building', t, 'churn');
      return say('running', t, 'churn');
    }
    case 'Edit': case 'MultiEdit': case 'Update': return say('editing', t, 'churn');
    case 'Write': case 'NotebookEdit': return say('writing', t, 'churn');
    case 'Read': return say('reading', t, 'scan');
    case 'Grep': case 'Glob': return say('searching', t, 'scan');
    case 'Task': case 'Agent': return say('delegating', t, 'orbit');
    case 'Skill': return say('using the skill', t, 'orbit');
    case 'TodoWrite': return say('planning', t, 'think');
    case 'WebFetch': case 'WebSearch': return say('looking it up', t, 'scan');
    case 'result': return say(a.ok === false ? 'failed' : 'finished', a.text || '', 'scan');
    default: return say(String(a.name || 'working').toLowerCase(), t, 'scan');
  }
}

// ------------------------------------------------------------------- copy

/**
 * One copy control, four places: the resume command, a session id, a log path,
 * a lane branch — every string on this page that otherwise gets retyped.
 */
function copyBtnHtml(text, what, { label = '', cls = 'cp', title = '' } = {}) {
  const wide = cls === 'cp' && label ? ' wide' : '';
  return `<button class="${cls}${wide}" data-copy="${esc(text)}" data-what="${esc(what)}" data-label="${esc(label)}"`
    + ` aria-label="Copy ${esc(what)}" title="${esc(title || `Copy ${what}`)}">`
    + copyIcon() + (label ? `<span>${esc(label)}</span>` : '') + '</button>';
}

/**
 * `navigator.clipboard` needs a secure context. Loopback is one; the address
 * `--host` hands another machine is not — and that is exactly the reader who
 * cannot retype a session id by hand. The textarea is the fallback for them.
 */
async function copyText(text) {
  try {
    if (window.isSecureContext && navigator.clipboard) { await navigator.clipboard.writeText(text); return true; }
  } catch { /* fall through */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}

/** `done` is null at rest, true after a copy, false after a refusal. */
function paintCopyBtn(btn, done) {
  btn.classList.toggle('ok', done === true);
  btn.classList.toggle('bad', done === false);
  const label = btn.dataset.label;
  const word = done === true ? 'Copied' : done === false ? 'Copy failed' : label;
  btn.innerHTML = (done === true ? okIcon() : copyIcon()) + (label ? `<span>${esc(word)}</span>` : '');
  btn.setAttribute('aria-label', done === true ? `${btn.dataset.what} copied` : `Copy ${btn.dataset.what}`);
}

async function handleCopy(btn) {
  const ok = await copyText(btn.dataset.copy || '');
  paintCopyBtn(btn, ok);
  clearTimeout(btn.restore);
  btn.restore = setTimeout(() => paintCopyBtn(btn, null), 1400);
}

/**
 * The command the reader is about to retype, in the form they would type it:
 * from the repo root, with the plan relative to it.
 */
function relPlan(s) {
  const root = s.repoRoot ? `${s.repoRoot}/` : '';
  return root && s.plan && s.plan.startsWith(root) ? s.plan.slice(root.length) : (s.plan || '');
}
const cmd = (s, verb) => `plo ${verb} --plan ${relPlan(s)}`;

// ------------------------------------------------------------------ shape

/*
 * The run, as a crew.
 *
 * The server sends lanes holding tasks, because that is how `plo` schedules.
 * Nobody watches a lane work. What this turns it into is a list of agents:
 * one per task that is doing something or has stopped doing it, each carrying
 * the subagents it dispatched.
 */
const tagOf = (t) => (t.lane ? `${String(t.lane).toUpperCase()} · T${t.n}` : `Barrier · T${t.n}`);

function agentOf(t, s, branchOf) {
  const activity = t.activity || [];
  return {
    id: `T${t.n}`,
    n: t.n,
    tag: tagOf(t),
    lane: t.lane,
    barrier: t.barrier,
    sub: false,
    title: t.title,
    status: t.status,
    model: t.model,
    startedAt: t.startedAt,
    endedAt: t.endedAt,
    turns: t.turns,
    outputTokens: t.outputTokens,
    attempts: t.attempts,
    error: t.error,
    resume: cmd(s, 'resume'),
    branch: t.lane ? branchOf[t.lane] || null : null,
    activity,
    // What it did last, whether that was a call or a thought. Not `lastTool`:
    // an agent that has been reasoning for two minutes is not still running
    // the command it ran before it started.
    doing: activity[activity.length - 1] || null,
    children: (t.children || []).map((k) => kidOf(k, t)),
  };
}

/** A subagent, of its parent's lane and nature — that is what the colour
 *  reads. Its label is who it is; its title is what it was asked to do. */
function kidOf(k, t) {
  const activity = k.activity || [];
  return {
    id: k.id,
    tag: k.agentType || 'subagent',
    title: k.title || '',
    lane: t.lane,
    barrier: t.barrier,
    sub: true,
    status: k.status,
    model: k.model,
    startedAt: k.startedAt,
    endedAt: k.endedAt,
    turns: k.turns,
    outputTokens: k.outputTokens,
    activity,
    doing: activity[activity.length - 1] || null,
    children: [],
  };
}

/** What holds a queued task up. A lane is strictly sequential and barriers
 *  run in order after the merge, so the answer is always the thing in front. */
function queueAfter(t, s) {
  if (t.barrier) {
    const i = s.barriers.findIndex((b) => b.n === t.n);
    const prev = i > 0 ? s.barriers[i - 1] : null;
    return prev ? `after T${prev.n}` : 'after the merge';
  }
  const lane = s.lanes.find((l) => l.id === t.lane);
  if (!lane) return '';
  const i = lane.tasks.findIndex((x) => x.n === t.n);
  const prev = lane.tasks.slice(0, i).reverse().find((x) => x.status !== 'done');
  return prev ? `after T${prev.n}` : 'next in the lane';
}

/**
 * What the parallelism bought, once there is nothing left to run.
 *
 * Only on a clean finish. A run that ended with a task blocked has a report
 * to read and a command to retype, and "how it went" over the top of that
 * would be answering a question nobody asked yet.
 */
function outcomeOf(s, tasks) {
  if (!s.totals.total || s.totals.done !== s.totals.total) return null;
  const at = (iso) => { const ms = Date.parse(iso); return Number.isFinite(ms) ? ms : null; };
  const starts = tasks.map((t) => at(t.startedAt)).filter((x) => x != null);
  const ends = tasks.map((t) => at(t.endedAt)).filter((x) => x != null);
  if (!starts.length || !ends.length) return null;
  const i = s.integration || {};
  return {
    // Floored, like `dur()`: rounded, this and the elapsed clock in the topbar
    // disagree by a second about the same span, in the same viewport.
    wallSeconds: Math.max(1, Math.floor((Math.max(...ends) - Math.min(...starts)) / 1000)),
    agentSeconds: Math.round(tasks.reduce((n, t) => {
      const a = at(t.startedAt), b = at(t.endedAt);
      return n + (a != null && b != null && b > a ? (b - a) / 1000 : 0);
    }, 0)),
    commits: tasks.reduce((n, t) => n + (t.commits ? t.commits.length : 0), 0),
    suite: i.suite || null,
    review: i.review || null,
  };
}

function shape(s) {
  const tasks = [...s.lanes.flatMap((l) => l.tasks), ...s.barriers];
  const branchOf = {};
  for (const l of s.lanes) branchOf[l.id] = l.branch;

  // Every task gets an agent, because the feed carries events from tasks that
  // have already settled and each line still has to say who it came from.
  const index = new Map();
  for (const t of tasks) index.set(t.n, agentOf(t, s, branchOf));

  const crew = tasks
    .filter((t) => t.status === 'running' || STOPPED.has(t.status))
    .map((t) => index.get(t.n));

  const ends = tasks.map((t) => Date.parse(t.endedAt)).filter((x) => Number.isFinite(x));

  return {
    crew,
    index,
    queue: tasks.filter((t) => t.status === 'pending').map((t) => ({
      n: t.n, tag: tagOf(t), title: t.title, barrier: t.barrier, after: queueAfter(t, s),
    })),
    settled: tasks.filter((t) => t.status === 'done').map((t) => ({
      n: t.n, tag: tagOf(t), title: t.title, status: t.status,
      outputTokens: t.outputTokens, commits: (t.commits || []).length,
    })),
    outcome: outcomeOf(s, tasks),
    lastEndedAt: ends.length ? Math.max(...ends) : null,
    feed: (s.feed || []).map((ev) => attribute(ev, index)),
  };
}

/**
 * Who a feed line came from. Two `implementer` rows under an identical label,
 * with no face and no parent, on the one surface whose whole job is to tell
 * events apart. The face resolves it because the colour already says the
 * lane; the `title` carries the full path.
 */
function attribute(ev, index) {
  const parent = index.get(ev.n);
  if (!parent) return { ...ev, tag: `T${ev.n}` };
  const kid = ev.parentId ? (parent.children || []).find((k) => k.id === ev.parentId) : null;
  const who = kid || parent;
  return {
    ...ev,
    tag: who.tag,
    by: { id: who.id, lane: who.lane, barrier: who.barrier, sub: who.sub, status: who.status },
    path: kid ? `${parent.tag} › ${kid.tag}` : parent.tag,
  };
}

// ----------------------------------------------------------------- render

function render(s) {
  raw = s;
  $('plan-title').textContent = relPlan(s) || 'plo';

  if (!s.ready) {
    view = null;
    $('plan-name').textContent = s.title || 'plo';
    $('plan-sub').textContent = '';
    paint($('verdict'), '');
    paint($('alerts'), '');
    $('stages').hidden = true;
    for (const id of ['queue-section', 'outcome-section', 'settled-section']) $(id).hidden = true;
    $('crew-section').hidden = false;
    $('crew-tally').textContent = '';
    const host = $('crew');
    host.dataset.mode = 'flat';
    paint(host, `<div class="empty-state">${esc(s.error || s.message || 'nothing to show yet')}</div>`);
    renderFeed();
    return;
  }

  view = shape(s);

  $('plan-name').textContent = s.title || 'plo';
  $('plan-sub').innerHTML = [
    s.base ? `base <code>${esc(s.base.branch)}</code> at <code>${esc(short(s.base.commit))}</code>` : '',
    s.testCommand ? `tests <code>${esc(s.testCommand)}</code>` : '',
    `${plural(s.lanes.length, 'lane')} · max ${s.maxLanes}`,
  ].filter(Boolean).join('<span class="sep">·</span>');

  $('m-progress').textContent = `${s.totals.done}/${s.totals.total}`;
  $('m-cost').textContent = tokens(s.totals.outputTokens);
  // This page is made to sit in a background tab; the tab strip should report.
  const stuck = s.totals.failed + s.totals.blocked;
  document.title = `${stuck ? '⚠ ' : ''}${s.totals.done}/${s.totals.total} · ${s.title}`;

  paint($('verdict'), verdictHtml(s));
  renderStages(s);
  renderAlerts(s);
  renderCrew(s);
  renderQueue();
  renderOutcome(s);
  renderSettled();
  renderFeed();
  tick();
}

const allAgents = () => (view ? view.crew.flatMap((a) => [a, ...(a.children || [])]) : []);
const liveAgents = () => allAgents().filter((a) => a.status === 'running');

/**
 * The run in one sentence, at the top, in the largest type on the page.
 * It counts people, not only tasks: two agents alive inside one task is a
 * fact the task count hides.
 */
function verdictHtml(s) {
  const t = s.totals;
  const hurt = view.crew.filter((a) => STOPPED.has(a.status));
  const live = liveAgents();
  const complete = t.done === t.total;

  const parts = [complete ? `All ${plural(t.total, 'task')} done` : `${t.done} of ${t.total} done`];
  for (const a of hurt.slice(0, 2)) {
    const word = esc((STATUS_WORD[a.status] || a.status).toLowerCase());
    const held = a.endedAt ? `<span class="soft"> for <span data-since="${esc(a.endedAt)}">–</span></span>` : '';
    parts.push(`<span class="bad">${esc(a.tag)} ${word}${held}</span>`);
  }
  if (hurt.length > 2) parts.push(`<span class="soft">+${hurt.length - 2} more</span>`);
  if (live.length) parts.push(`<span class="soft">${plural(live.length, 'agent')} working</span>`);
  else if (!complete) parts.push('<span class="soft">nobody working</span>');

  const mark = hurt.length ? hurt[0].status : live.length ? 'running' : complete ? 'done' : 'pending';
  return statusIcon(mark, 17) + parts.join('<span class="sep">·</span>');
}

/**
 * The pipeline, full width, above everything it explains.
 *
 * Reporting `barrier-failed` as a word asks the reader to already know that
 * barriers run after the merge and before the suite in order to place it.
 * Here the position carries that.
 */
function renderStages(s) {
  const stages = s.stages || [];
  $('stages').hidden = !stages.length;
  paint($('stages'), stages.map((st) => `<li class="stage ${esc(st.status)}">`
    + statusIcon(st.status, 14)
    + `<span class="st-label">${esc(st.label)}</span>`
    + `<span class="sr">${esc(STATUS_WORD[st.status] || st.status)}${st.detail ? ',' : ''}</span>`
    + (st.detail ? `<span class="st-detail" title="${esc(st.detail)}">${esc(st.detail)}</span>` : '')
    + '</li>').join(''));
}

/**
 * A banner that says what went wrong and leaves the reader to retype the fix
 * has done half the job. Every alert here ends in the command it implies.
 */
function renderAlerts(s) {
  const out = [];
  const acts = (html) => `<div class="acts">${html}</div>`;
  const resume = () => copyBtnHtml(cmd(s, 'resume'), 'the resume command', { label: 'Copy resume' });

  if (s.rateLimit) {
    const at = s.rateLimit.resetsAt ? new Date(s.rateLimit.resetsAt * 1000).toLocaleTimeString() : null;
    out.push(`<div class="alert bad">${alertIcon(true)}<div>Usage limit <b>${esc(s.rateLimit.status)}</b> on the ${esc(s.rateLimit.rateLimitType || 'current')} window${at ? ` — resets ${esc(at)}` : ''}. Lanes that died here resume with <code>plo resume</code>.</div>${acts(resume())}</div>`);
  }
  if (s.planChanged) {
    out.push(`<div class="alert">${alertIcon(false)}<div>The plan file changed after <code>plo init</code>. Task numbering may have shifted — re-run <code>plo analyze</code> before resuming.</div>${acts(copyBtnHtml(cmd(s, 'analyze'), 'the analyze command', { label: 'Copy analyze' }))}</div>`);
  }
  for (const a of view.crew.filter((x) => x.status === 'failed' || x.status === 'blocked')) {
    out.push(`<div class="alert bad">${alertIcon(true)}<div><b>${esc(a.tag)}</b> ${esc((STATUS_WORD[a.status] || a.status).toLowerCase())} — ${esc(dedupeStatus(a.status, gist(a.error)) || 'no error recorded')}</div>`
      // Open the row, not a drawer: the account it wrote is one click away
      // under the agent it belongs to, beside what it was doing at the time.
      + acts(resume() + `<button class="chip" data-open="${esc(a.id)}">Read it</button>`) + '</div>');
  }
  paint($('alerts'), out.join(''));
}

// -------------------------------------------------------------- the crew

/** Nouns, not gerunds: the same string has to finish "nobody working — …"
 *  and "waiting on …", and only a noun does both. */
const STAGE_NAMES = {
  run: 'the lane tasks', merge: 'the merge', barriers: 'the barrier tasks',
  suite: 'the full suite', review: 'the cross-lane review',
};

/**
 * What is holding the run up while nobody is alive. "Nothing running" said
 * twice in 150px, with the answer sitting in the stage strip right above.
 *
 * A stage that is under way answers it. When none is — the lanes finished and
 * the merge has not started, which is the emptiest this screen ever gets —
 * the next stage that is not done is the thing being waited on. Saying
 * "waiting to start" there was wrong twice: the run started long ago, and it
 * named nothing.
 */
function runningStage(s) {
  const stages = s.stages || [];
  const running = stages.find((x) => x.status === 'running');
  const st = running || stages.find((x) => x.status !== 'done');
  if (!st) return stages.length ? 'the run is over' : 'waiting to start';
  const label = STAGE_NAMES[st.key] || String(st.label).toLowerCase();
  const said = st.detail ? `${label} · ${st.detail}` : label;
  return running ? said : `waiting on ${said}`;
}

/*
 * The body of the page: one row per working agent, nesting the subagents it
 * dispatched. Outside `plo`'s own process "lane A" does not work — the agent
 * running the task does, and so do the subagents it opened.
 */
function renderCrew(s) {
  const live = liveAgents().length;
  const stopped = allAgents().filter((a) => STOPPED.has(a.status)).length;
  const complete = s.totals.done === s.totals.total;
  // A finished run has no crew; the section leaves rather than announce a void.
  $('crew-section').hidden = !view.crew.length && complete;
  $('crew-tally').textContent = [
    live ? `${live} working` : '',
    stopped ? `${stopped} stopped` : '',
    view.crew.length ? plural(view.crew.length, 'task') : '',
  ].filter(Boolean).join(' · ');

  const host = $('crew');
  if (!view.crew.length) {
    host.dataset.mode = 'flat';
    paint(host, `<div class="crew-empty">${statusIcon('running', 14)}<span>nobody working — <b>${esc(runningStage(s))}</b></span></div>`);
    return;
  }
  if (host.dataset.mode !== 'crew') {
    host.dataset.mode = 'crew';
    host.innerHTML = '';
    delete host.dataset.sig;
  }

  // One node per agent, rebuilt only when its own markup changes: an untouched
  // row keeps whatever the reader had focused inside its drawer.
  for (const a of view.crew) {
    let el = host.querySelector(`[data-card="${CSS.escape(a.id)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.dataset.card = a.id;
      host.appendChild(el);
    }
    const cls = `ag ${a.status}${openIds.has(a.id) ? ' open' : ''}`;
    const html = agentHtml(a, false);
    if (el.dataset.sig !== html || el.className !== cls) {
      el.dataset.sig = html;
      el.className = cls;
      el.innerHTML = html;
    }
  }
  const wanted = view.crew.map((a) => a.id);
  for (const el of [...host.children]) if (!wanted.includes(el.dataset.card)) el.remove();
}

function agentHtml(a, kid = false) {
  const open = openIds.has(a.id);
  const doing = humanize(a.doing);
  const live = a.status === 'running';
  const bad = a.status === 'failed' || a.status === 'blocked';
  // Inherits the parent's nature for the colour, not for the label: a
  // subagent a barrier dispatched is inside one, it is not one.
  const isBarrierTask = a.barrier && !a.sub;

  // Warn is for a call that failed inside an agent that is still going. Once
  // it has stopped, the same failed call is history and amber over it reads as
  // a live problem — a subagent that died is reported by the still orb and the
  // glyph on its face, not by colouring what it was doing at the time.
  const halted = STOPPED.has(a.status);
  const warn = live && doing && doing.ok === false;
  const orb = (kind) => (live || halted
    ? orbHtml(kind, live ? (warn ? 'warn' : '') : 'stopped', kid ? 7 : 8.5)
    : '');

  const line = bad && a.error
    ? `<div class="ag-doing bad">${orb(doing && doing.kind)}<span class="verb">${esc(STATUS_WORD[a.status] || a.status)}</span><span class="err">${esc(dedupeStatus(a.status, gist(a.error, 118)))}</span><span class="more">read it</span></div>`
    // Halted with nothing written down — a subagent never files a report. The
    // last thing it did stands in for the account, in the slot the account
    // would have used, so both stopped rows read the same way.
    : halted && doing
      ? `<div class="ag-doing bad">${orb(doing.kind)}<span class="verb">${esc(STATUS_WORD[a.status] || a.status)}</span>`
        + `<span class="err" title="${esc(doing.obj)}">stopped while ${esc(doing.verb)}${doing.obj ? ` — ${esc(doing.obj)}` : ''}</span></div>`
    : doing
      ? `<div class="ag-doing${warn ? ' warn' : ''}">
           ${orb(doing.kind)}
           <span class="verb">${esc(doing.verb)}</span>
           <span class="obj" title="${esc(doing.obj)}">${esc(doing.obj)}</span>
         </div>`
      : `<div class="ag-doing${halted ? ' bad' : ''}">${orb('think')}<span class="verb">${esc(live ? 'starting up' : STATUS_WORD[a.status] || a.status)}</span></div>`;

  const meta = [
    `<span class="clock"${live ? ` data-since="${esc(a.startedAt || '')}"` : ''}>${live ? '–' : esc(span(a))}</span>`,
    a.turns ? `<span class="drop">${plural(a.turns, 'turn')}</span>` : '',
    a.outputTokens ? `<span class="drop">${tokens(a.outputTokens)} tok</span>` : '',
    a.attempts > 1 ? `<span class="drop">attempt ${a.attempts}</span>` : '',
  ].filter(Boolean).join('');

  const kids = (a.children || []).length
    ? `<div class="kids">${a.children.map((k) => `<div class="kid ag ${esc(k.status)}${openIds.has(k.id) ? ' open' : ''}">${agentHtml(k, true)}</div>`).join('')}</div>`
    : '';

  // The account of whoever stopped comes before the log: it is the answer to
  // the question that made the reader click. Clipped to 118 characters in the
  // header, it existed only in a native `title` — which nobody reads on a
  // second monitor.
  const report = bad && a.error
    ? `<div class="ag-report"><h3>${esc(a.status === 'blocked' ? 'Why it stopped' : 'Error')}</h3>
         <div class="md">${md(a.error)}</div>
         ${a.resume ? `<div class="acts">${copyBtnHtml(a.resume, 'the resume command', { label: 'Copy resume' })}
           ${a.branch ? copyBtnHtml(a.branch, 'the lane branch', { label: a.branch, cls: 'cp' }) : ''}</div>` : ''}
       </div>`
    : '';

  const log = open
    ? `<div class="ag-log">
         <div class="log-head"><b>${esc(a.tag)}</b> · last ${plural((a.activity || []).length, 'event')}
           <div class="grow"></div>
           ${a.n ? `<button class="chip" data-task="${a.n}" aria-controls="panel">Task record</button>` : ''}
         </div>
         <div class="feed">${(a.activity || []).slice().reverse().map((ev) => activityHtml(ev)).join('')
           || '<div class="empty">no events yet</div>'}</div>
       </div>`
    : '';
  const drawer = open ? report + log : '';

  const row = `<button class="ag-row" data-agent="${esc(a.id)}" aria-expanded="${open}">
      ${avatarHtml(a, kid ? 22 : 28)}
      <span class="ag-main">
        <span class="ag-who">
          <span class="ag-tag${isBarrierTask ? ' barrier tip' : ''}"${isBarrierTask ? ` data-tip="${esc(BARRIER_TIP)}"` : ''}>${isBarrierTask ? barrierIcon(11) : ''}${esc(a.tag)}${isBarrierTask ? `<span class="sr">. ${esc(BARRIER_TIP)}</span>` : ''}</span>
          <span class="ag-name">${esc(a.title)}</span>
        </span>
        ${line}
      </span>
      <span class="ag-meta">${meta}</span>
      ${chevIcon()}
    </button>`;

  // A subagent is already wrapped by its parent; a task wraps itself.
  return row + drawer + (kid ? '' : kids);
}

/** Takes out of the account the word the label beside it already carries. */
function dedupeStatus(status, text) {
  const word = (STATUS_WORD[status] || status).split(' ')[0];
  return String(text).replace(new RegExp(`^${word}[.:,\\s—-]+`, 'i'), '');
}

/**
 * How long a call took, once its result came back. Anything under a second
 * gets nothing: a column of "0s" hides the one line this is for, which is the
 * test run that sat there for four minutes.
 */
function took(a) {
  const ms = a.durationMs != null ? a.durationMs
    : (a.at && a.doneAt ? Date.parse(a.doneAt) - Date.parse(a.at) : null);
  if (ms == null || !isFinite(ms) || ms < 1000) return '';
  return ms < 60000 ? `${Math.round(ms / 1000)}s` : dur(ms);
}

function activityHtml(a, who = false) {
  const at = `<span class="at">${esc(clock(a.at))}</span>`;
  // Deliberately not a button: sixty of them would be sixty tab stops through
  // near-identical labels, and the agent it came from is one click away.
  //
  // Two `implementer` rows under an identical label, with no face and no
  // parent, on the one surface whose whole job is to tell events apart. The
  // face resolves it because the colour already says the lane.
  const tag = who
    ? `<span class="who${a.barrier ? ' barrier' : ''}" title="${esc(a.path || a.tag || '')}">`
      + (a.by ? avatarHtml(a.by, 14, { plain: true }) : '')
      + `<span>${esc(a.tag || '')}</span></span>`
    : '';
  const open = `<div class="ln${a.ok === false ? ' bad' : ''}">${at}${tag}`;

  if (a.kind === 'text') return `${open}<span class="ico"></span><span class="say" title="${esc(a.text)}">${esc(a.text)}</span></div>`;
  if (a.kind === 'run') return `${open}<span class="ico">${resultIcon(null)}</span><span class="name sub">${esc(a.label || 'run')}</span></div>`;
  if (a.kind === 'result') {
    const ran = a.durationMs > 1000 ? dur(a.durationMs) : '';
    return `${open}<span class="ico">${resultIcon(a.ok)}</span><span class="name">${esc(a.label || 'result')}</span><span class="arg" title="${esc(a.text || '')}">${esc(a.text || '')}</span><span class="took">${esc(ran)}</span></div>`;
  }
  // A failed call's preview is the whole reason the line is red; it rides in
  // the target column after the target, and the tooltip carries both in full.
  const why = a.ok === false && a.preview ? `<span class="why"> ${esc(a.preview)}</span>` : '';
  return `${open}<span class="ico">${resultIcon(a.ok)}</span>`
    + `<span class="name${a.sub ? ' sub' : ''}">${a.sub ? '↳ ' : ''}${esc(a.name)}</span>`
    + `<span class="arg" title="${esc([a.target, a.ok === false ? a.preview : ''].filter(Boolean).join(' — '))}">${esc(a.target || '')}${why}</span>`
    + `<span class="took">${esc(took(a))}</span></div>`;
}

// ------------------------------------------------------------- the queue

/** What is still going to become an agent, and what is holding each one up. */
function renderQueue() {
  const q = view.queue;
  $('queue-section').hidden = !q.length;
  $('queue-tally').textContent = q.length ? String(q.length) : '';
  paint($('queue'), q.map((t) => `<div class="qrow">
      ${statusIcon('pending', 14)}
      <span class="ag-tag${t.barrier ? ' barrier tip' : ''}"${t.barrier ? ` data-tip="${esc(BARRIER_TIP)}" tabindex="0" role="note"` : ''}>${t.barrier ? barrierIcon(11) : ''}${esc(t.tag)}${t.barrier ? `<span class="sr">. ${esc(BARRIER_TIP)}</span>` : ''}</span>
      <span class="qtitle">${esc(t.title)}</span>
      <span class="after">${esc(t.after)}</span>
    </div>`).join(''));
}

/**
 * The question that pays for the tool — was it worth running these in
 * parallel — used to be answered by a gantt chart, and then by nothing: the
 * run ended in 600px of empty panel. Here it is a two-line sum, which is what
 * it always was.
 */
function renderOutcome(s) {
  const o = view.outcome;
  $('outcome-section').hidden = !o;
  if (!o) return;
  const gain = (o.agentSeconds / o.wallSeconds).toFixed(1);
  const facts = [
    `<span><b>${plural(s.totals.total, 'task')}</b> across ${plural(s.lanes.length, 'lane')}</span>`,
    `<span><b>${tokens(s.totals.outputTokens)}</b> output tokens</span>`,
    `<span><b>${o.commits}</b> commits</span>`,
    o.suite ? `<span><b>${o.suite.skipped ? 'not run' : o.suite.ok ? 'pass' : 'fail'}</b> full suite</span>` : '',
  ].filter(Boolean).join('');
  const review = o.review
    ? `<div class="review">${resultIcon(Boolean(o.review.clean))}<span>${mdInline(esc(o.review.verdict || (o.review.clean ? 'Clean.' : 'Findings recorded.')))}</span></div>`
    : '';
  paint($('outcome'), `
    <div class="headline">
      <b>${esc(dur(o.wallSeconds * 1000))}</b> wall clock
      <span class="vs">against <b style="font-size:15px">${esc(dur(o.agentSeconds * 1000))}</b> of agent time —
        <b style="font-size:15px">${gain}×</b> from ${plural(s.lanes.length, 'lane')}</span>
    </div>
    <div class="facts">${facts}</div>${review}`);
}

/** What is already out of the way — one band, not three sections. */
function renderSettled() {
  const done = view.settled;
  $('settled-section').hidden = !done.length;
  if (!done.length) return;
  paint($('settled'), `<div class="grp">
      <span class="lbl"><b>Done</b> ${done.length}</span>
      ${done.map((t) => `<span class="ag-tag${t.tag.startsWith('Barrier') ? ' barrier' : ''}" title="${esc(t.title)}">${esc(t.tag)}</span>`).join('')}
    </div>`
    + `<span class="lbl">${tokens(done.reduce((n, t) => n + (t.outputTokens || 0), 0))} tokens · ${plural(done.reduce((n, t) => n + t.commits, 0), 'commit')}</span>`);
}

// ----------------------------------------------------- the firehose, kept

const EDIT_TOOLS = new Set(['Edit', 'MultiEdit', 'Write', 'NotebookEdit', 'Update']);
/** Everything on a line a reader could plausibly be looking for. */
const feedText = (a) => [a.name, a.target, a.text, a.preview, a.label, a.tag].filter(Boolean).join(' ').toLowerCase();

function feedMatch(a) {
  if (feedKind === 'err' && a.ok !== false) return false;
  if (feedKind === 'bash' && a.name !== 'Bash') return false;
  if (feedKind === 'edit' && !EDIT_TOOLS.has(a.name)) return false;
  return !feedQuery || feedText(a).includes(feedQuery);
}

function renderFeed() {
  const all = view ? view.feed : [];
  const feed = all.filter(feedMatch);
  // A filtered count that hides the total reads as a shrinking run.
  $('p-count').textContent = !all.length ? ''
    : feed.length === all.length ? plural(all.length, 'event') : `${feed.length} of ${all.length}`;

  const host = $('p-feed');
  // Repainted every second: a reader who scrolled back must not be yanked to
  // the top by an event they were not reading.
  const top = host.scrollTop;
  const changed = paint(host, feed.length
    ? feed.slice().reverse().map((a) => activityHtml(a, true)).join('')
    : `<div class="empty">${all.length ? 'no event matches' : 'no agent events yet'}</div>`);
  if (changed) host.scrollTop = top;
}

// ------------------------------------------------------------- the record

/*
 * The task record: session id, log path, declared writes, plan steps — what
 * this task *is*, as opposed to what its agent is doing. The row's drawer
 * answers the second question; this answers the first, and both are one click
 * deep.
 */
async function loadTask(n) {
  try {
    const r = await fetch(`/api/task?n=${encodeURIComponent(n)}`);
    const body = await r.json();
    if (openTask !== n) return; // a newer click already won the panel
    if (!r.ok) { $('d-body').innerHTML = `<pre>${esc(body.error || r.statusText)}</pre>`; return; }
    drawTask(body.task);
  } catch (e) {
    if (openTask === n) $('d-body').innerHTML = `<pre>${esc(e.message)}</pre>`;
  }
}

function drawTask(t) {
  $('d-title').innerHTML = `${statusIcon(t.status)}<span class="label">T${t.n} · ${esc(t.title)}</span>`;

  const statusPill = t.status === 'done' ? 'ok' : t.status === 'running' ? 'live' : t.status === 'pending' ? '' : 'bad';
  const kv = [
    ['Status', `<span class="pill ${statusPill}">${esc(STATUS_WORD[t.status] || t.status)}${t.barrier ? ' · barrier' : ''}</span>`],
    ['Lane', t.lane ? esc(String(t.lane).toUpperCase()) : '—'],
    // A running task's duration is a clock, and a clock in the payload would
    // repaint this panel every second — with the reader's focus inside it.
    ['Duration', t.status === 'running' && t.startedAt ? `<span data-since="${esc(t.startedAt)}">–</span>` : esc(span(t))],
    ['Turns', String(t.turns || 0)],
    ['Attempts', String(t.attempts || 0)],
    ['Output tokens', typeof t.outputTokens === 'number' ? t.outputTokens.toLocaleString() : '—'],
    ['Model', `<span class="mono">${esc(t.model || '—')}</span>`],
    ['Session', t.sessionId
      ? `<span class="v-cp"><span class="mono">${esc(t.sessionId)}</span>${copyBtnHtml(t.sessionId, 'the session id')}</span>`
      : '<span class="mono">—</span>'],
    ['Commits', (t.commits || []).length ? `<span class="mono">${t.commits.map((c) => esc(short(c))).join(' ')}</span>` : '—'],
    ['Log', t.logFile
      ? `<span class="v-cp"><span class="mono">${esc(t.logFile)}</span>${copyBtnHtml(t.logFile, 'the log path')}</span>`
      : '<span class="mono">—</span>'],
  ];

  // No `.pad` wrapper. The rows were inset 12px from a panel that already has
  // a gutter, so every rule between them stopped short of the edge it divided.
  const parts = [`<div class="list kv">${kv.map(([k, v]) => `<div class="kv-row"><span class="k">${KV_ICON[k] || ''}${esc(k)}</span><span class="v">${v}</span></div>`).join('')}</div>`];

  if (t.error) parts.push(`<h3>${t.status === 'blocked' ? 'Why it stopped' : 'Error'}</h3><div class="md">${md(t.error)}</div>`);
  // A blocked task's error IS its final message; printing both twice reads as
  // two findings when there is one. The stored error keeps the report's line
  // breaks and the digest collapses them, so compare on flattened text.
  const flat = (x) => String(x || '').replace(/\s+/g, ' ').trim();
  const resultText = t.result && (t.result.body || t.result.text);
  const duplicated = resultText && t.error
    && (flat(t.error).includes(flat(resultText).slice(0, 60)) || flat(resultText).includes(flat(t.error).slice(0, 60)));
  if (resultText && !duplicated) parts.push(`<h3>Agent result${t.result.clipped ? ' · clipped' : ''}</h3><div class="md">${md(resultText)}</div>`);
  if (t.files && t.files.writes.length) parts.push(`<h3>Declared writes</h3><pre>${t.files.writes.map(esc).join('\n')}</pre>`);
  if (t.files && t.files.excluded.length) parts.push(`<h3>Excluded by negation</h3><pre>${t.files.excluded.map(esc).join('\n')}</pre>`);
  if (t.steps && t.steps.length) {
    parts.push(`<h3>Plan steps</h3><ul class="steps tick">${t.steps.map((st) => `<li class="${st.checked ? 'on' : ''}">${checkbox(st.checked)}<span>${mdInline(esc(st.text))}</span></li>`).join('')}</ul>`);
  }
  parts.push(`<h3>Activity${t.truncated ? ' · tail' : ''}</h3><div class="pad"><div class="feed" style="margin:0;max-height:none">${
    t.activity.length ? t.activity.slice().reverse().map((a) => activityHtml(a)).join('') : '<div class="empty">no agent events recorded</div>'
  }</div></div>`);

  // Painted, not assigned: the stream redraws this every second while a task
  // is open, and an unguarded write destroys whatever the reader had focused.
  if (paint($('d-body'), parts.join(''))) tick();
}

// -------------------------------------------------------------- the panel

/*
 * One drawer, two contents, and it is modal at every width. The column beside
 * the board is gone: it spent 40% of the screen on the events nobody reads
 * twice, which is the whole reason this redesign exists.
 */
function applyPanel() {
  document.body.dataset.panel = panelOpen ? 'open' : '';
  const p = $('panel');
  p.setAttribute('aria-hidden', panelOpen ? 'false' : 'true');
  if (panelOpen) p.removeAttribute('inert');
  else p.setAttribute('inert', '');

  const onTask = openTask != null;
  $('p-feed').hidden = onTask;
  $('p-tools').hidden = onTask;
  $('d-body').hidden = !onTask;
  $('p-back').hidden = !onTask;
  $('p-count').hidden = onTask;
  if (!onTask) $('d-title').textContent = 'Run activity';
}

/**
 * `#task=4` survives a reload and pastes into Slack, which is most of what a
 * URL is for. `pushState` never fires `hashchange`, so the page can write the
 * hash without hearing itself and reopening what it just opened.
 */
const hashTask = () => {
  const m = /^#task=(\d+)$/.exec(location.hash || '');
  return m ? Number(m[1]) : null;
};

function writeHash(n) {
  const want = n == null ? '' : `#task=${n}`;
  if (location.hash === want) return;
  if (n == null) history.replaceState(null, '', location.pathname + location.search);
  else history.pushState(null, '', want);
}

window.addEventListener('hashchange', () => {
  const n = hashTask();
  if (n == null) { if (openTask != null) backToFeed(); return; }
  if (n !== openTask) showTask(n);
});

function showFeed(trigger) {
  if (trigger) openedFrom = trigger;
  openTask = null;
  panelOpen = true;
  writeHash(null);
  applyPanel();
  renderFeed();
  $('p-q').focus();
}

function showTask(n, trigger) {
  if (trigger) openedFrom = trigger;
  openTask = n;
  panelOpen = true;
  writeHash(n);
  applyPanel();
  $('d-close').focus();
  loadTask(n);
}

/** Back to the run feed, keeping the drawer where it is. */
function backToFeed() {
  openTask = null;
  writeHash(null);
  applyPanel();
  renderFeed();
  $('p-feed').scrollTop = 0;
}

function closePanel() {
  if (!panelOpen) return;
  openTask = null;
  panelOpen = false;
  writeHash(null);
  // Focus must not stay inside a container that is about to be inert.
  if (openedFrom && document.contains(openedFrom)) openedFrom.focus();
  openedFrom = null;
  applyPanel();
  renderFeed();
}

/** Keep Tab inside the drawer while it is open — a modal that leaks focus
 *  behind its own scrim is worse than one that never claimed to be modal. */
function trapTab(e) {
  if (!panelOpen || e.key !== 'Tab') return;
  const focusable = [...$('panel').querySelectorAll('button, input, select, [href], [tabindex]:not([tabindex="-1"])')]
    .filter((el) => !el.hidden && !el.closest('[hidden]') && el.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/** Expand one agent and put it where the reader can see it. The alert that
 *  reports a failure is usually above the fold and the row rarely is. */
function openAgent(id) {
  openIds.add(id);
  if (raw && raw.ready) renderCrew(raw);
  const el = $('crew').querySelector(`[data-card="${CSS.escape(id)}"]`);
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

// ------------------------------------------------------------- interaction

document.addEventListener('click', (e) => {
  const cp = e.target.closest('[data-copy]');
  if (cp) { handleCopy(cp); return; }

  const jump = e.target.closest('[data-open]');
  if (jump) { openAgent(jump.dataset.open); return; }

  const record = e.target.closest('[data-task]');
  if (record) { showTask(Number(record.dataset.task), record); return; }

  const row = e.target.closest('.ag-row');
  if (row) {
    const id = row.dataset.agent;
    if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
    if (raw && raw.ready) renderCrew(raw);
    return;
  }

  if (e.target.closest('#open-feed')) { showFeed(e.target.closest('#open-feed')); return; }
  if (e.target.closest('#p-back')) { backToFeed(); return; }
  if (e.target.closest('#d-close') || e.target.id === 'scrim') closePanel();
  // Closing on any outside click made it impossible to hold a feed line
  // against the agent row it came from — which is why both surfaces exist.
});

document.addEventListener('keydown', (e) => {
  trapTab(e);
  if (e.key === 'Escape') closePanel();
});

$('p-q').addEventListener('input', (e) => { feedQuery = e.target.value.trim().toLowerCase(); renderFeed(); });
$('p-kind').addEventListener('change', (e) => { feedKind = e.target.value; renderFeed(); });
$('p-wrap').addEventListener('click', () => {
  const on = $('p-wrap').getAttribute('aria-pressed') !== 'true';
  $('p-wrap').setAttribute('aria-pressed', String(on));
  $('p-feed').classList.toggle('wrap', on);
});

/*
 * A tooltip only knows which way to open at the instant it opens: the row
 * scrolls, the crew grows, and the same anchor is mid-screen now and eighteen
 * pixels off the bottom a minute from now.
 */
document.addEventListener('mouseover', (e) => {
  const tip = e.target.closest && e.target.closest('.tip');
  if (!tip) return;
  tip.classList.toggle('up', tip.getBoundingClientRect().bottom + 76 > window.innerHeight);
}, true);
document.addEventListener('focusin', (e) => {
  const tip = e.target.closest && e.target.closest('.tip');
  if (tip) tip.classList.toggle('up', tip.getBoundingClientRect().bottom + 76 > window.innerHeight);
});

applyPanel();
// A link into a task opens on it.
if (hashTask() != null) showTask(hashTask());

// ------------------------------------------------------------------ timers

/** The clocks are what make a still screen look alive. */
function tick() {
  if (document.hidden) return;
  if (raw && raw.ready) {
    const first = raw.totals.firstStartedAt;
    $('m-elapsed').textContent = !first ? '–'
      : raw.totals.active || !view || !view.lastEndedAt ? since(first)
        : dur(view.lastEndedAt - Date.parse(first));
  }
  for (const el of document.querySelectorAll('[data-since]')) {
    el.textContent = el.dataset.since ? since(el.dataset.since) : '–';
  }
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

// --------------------------------------------------------------- transport

function setLive(on, text) {
  $('live').className = `live ${on ? 'on' : 'off'}`;
  $('live-text').textContent = text;
}

let lastEventAt = 0;
const source = new EventSource('/api/stream');
source.addEventListener('snapshot', (e) => {
  const payload = JSON.parse(e.data);
  skew = payload.now - Date.now();
  lastEventAt = Date.now();
  render(payload.snapshot);
  // The record is a live view too — a task finishing while it is open should
  // show that, not a frozen snapshot from when it was clicked.
  if (openTask != null && panelOpen) loadTask(openTask);
});
source.onopen = () => setLive(true, 'live');
source.onerror = () => setLive(false, 'reconnecting…');
setInterval(() => {
  if (source.readyState !== 1) return;
  const age = Math.round((Date.now() - lastEventAt) / 1000);
  setLive(true, age < 30 ? 'live' : `live · quiet ${dur(age * 1000)}`);
}, 1000);
</script>
</body>
</html>
