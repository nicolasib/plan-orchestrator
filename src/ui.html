<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>plo — run monitor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%235e6ad2'/%3E%3C/svg%3E" />
<style>
  /*
   * Visual language: Linear. Dense rows, quiet chrome, one indigo accent, and
   * status carried by a shape before a colour. Type is the system UI face;
   * monospace is kept for the things that are literally code — paths,
   * commands, shas, branches.
   *
   * Every colour is a token, so the light theme is a value swap, not a fork.
   */
  :root {
    color-scheme: dark light;

    --bg: #08090a;
    --surface: #0f1011;
    --surface-2: #141518;
    --line: #23242a;
    --line-soft: #191a1e;
    --hover: rgba(255, 255, 255, .045);

    --text: #f7f8f8;
    --text-2: #8a8f98;      /* 5.86:1 on surface */
    --text-3: #787d87;      /* 4.61:1 — the floor for anything readable */
    --text-faint: #5b606a;  /* decorative only: separators, empty glyphs */

    --accent: #5e6ad2;
    --accent-ink: #8b95e8;  /* the accent when it has to be small text */
    --accent-soft: rgba(94, 106, 210, .16);
    --on-accent: #ffffff;

    --done: #4cb782;
    --done-soft: rgba(76, 183, 130, .14);
    --run: #f2c94c;
    --run-soft: rgba(242, 201, 76, .14);
    --fail: #eb5757;
    --fail-soft: rgba(235, 87, 87, .14);
    --warn: #fc7840;
    --idle: #62666d;

    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .28);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, .48), 0 2px 8px rgba(0, 0, 0, .32);
    --scrim: rgba(4, 5, 6, .5);

    --ui: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #fafbfc;
      --line: #e5e6e8;
      --line-soft: #eeeff1;
      --hover: rgba(0, 0, 0, .035);

      --text: #1c1d21;
      --text-2: #6b6f76;
      --text-3: #6b6f76;
      --text-faint: #9aa0a8;

      --accent-ink: #4a54b8;
      --accent-soft: rgba(94, 106, 210, .12);

      --done: #17794b;
      --done-soft: rgba(23, 121, 75, .12);
      --run: #8a6400;
      --run-soft: rgba(217, 164, 6, .16);
      --fail: #b4232b;
      --fail-soft: rgba(180, 35, 43, .1);
      --warn: #a4490f;
      --idle: #9aa0a8;

      --shadow: 0 1px 2px rgba(0, 0, 0, .06);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, .12), 0 2px 8px rgba(0, 0, 0, .06);
      --scrim: rgba(20, 22, 26, .28);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 400 13px/1.5 var(--ui);
    letter-spacing: -.011em;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border: 3px solid transparent; background-clip: content-box; border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; }

  /* Fluid to a real desk monitor. Nothing here is a column of prose: what
     grows is the board and the tables, which is where the reading happens. */
  .wrap { max-width: 1840px; margin: 0 auto; padding: 0 20px 72px; }
  .grow { flex: 1 1 auto; min-width: 0; }

  /* ------------------------------------------------------------- topbar */
  .topbar {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: center; gap: 12px;
    min-height: 48px; padding: 6px 20px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .crumbs { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .badge-app {
    display: grid; place-items: center; width: 21px; height: 21px; flex: 0 0 auto;
    background: var(--accent); color: var(--on-accent); border-radius: 5px;
    font-size: 9.5px; font-weight: 700; letter-spacing: -.02em;
  }
  h1 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .stats { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
  .stat {
    display: inline-flex; align-items: baseline; gap: 5px;
    padding: 3px 8px; border-radius: var(--radius-sm);
    font-size: 12px; color: var(--text-2); white-space: nowrap;
  }
  .stat b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .live {
    display: inline-flex; align-items: center; gap: 6px; margin-left: 6px;
    padding: 3px 10px 3px 8px; border: 1px solid var(--line); border-radius: 999px;
    font-size: 11.5px; color: var(--text-2); background: var(--surface-2); white-space: nowrap;
  }
  .live .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--idle); }
  .live.on .pip { background: var(--done); box-shadow: 0 0 0 3px var(--done-soft); animation: breathe 2.4s ease-in-out infinite; }
  .live.off .pip { background: var(--fail); box-shadow: 0 0 0 3px var(--fail-soft); }
  @keyframes breathe { 0%, 100% { opacity: 1 } 50% { opacity: .4 } }
  @media (prefers-reduced-motion: reduce) { .live.on .pip { animation: none } }

  /* ------------------------------------------------------------ progress */
  .summary { display: grid; gap: 11px; padding: 18px 0 10px; }
  /* This page lives on a second monitor. One line has to carry the state of
     the run at a glance, from across the room, before any of the detail. */
  .verdict {
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 0; min-width: 0;
    font-size: 15px; font-weight: 600; letter-spacing: -.021em; color: var(--text);
  }
  .verdict:empty { display: none; }
  .verdict svg { flex: 0 0 auto; }
  .verdict .soft { color: var(--text-2); font-weight: 500; }
  .verdict .bad { color: var(--fail); }
  .verdict .sep { color: var(--text-faint); font-weight: 400; }
  .track { display: flex; gap: 3px; height: 4px; }
  .track i { flex: 1 1 0; border-radius: 2px; background: var(--line); }
  .track i.done { background: var(--accent); }
  .track i.running { background: var(--run); }
  .track i.failed, .track i.blocked { background: var(--fail); }
  .track i.interrupted { background: var(--warn); }
  .subline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-2); padding-bottom: 4px; }
  .subline .sep { color: var(--text-faint); }

  /* -------------------------------------------------------------- alerts */
  .alerts { display: grid; gap: 8px; margin-top: 16px; }
  .alerts:empty { display: none; }
  .alert {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); font-size: 12.5px; color: var(--text);
  }
  .alert svg { flex: 0 0 auto; margin-top: 2px; }
  .alert.bad { border-color: color-mix(in srgb, var(--fail) 38%, var(--line)); background: var(--fail-soft); }
  .alert b { font-weight: 600; }
  .alert[data-task] { cursor: pointer; transition: background .12s ease; }
  .alert[data-task]:hover { background: color-mix(in srgb, var(--fail-soft) 60%, var(--hover)); }
  .alert .more { margin-left: auto; align-self: center; flex: 0 0 auto; color: var(--text-2); font-size: 11.5px; }
  .alert code { color: var(--text-2); }

  /* --------------------------------------------------------------- board */
  .board {
    /* 1fr, not a 460px cap: during integration a single card is the only
       thing alive on the page, and it should own the width instead of
       floating in half a screen of nothing. A wide card is a wide feed. */
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr));
    gap: 12px; margin-top: 16px; align-items: start;
  }
  .board:empty { display: none; }
  .card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card > .head { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); }
  .card .kind { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: -.01em; }
  .card .kind.barrier { color: var(--accent-ink); }
  .card .branch {
    font-family: var(--mono); font-size: 11px; color: var(--text-3);
    background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 4px;
    padding: 1px 6px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 12px 2px; }
  .chip {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    min-height: 24px; padding: 2px 8px 2px 6px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--surface-2);
    font-size: 11.5px; color: var(--text-2); font-variant-numeric: tabular-nums;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .chip:hover { background: var(--hover); color: var(--text); border-color: var(--text-faint); }
  .chip.running { color: var(--text); border-color: color-mix(in srgb, var(--run) 42%, var(--line)); background: var(--run-soft); }
  .chip.failed, .chip.blocked { color: var(--text); border-color: color-mix(in srgb, var(--fail) 42%, var(--line)); background: var(--fail-soft); }

  .now { padding: 10px 14px 12px; display: grid; gap: 6px; min-width: 0; }
  .now .title { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 500; }
  .now .title .tno { color: var(--text-2); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .now .title .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .now .meta { display: flex; gap: 10px; flex-wrap: wrap; min-width: 0; font-size: 11.5px; color: var(--text-3); }
  .now .meta .clock { font-variant-numeric: tabular-nums; color: var(--text-2); }
  .now .meta .tool { font-family: var(--mono); font-size: 11px; }

  .feed { margin: 0 12px 12px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--surface-2); max-height: 208px; overflow: auto; }
  .feed .ln { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  .feed .ln:last-child { border-bottom: 0; }
  .feed .ico { flex: 0 0 auto; display: grid; place-items: center; width: 12px; }
  .feed .name { font-size: 12px; font-weight: 500; flex: 0 0 auto; }
  .feed .name.sub { color: var(--text-2); font-weight: 400; }
  .feed .arg { font-family: var(--mono); font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; }
  .feed .say { font-size: 12px; color: var(--text-3); font-style: italic; overflow: hidden; text-overflow: ellipsis; }
  .feed .empty { display: flex; align-items: center; height: 40px; padding: 0 10px; color: var(--text-3); font-size: 12px; }

  .card > .foot {
    display: flex; gap: 14px; flex-wrap: wrap; padding: 9px 14px;
    border-top: 1px solid var(--line-soft); background: var(--surface-2);
    font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums;
  }

  /* ------------------------------------------------------------ sections */
  section { margin-top: 26px; }
  h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: -.01em; }
  .list { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
  /* Columns, not two clumps pinned to the far edges. Comparing $7.87 against
     $4.44 used to mean sweeping 750px of empty row; in a column it is one
     glance down. --num keeps the three numeric tracks the same width. */
  .row, .list.table .grid {
    --num: 76px;
    --lane-cols: 15px minmax(0, auto) minmax(0, auto) minmax(0, 1fr) var(--num) var(--num) var(--num);
  }
  .row {
    display: grid; align-items: center; gap: 12px; min-height: 36px; padding: 5px 14px;
    border-bottom: 1px solid var(--line-soft); font-size: 12.5px;
    transition: background .12s ease;
  }
  .row:last-child { border-bottom: 0; }
  .row > * { min-width: 0; }
  .row.task { grid-template-columns: 15px 30px minmax(0, 1fr) minmax(0, auto); }
  .row.lane { grid-template-columns: var(--lane-cols); }
  .row.head {
    min-height: 27px; border-bottom-color: var(--line); background: var(--surface-2);
    font-size: 10.5px; font-weight: 600; letter-spacing: .045em; text-transform: uppercase; color: var(--text-2);
  }
  .row[data-task] { cursor: pointer; }
  .row[data-task]:hover { background: var(--hover); }
  .row .ic, .row .cell { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row .tag { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .name, .row .mono, .row .err, .row .right {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .row .mono { color: var(--text-3); }
  .row .err { color: var(--fail); flex: 0 1 auto; }
  .row .num {
    text-align: right; white-space: nowrap; color: var(--text-3);
    font-size: 11.5px; font-variant-numeric: tabular-nums;
  }
  .row .num b { font-weight: 500; color: var(--text-2); }
  .row .right { justify-self: end; color: var(--text-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .row .chips { padding: 0; }
  /* An `auto` track only agrees with itself: every row being its own grid is
     why the header sat 30px off its own column. One grid for the table, rows
     borrowing its tracks via subgrid — and the row still draws its own box,
     which `display: contents` would have thrown away along with the hover. */
  .list.table { overflow: auto; }
  .list.table .grid { display: grid; grid-template-columns: var(--lane-cols); column-gap: 12px; padding: 0 14px; min-width: 600px; }
  @supports (grid-template-columns: subgrid) {
    /* The row keeps its own padding so its background and rule still reach the
       card edges — but a subgrid's padding eats the tracks it inherits (a 15px
       icon column became 1px). The negative margin gives the padding back. */
    .list.table .row.lane { grid-column: 1 / -1; grid-template-columns: subgrid; margin-inline: -14px; }
  }

  .kv-row { display: flex; align-items: center; gap: 12px; min-height: 34px; padding: 5px 14px; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; }
  .kv-row:last-child { border-bottom: 0; }
  .kv-row .k { color: var(--text-2); width: 150px; flex: 0 0 auto; }
  .kv-row .v { overflow-wrap: anywhere; min-width: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px;
    font-size: 11.5px; font-weight: 500; border: 1px solid var(--line); color: var(--text-2); background: var(--surface-2);
  }
  .pill.ok { color: var(--done); border-color: color-mix(in srgb, var(--done) 38%, var(--line)); background: var(--done-soft); }
  .pill.bad { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 38%, var(--line)); background: var(--fail-soft); }
  .pill.live { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent) 42%, var(--line)); background: var(--accent-soft); }

  .flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--text-2); font-size: 12px; }
  .flow .arrow { color: var(--text-faint); }
  .flow .node { font-variant-numeric: tabular-nums; }
  .flow .node.done { color: var(--text-3); }
  .flow .node.running { color: var(--text); font-weight: 600; }

  /* Two key-value tables of four rows each: side by side they cost half the
     scroll and use the width that widening the shell just handed them. */
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px, 100%), 1fr)); gap: 0 20px; }
  .pair section { min-width: 0; }

  .empty-state { padding: 56px 0; text-align: center; color: var(--text-2); font-size: 13px; }

  /* -------------------------------------------------------------- drawer */
  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .14s ease; z-index: 4; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  aside {
    position: fixed; top: 0; right: 0; height: 100%; width: min(540px, 100vw);
    background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg);
    transform: translateX(100%);
    /* Hidden, not merely off-screen: a translated panel still counts toward
       the document's scroll width on a narrow viewport, and its controls stay
       focusable behind the scrim. */
    visibility: hidden;
    transition: transform .16s cubic-bezier(.32, .72, 0, 1), visibility 0s .16s;
    display: flex; flex-direction: column; z-index: 5;
  }
  aside.open { transform: none; visibility: visible; transition: transform .16s cubic-bezier(.32, .72, 0, 1); }
  @media (prefers-reduced-motion: reduce) { aside, .scrim, .row, .chip { transition: none } }
  aside .head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  aside h2#d-title { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--text); min-width: 0; }
  aside h2#d-title .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .body { overflow: auto; padding: 12px 0 48px; }
  aside h3 { margin: 22px 16px 8px; font-size: 11.5px; font-weight: 600; color: var(--text-2); }
  aside .pad { padding: 0 16px; }
  aside pre { margin: 0 16px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 8px; white-space: pre-wrap; word-break: break-word; color: var(--text-2); font: 400 11.5px/1.6 var(--mono); }
  .close {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 8px; border-radius: var(--radius-sm); color: var(--text-2); font-size: 12px;
  }
  .close:hover { background: var(--hover); color: var(--text); }
  kbd {
    font-family: var(--ui); font-size: 10.5px; line-height: 1; padding: 3px 5px;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    background: var(--surface-2); color: var(--text-2);
  }
  ul.steps { margin: 0; padding: 0 16px 0 34px; color: var(--text-2); font-size: 12.5px; }
  ul.steps li { margin: 3px 0; }
  ul.steps li.on { color: var(--text); }
</style>
</head>
<body>

<header class="topbar">
  <div class="crumbs">
    <span class="badge-app" aria-hidden="true">plo</span>
    <h1 id="plan-title">…</h1>
  </div>
  <div class="grow"></div>
  <div class="stats">
    <span class="stat"><b id="m-progress">–</b> done</span>
    <span class="stat"><b id="m-cost">–</b> spent</span>
    <span class="stat"><b id="m-elapsed">–</b> elapsed</span>
    <span class="live off" id="live"><i class="pip"></i><span id="live-text">connecting…</span></span>
  </div>
</header>

<div class="wrap">
  <div class="summary">
    <p class="verdict" id="verdict" role="status" aria-live="polite"></p>
    <div class="track" id="bar" aria-hidden="true"></div>
  </div>
  <div class="subline" id="plan-sub"></div>

  <main>
    <div class="alerts" id="alerts" role="status" aria-live="polite"></div>

    <div class="board" id="board"></div>

    <section id="settled-section" hidden>
      <h2>Settled lanes</h2>
      <div class="list table" id="settled" role="table" aria-label="Settled lanes"></div>
    </section>

    <section id="barriers-section" hidden>
      <h2>Barriers</h2>
      <div class="list" id="barriers"></div>
    </section>

    <div class="pair">
      <section id="integration-section" hidden>
        <h2>Integration</h2>
        <div class="list" id="integration"></div>
      </section>

      <section id="dag-section" hidden>
        <h2>Lane plan</h2>
        <div class="list" id="dag"></div>
      </section>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-hidden="true" inert aria-labelledby="d-title">
  <div class="head">
    <h2 id="d-title">Task</h2>
    <div class="grow"></div>
    <button class="close" id="d-close" aria-label="Close panel"><kbd>Esc</kbd> Close</button>
  </div>
  <div class="body" id="d-body"></div>
</aside>

<script>
'use strict';

const $ = (id) => document.getElementById(id);

let snap = null;       // last snapshot payload
let skew = 0;          // serverNow - clientNow, so timers agree with the run
let openTask = null;   // task number shown in the drawer
let openedFrom = null; // element that opened it, to hand focus back on close

/**
 * Rewriting innerHTML that did not change is not just wasted work: it destroys
 * whatever the reader had focused inside it. With a snapshot arriving every
 * second, tabbing to a task row was a race the reader could not win.
 */
function paint(el, html) {
  if (el.dataset.sig === html) return false;
  el.dataset.sig = html;
  el.innerHTML = html;
  return true;
}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const short = (sha) => String(sha || '').slice(0, 7);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

/**
 * An agent that blocks writes a report, not a sentence — headings, bold, the
 * whole account. A banner takes its first real line; the rest is one click
 * away in the drawer, where there is room for it.
 */
function gist(text, max = 150) {
  const line = String(text || '')
    .split('\n')
    .map((l) => l.replace(/^#{1,6}\s*/, '').replace(/\*\*/g, '').replace(/`/g, '').trim())
    .find((l) => l.length > 2) || '';
  return line.length > max ? `${line.slice(0, max - 1).trimEnd()}…` : line;
}

function dur(ms) {
  if (ms == null || !isFinite(ms) || ms < 0) return '–';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = (v) => String(v).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}
const since = (iso) => (iso ? dur(Date.now() + skew - Date.parse(iso)) : '–');
/** A settled task gets the time it took, not a clock that keeps running. */
const span = (t) => (t.startedAt && t.endedAt ? dur(Date.parse(t.endedAt) - Date.parse(t.startedAt)) : t.startedAt ? since(t.startedAt) : '–');
// Cost lands only when a process exits, so zero means "not reported yet",
// not "this was free". Saying $0.00 there is a lie the reader acts on.
const money = (v) => (typeof v === 'number' && v > 0 ? `$${v.toFixed(2)}` : '—');

// ------------------------------------------------------------ status marks

const STATUS_WORD = {
  done: 'Done', running: 'In progress', pending: 'Todo',
  failed: 'Failed', blocked: 'Blocked', interrupted: 'Interrupted',
};

/**
 * Status reads as a shape first and a colour second — the same reason Linear
 * draws a ring that fills rather than a coloured dot. Colour alone excludes
 * anyone who cannot separate the hues, and these six states matter.
 */
function statusIcon(status, size = 15) {
  const s = size, c = s / 2;
  const open = `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" aria-hidden="true" focusable="false">`;
  const ring = (stroke, dash = '') => `<circle cx="${c}" cy="${c}" r="${c - 1.25}" fill="none" stroke="${stroke}" stroke-width="1.5"${dash} />`;

  switch (status) {
    case 'done':
      return `${open}<circle cx="${c}" cy="${c}" r="${c - 0.5}" fill="var(--accent)" />
        <path d="M${c * 0.6} ${c + c * 0.03} l${c * 0.28} ${c * 0.3} l${c * 0.55} -${c * 0.6}" fill="none" stroke="var(--on-accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>`;
    case 'running': {
      // Half-filled ring: a pie drawn as one fat dashed stroke, Linear-style.
      const r = (c - 1.25) / 2;
      const circ = 2 * Math.PI * r;
      return `${open}${ring('var(--run)')}
        <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--run)" stroke-width="${(r * 2).toFixed(2)}"
          stroke-dasharray="${(circ * 0.5).toFixed(2)} ${circ.toFixed(2)}" transform="rotate(-90 ${c} ${c})" /></svg>`;
    }
    case 'failed':
      return `${open}${ring('var(--fail)')}
        <path d="M${c - 2.3} ${c - 2.3} l4.6 4.6 M${c + 2.3} ${c - 2.3} l-4.6 4.6" stroke="var(--fail)" stroke-width="1.5" stroke-linecap="round" /></svg>`;
    case 'blocked':
      return `${open}${ring('var(--fail)')}
        <path d="M${c - 2.6} ${c} h5.2" stroke="var(--fail)" stroke-width="1.6" stroke-linecap="round" /></svg>`;
    case 'interrupted':
      return `${open}${ring('var(--warn)', ' stroke-dasharray="2.6 2.2"')}
        <circle cx="${c}" cy="${c}" r="1.6" fill="var(--warn)" /></svg>`;
    default:
      return `${open}${ring('var(--idle)')}</svg>`;
  }
}

function resultIcon(ok) {
  if (ok === null || ok === undefined) {
    return `<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="2" fill="var(--text-faint)" /></svg>`;
  }
  return ok
    ? `<svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><path d="M2.2 5.6 L4.3 7.7 L8.8 3.2" fill="none" stroke="var(--done)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>`
    : `<svg width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><path d="M2.8 2.8 l5.4 5.4 M8.2 2.8 l-5.4 5.4" stroke="var(--fail)" stroke-width="1.5" stroke-linecap="round" /></svg>`;
}

const alertIcon = (bad) => {
  const c = bad ? 'var(--fail)' : 'var(--warn)';
  return `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
    <circle cx="7" cy="7" r="6.25" fill="none" stroke="${c}" stroke-width="1.5" />
    <path d="M7 3.6 v3.9" stroke="${c}" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="7" cy="10" r=".85" fill="${c}" /></svg>`;
};

/** Two branches folding into one: the barrier card's mark. */
const mergeIcon = () => `<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true">
  <path d="M2.8 1.6 v2.6 c0 2.2 1.5 2.9 3.2 2.9 h3.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
  <path d="M2.8 11.4 v-2.6 c0-2.2 1.5-2.9 3.2-2.9 h3.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="10.2" cy="6.5" r="1.7" fill="currentColor" /></svg>`;

// --------------------------------------------------------------- rendering

function render(s) {
  snap = s;
  $('plan-title').textContent = s.title || 'plo';

  if (!s.ready) {
    $('plan-sub').textContent = s.plan || '';
    paint($('board'), `<div class="empty-state">${esc(s.error || s.message || 'nothing to show yet')}</div>`);
    paint($('bar'), '');
    paint($('verdict'), '');
    paint($('alerts'), '');
    for (const id of ['settled-section', 'barriers-section', 'integration-section', 'dag-section']) $(id).hidden = true;
    return;
  }

  const all = [...s.lanes.flatMap((l) => l.tasks), ...s.barriers];

  $('plan-sub').innerHTML = [
    s.base ? `base <code>${esc(s.base.branch)}</code> at <code>${esc(short(s.base.commit))}</code>` : '',
    s.testCommand ? `tests <code>${esc(s.testCommand)}</code>` : '',
    `${plural(s.lanes.length, 'lane')} · max ${s.maxLanes}`,
  ].filter(Boolean).join('<span class="sep">·</span>');

  $('m-progress').textContent = `${s.totals.done}/${s.totals.total}`;
  $('m-cost').textContent = money(s.totals.costUsd);
  // This page is made to sit in a background tab; the tab strip should report.
  const stuck = s.totals.failed + s.totals.blocked;
  document.title = `${stuck ? '⚠ ' : ''}${s.totals.done}/${s.totals.total} · ${s.title}`;

  paint($('bar'), all.map((t) => `<i class="${t.status}"></i>`).join(''));
  paint($('verdict'), verdictHtml(s));

  renderAlerts(s);
  renderBoard(s);
  renderBarriers(s);
  renderIntegration(s);
  renderDag(s);
  tick();
}

/**
 * The run in one sentence, at the top, in the largest type on the page.
 * Making the reader count rings to learn "nothing is running and T4 died six
 * hours ago" is making them work for the one fact they came for.
 */
function verdictHtml(s) {
  const t = s.totals;
  const all = [...s.lanes.flatMap((l) => l.tasks), ...s.barriers];
  const hurt = all.filter((x) => x.status === 'failed' || x.status === 'blocked' || x.status === 'interrupted');
  const running = all.filter((x) => x.status === 'running');
  const complete = t.done === t.total;

  const parts = [complete ? `All ${plural(t.total, 'task')} done` : `${t.done} of ${t.total} done`];
  for (const x of hurt.slice(0, 2)) {
    const word = esc((STATUS_WORD[x.status] || x.status).toLowerCase());
    const held = x.endedAt ? `<span class="soft"> for <span data-since="${esc(x.endedAt)}">–</span></span>` : '';
    parts.push(`<span class="bad">T${x.n} ${word}${held}</span>`);
  }
  if (hurt.length > 2) parts.push(`<span class="soft">+${hurt.length - 2} more</span>`);
  if (running.length) parts.push(`<span class="soft">${plural(running.length, 'task')} running</span>`);
  else if (!complete) parts.push('<span class="soft">nothing running</span>');

  const mark = hurt.length ? hurt[0].status : running.length ? 'running' : complete ? 'done' : 'pending';
  return statusIcon(mark, 17) + parts.join('<span class="sep">·</span>');
}

function renderAlerts(s) {
  const out = [];
  if (s.rateLimit) {
    const at = s.rateLimit.resetsAt ? new Date(s.rateLimit.resetsAt * 1000).toLocaleTimeString() : null;
    out.push(`<div class="alert bad">${alertIcon(true)}<div>Usage limit <b>${esc(s.rateLimit.status)}</b> on the ${esc(s.rateLimit.rateLimitType || 'current')} window${at ? ` — resets ${esc(at)}` : ''}. Lanes that died here resume with <code>plo resume</code>.</div></div>`);
  }
  if (s.planChanged) {
    out.push(`<div class="alert">${alertIcon(false)}<div>The plan file changed after <code>plo init</code>. Task numbering may have shifted — re-run <code>plo analyze</code> before resuming.</div></div>`);
  }
  for (const t of [...s.lanes.flatMap((l) => l.tasks), ...s.barriers].filter((t) => t.status === 'failed' || t.status === 'blocked')) {
    out.push(`<div class="alert bad" data-task="${t.n}" role="button" tabindex="0" aria-haspopup="dialog">${alertIcon(true)}<div><b>T${t.n}</b> ${esc((STATUS_WORD[t.status] || t.status).toLowerCase())} — ${esc(gist(t.error) || 'no error recorded')}</div><span class="more">Details</span></div>`);
  }
  paint($('alerts'), out.join(''));
}

/** The first thing in a task list that still wants attention. */
function currentOf(tasks) {
  return tasks.find((t) => t.status === 'running')
    || tasks.find((t) => t.status === 'failed' || t.status === 'blocked' || t.status === 'interrupted')
    || tasks.find((t) => t.status === 'pending');
}

const sumTurns = (tasks) => tasks.reduce((n, t) => n + (t.turns || 0), 0);
const sumCommits = (tasks) => tasks.reduce((n, t) => n + (t.commits ? t.commits.length : 0), 0);
const sumCost = (tasks) => tasks.reduce((n, t) => n + (typeof t.costUsd === 'number' ? t.costUsd : 0), 0);

function chipsHtml(tasks) {
  return `<div class="chips">${tasks.map((t) => {
    const name = `Task ${t.n}, ${esc(t.title)}, ${esc(STATUS_WORD[t.status] || t.status)}`;
    return `<button class="chip ${t.status}" data-task="${t.n}" aria-haspopup="dialog" aria-label="${name}" title="${name}">${statusIcon(t.status, 13)}${t.n}</button>`;
  }).join('')}</div>`;
}

function activityHtml(a) {
  if (a.kind === 'text') return `<div class="ln"><span class="ico"></span><span class="say">${esc(a.text)}</span></div>`;
  if (a.kind === 'run') return `<div class="ln"><span class="ico">${resultIcon(null)}</span><span class="name sub">${esc(a.label || 'run')}</span></div>`;
  if (a.kind === 'result') return `<div class="ln"><span class="ico">${resultIcon(a.ok)}</span><span class="name">${esc(a.label || 'result')}</span><span class="arg">${esc(a.text || '')}</span></div>`;
  return `<div class="ln"><span class="ico">${resultIcon(a.ok)}</span><span class="name${a.sub ? ' sub' : ''}">${a.sub ? '↳ ' : ''}${esc(a.name)}</span><span class="arg">${esc(a.target || '')}</span></div>`;
}

function feedPlaceholder(t) {
  if (t.status === 'pending') return 'waiting for its turn';
  if (t.status === 'running') return 'started — no agent events yet';
  return t.error ? gist(t.error, 90) : STATUS_WORD[t.status] || t.status;
}

/**
 * One card, whether it holds a lane or the barrier that runs after them all.
 * A barrier gets the same treatment because during integration it is the only
 * thing running, and a thin row under three "lane complete" cards is not a
 * report on it.
 */
function cardHtml({ kind, label, sub, subTitle, tasks, current }) {
  const live = current && current.status === 'running';
  const feed = live && current.activity.length
    ? current.activity.slice().reverse().map(activityHtml).join('')
    : `<div class="empty">${current ? esc(feedPlaceholder(current)) : 'every task settled'}</div>`;

  return `
    <div class="head">
      <span class="kind ${kind}">${kind === 'barrier' ? mergeIcon() : ''}${esc(label)}</span>
      <div class="grow"></div>
      ${sub ? `<span class="branch" title="${esc(subTitle || sub)}">${esc(sub)}</span>` : ''}
    </div>
    ${chipsHtml(tasks)}
    <div class="now">
      ${current
        ? `<div class="title">${statusIcon(current.status)}<span class="tno">T${current.n}</span><span class="label">${esc(current.title)}</span></div>
           <div class="meta">
             <span class="clock"${live ? ` data-since="${esc(current.startedAt || '')}"` : ''}>${live ? '–' : esc(span(current))}</span>
             <span>${plural(current.turns || 0, 'turn')}</span>
             ${current.attempts > 1 ? `<span>attempt ${current.attempts}</span>` : ''}
             ${current.lastTool ? `<span class="tool">${esc(current.lastTool.name)}</span>` : ''}
           </div>`
        : '<div class="title"><span class="label">Every task settled</span></div>'}
    </div>
    <div class="feed">${feed}</div>
    <div class="foot">
      <span>${plural(sumTurns(tasks), 'turn')}</span>
      <span>${plural(sumCommits(tasks), 'commit')}</span>
      <span>${money(sumCost(tasks))}</span>
    </div>`;
}

/**
 * Cards go to whatever is still working; everything finished collapses into a
 * one-line strip. Before this, integration showed three "lane complete" cards
 * and hid the running barrier in a thin row underneath.
 */
function renderBoard(s) {
  const cards = s.lanes.filter((l) => !l.settled).map((lane) => ({
    key: `lane:${lane.id}`,
    sig: JSON.stringify(lane),
    html: cardHtml({
      kind: 'lane', label: `Lane ${lane.label}`, sub: lane.branch || 'no branch yet',
      subTitle: lane.worktree, tasks: lane.tasks, current: currentOf(lane.tasks),
    }),
  }));

  if (s.activeBarrier != null) {
    cards.push({
      key: 'barrier',
      sig: JSON.stringify(s.barriers),
      html: cardHtml({
        kind: 'barrier', label: 'Barrier', sub: 'merged tree',
        subTitle: 'Barrier tasks run after every lane has merged',
        tasks: s.barriers, current: s.barriers.find((t) => t.n === s.activeBarrier),
      }),
    });
  }

  const host = $('board');
  for (const card of cards) {
    let el = host.querySelector(`[data-card="${CSS.escape(card.key)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'card';
      el.dataset.card = card.key;
      host.appendChild(el);
    }
    // Rebuild only what changed: an untouched card keeps its feed scrolled
    // where the reader left it.
    if (el.dataset.sig !== card.sig) {
      el.dataset.sig = card.sig;
      el.innerHTML = card.html;
    }
  }
  const wanted = cards.map((c) => c.key);
  for (const el of [...host.children]) if (!wanted.includes(el.dataset.card)) el.remove();

  const settled = s.lanes.filter((l) => l.settled);
  $('settled-section').hidden = !settled.length;
  const head = `<div class="row lane head" role="row">
      <span role="columnheader" aria-label="Status"></span>
      <span role="columnheader">Lane</span>
      <span role="columnheader">Tasks</span>
      <span role="columnheader">Branch</span>
      <span class="num" role="columnheader">Turns</span>
      <span class="num" role="columnheader">Commits</span>
      <span class="num" role="columnheader">Cost</span>
    </div>`;
  paint($('settled'), !settled.length ? '' : `<div class="grid" role="rowgroup">` + head + settled.map((lane) => `<div class="row lane" role="row">
      <span class="ic" role="cell">${statusIcon('done')}</span>
      <span class="tag" role="cell">Lane ${esc(lane.label)}</span>
      <span class="cell" role="cell">${chipsHtml(lane.tasks)}</span>
      <span class="mono" role="cell" title="${esc(lane.branch || '')}">${esc(lane.branch || '')}</span>
      <span class="num" role="cell"><b>${sumTurns(lane.tasks)}</b></span>
      <span class="num" role="cell"><b>${sumCommits(lane.tasks)}</b></span>
      <span class="num" role="cell"><b>${money(sumCost(lane.tasks))}</b></span>
    </div>`).join('') + '</div>');
}

function rowHtml(t) {
  const bits = [];
  if (t.commits && t.commits.length) bits.push(`${plural(t.commits.length, 'commit')} ${t.commits.map(short).join(' ')}`);
  if (t.turns) bits.push(plural(t.turns, 'turn'));
  if (t.attempts > 1) bits.push(`${t.attempts} attempts`);
  if (t.reconciled) bits.push('reconciled from git');
  return `<div class="row task" data-task="${t.n}" tabindex="0" role="button" aria-haspopup="dialog">
    <span class="ic">${statusIcon(t.status)}</span>
    <span class="tag">T${t.n}</span>
    <span class="cell">
      <span class="name">${esc(t.title)}</span>
      ${t.error ? `<span class="err">${esc(gist(t.error, 70))}</span>` : ''}
    </span>
    <span class="right">${esc(bits.join('  ·  '))}</span>
  </div>`;
}

function renderBarriers(s) {
  $('barriers-section').hidden = !s.barriers.length || s.activeBarrier != null;
  paint($('barriers'), s.barriers.map(rowHtml).join(''));
}

function renderIntegration(s) {
  const i = s.integration || {};
  const pill = (text, kind) => `<span class="pill ${kind}">${esc(text)}</span>`;
  const statusKind = i.status === 'done' ? 'ok'
    : String(i.status).includes('failed') ? 'bad'
      : i.status === 'pending' ? '' : 'live';

  const rows = [
    ['Status', pill(i.status || 'pending', statusKind)],
    ['Merged lanes', (i.mergedLanes || []).length ? esc(i.mergedLanes.join(', ')) : '<span class="mono">none</span>'],
    ['Full suite', i.suite ? pill(i.suite.ok ? 'pass' : 'fail', i.suite.ok ? 'ok' : 'bad') : '<span class="mono">not run</span>'],
    ['Cross-lane review', i.review ? pill(i.review.verdict || (i.review.clean ? 'clean' : 'findings'), i.review.clean ? 'ok' : 'bad') : '<span class="mono">not run</span>'],
  ];
  $('integration-section').hidden = false;
  paint($('integration'), rows.map(([k, v]) => `<div class="kv-row"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`).join(''));
}

function renderDag(s) {
  $('dag-section').hidden = false;
  const flow = (tasks) => tasks.map((t) => `<span class="node ${t.status}">T${t.n}</span>`).join('<span class="arrow">→</span>');
  const rows = s.lanes.map((l) => `<div class="kv-row"><span class="k">Lane ${esc(l.label)}</span><span class="v"><span class="flow">${flow(l.tasks)}</span></span></div>`);
  if (s.barriers.length) rows.push(`<div class="kv-row"><span class="k">Barriers</span><span class="v"><span class="flow">${flow(s.barriers)}</span></span></div>`);
  paint($('dag'), rows.join(''));
}

// ------------------------------------------------------------------ timers

function tick() {
  if (!snap || !snap.ready || document.hidden) return;
  $('m-elapsed').textContent = snap.totals.firstStartedAt ? since(snap.totals.firstStartedAt) : '–';
  for (const el of document.querySelectorAll('[data-since]')) {
    el.textContent = el.dataset.since ? since(el.dataset.since) : '–';
  }
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

// ------------------------------------------------------------------ drawer

async function showTask(n, trigger) {
  if (trigger) openedFrom = trigger;
  const firstOpen = openTask == null;
  openTask = n;
  $('drawer').classList.add('open');
  $('drawer').setAttribute('aria-hidden', 'false');
  $('drawer').removeAttribute('inert');
  $('scrim').classList.add('open');
  if (firstOpen) $('d-close').focus();
  try {
    const r = await fetch(`/api/task?n=${encodeURIComponent(n)}`);
    const body = await r.json();
    if (!r.ok) { $('d-body').innerHTML = `<pre>${esc(body.error || r.statusText)}</pre>`; return; }
    drawTask(body.task);
  } catch (e) {
    $('d-body').innerHTML = `<pre>${esc(e.message)}</pre>`;
  }
}

function drawTask(t) {
  $('d-title').innerHTML = `${statusIcon(t.status)}<span class="label">T${t.n} · ${esc(t.title)}</span>`;

  const statusPill = t.status === 'done' ? 'ok' : t.status === 'running' ? 'live' : t.status === 'pending' ? '' : 'bad';
  const kv = [
    ['Status', `<span class="pill ${statusPill}">${esc(STATUS_WORD[t.status] || t.status)}${t.barrier ? ' · barrier' : ''}</span>`],
    ['Lane', t.lane ? esc(String(t.lane).toUpperCase()) : '—'],
    ['Duration', esc(span(t))],
    ['Turns', String(t.turns || 0)],
    ['Attempts', String(t.attempts || 0)],
    ['Output tokens', (t.outputTokens || 0).toLocaleString()],
    ['Cost', money(t.costUsd)],
    ['Model', `<span class="mono">${esc(t.model || '—')}</span>`],
    ['Session', `<span class="mono">${esc(t.sessionId || '—')}</span>`],
    ['Commits', (t.commits || []).length ? `<span class="mono">${t.commits.map((c) => esc(short(c))).join(' ')}</span>` : '—'],
    ['Log', `<span class="mono">${esc(t.logFile || '—')}</span>`],
  ];

  const parts = [`<div class="pad"><div class="list">${kv.map(([k, v]) => `<div class="kv-row"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`).join('')}</div></div>`];

  if (t.error) parts.push(`<h3>${t.status === 'blocked' ? 'Why it stopped' : 'Error'}</h3><pre>${esc(t.error)}</pre>`);
  // A blocked task's error IS its final message; printing both twice reads as
  // two findings when there is one.
  // The stored error keeps the report's line breaks; the digest collapses
  // them. Compare on flattened text or the duplicate slips through.
  const flat = (x) => String(x || '').replace(/\s+/g, ' ').trim();
  const resultText = t.result && t.result.text;
  const duplicated = resultText && t.error
    && (flat(t.error).includes(flat(resultText).slice(0, 60)) || flat(resultText).includes(flat(t.error).slice(0, 60)));
  if (resultText && !duplicated) parts.push(`<h3>Agent result</h3><pre>${esc(resultText)}</pre>`);
  if (t.files && t.files.writes.length) parts.push(`<h3>Declared writes</h3><pre>${t.files.writes.map(esc).join('\n')}</pre>`);
  if (t.files && t.files.excluded.length) parts.push(`<h3>Excluded by negation</h3><pre>${t.files.excluded.map(esc).join('\n')}</pre>`);
  if (t.steps && t.steps.length) {
    parts.push(`<h3>Plan steps</h3><ul class="steps">${t.steps.map((s) => `<li class="${s.checked ? 'on' : ''}">${s.checked ? '☑' : '☐'} ${esc(s.text)}</li>`).join('')}</ul>`);
  }
  parts.push(`<h3>Activity${t.truncated ? ' · tail' : ''}</h3><div class="pad"><div class="feed" style="margin:0;max-height:none">${
    t.activity.length ? t.activity.slice().reverse().map(activityHtml).join('') : '<div class="empty">no agent events recorded</div>'
  }</div></div>`);

  $('d-body').innerHTML = parts.join('');
}

function closeDrawer() {
  if (openTask == null) return;
  openTask = null;
  // Focus must not stay inside a container that is about to be aria-hidden.
  if (openedFrom && document.contains(openedFrom)) openedFrom.focus();
  openedFrom = null;
  $('drawer').classList.remove('open');
  $('drawer').setAttribute('aria-hidden', 'true');
  // Off-screen is not out of the tab order: without inert the drawer's
  // controls stay focusable behind an aria-hidden container.
  $('drawer').setAttribute('inert', '');
  $('scrim').classList.remove('open');
}

/** Keep Tab inside the drawer while it is open — a modal that leaks focus
 *  behind its own scrim is worse than one that never claimed to be modal. */
function trapTab(e) {
  if (openTask == null || e.key !== 'Tab') return;
  const focusable = $('drawer').querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])');
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

document.addEventListener('click', (e) => {
  const hit = e.target.closest('[data-task]');
  if (hit) { showTask(Number(hit.dataset.task), hit); return; }
  if (e.target.id === 'scrim' || e.target.closest('#d-close')) closeDrawer();
});
document.addEventListener('keydown', (e) => {
  trapTab(e);
  if (e.key === 'Escape') closeDrawer();
  const hit = e.target.closest && e.target.closest('[data-task][tabindex]');
  if (hit && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showTask(Number(hit.dataset.task), hit); }
});

// --------------------------------------------------------------- transport

function setLive(on, text) {
  $('live').className = `live ${on ? 'on' : 'off'}`;
  $('live-text').textContent = text;
}

let lastEventAt = 0;
const source = new EventSource('/api/stream');
source.addEventListener('snapshot', (e) => {
  const payload = JSON.parse(e.data);
  skew = payload.now - Date.now();
  lastEventAt = Date.now();
  render(payload.snapshot);
  // The drawer is a live view too — a task finishing while it is open should
  // show that, not a frozen snapshot from when it was clicked.
  if (openTask != null) showTask(openTask);
});
source.onopen = () => setLive(true, 'live');
source.onerror = () => setLive(false, 'reconnecting…');
setInterval(() => {
  if (source.readyState !== 1) return;
  const age = Math.round((Date.now() - lastEventAt) / 1000);
  setLive(true, age < 30 ? 'live' : `live · quiet ${dur(age * 1000)}`);
}, 1000);
</script>
</body>
</html>
