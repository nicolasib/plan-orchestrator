<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>plo</title>
<link rel="icon" href="data:," />
<style>
/*
 * The operator panel: one green-phosphor screen with five tabs, a footer that
 * reads the whole run, and a little operator for every agent.
 *
 * Colours only through the tokens in :root. Every `animation` lives inside the
 * no-preference media query, so a reader who asked for less motion gets still
 * frames, and `body.frozen` (the stream is down) stops whatever is left: with
 * no stream, nothing on this screen may pretend to be alive.
 */
@font-face {
  font-family: 'Roboto Condensed';
  src: url('/assets/roboto-condensed.ttf') format('truetype');
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

:root {
  --g: #39ff7e; --gd: rgba(57,255,126,.5); --gf: rgba(57,255,126,.12); --ink: #06140b; --al: #ffb13d;
  --fig: #43ff86; --ln: #052812;
  color-scheme: dark;
}

html, body { height: 100%; }
body { margin: 0; background: var(--ink); }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- the screen */
.screen { position:relative; height:100vh; box-sizing:border-box; padding:12px 26px 12px; overflow:hidden; display:flex; flex-direction:column;
  background: radial-gradient(ellipse at 50% 42%, color-mix(in srgb, var(--g) 9%, var(--ln)) 0%, var(--ln) 50%, var(--ink) 100%);
  box-shadow: inset 0 0 90px color-mix(in srgb, var(--ink) 82%, transparent), inset 0 0 24px color-mix(in srgb, var(--g) 7%, transparent);
  color:var(--g); font-family:'Roboto Condensed', sans-serif; font-weight:500; font-size:18px; line-height:1.22;
  text-shadow: 0 0 6px color-mix(in srgb, var(--g) 42%, transparent); }
.screen::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:60;
  background: repeating-linear-gradient(to bottom, color-mix(in srgb, var(--ink) 22%, transparent) 0 1px, transparent 1px 3px); }
.screen::before { content:""; position:absolute; left:0; right:0; height:140px; top:-140px; z-index:59; pointer-events:none;
  background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--g) 4.5%, transparent), transparent); }
@keyframes roll { to { top:110%; } }
@keyframes blink { 0%, 49% { opacity:1; } 50%, 100% { opacity:.2; } }
@keyframes blinkbg { 0%, 49% { background:var(--al); color:var(--ink); } 50%, 100% { background:transparent; color:var(--al); } }
.screen button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; text-shadow:inherit; padding:0; }
.screen button:focus-visible { outline:2px solid var(--g); outline-offset:2px; }
.screen ::-webkit-scrollbar { width:5px; } .screen ::-webkit-scrollbar-thumb { background:var(--gd); }
.dim { opacity:.5; }
.screen code { font-family:inherit; background:var(--gf); padding:0 5px; }

.tabs { display:flex; gap:40px; align-items:flex-end; height:40px; padding:0 26px; border-bottom:2px solid var(--g); font-weight:700; font-size:25px; letter-spacing:.5px; }
.tabs .tablist { display:flex; gap:40px; align-items:flex-end; align-self:stretch; }
.tabs .tab { position:relative; padding:0 6px 3px; opacity:.55; }
.tabs .tab:hover { opacity:.85; }
.tabs .tab.on { opacity:1; }
.tabs .tab.on::before, .tabs .tab.on::after { content:""; position:absolute; bottom:-2px; width:8px; height:62%; border-top:2px solid var(--g); }
.tabs .tab.on::before { left:-6px; border-left:2px solid var(--g); }
.tabs .tab.on::after { right:-6px; border-right:2px solid var(--g); }
.tabs .right { margin-left:auto; align-self:center; display:flex; align-items:center; gap:18px; min-width:0; font-size:15px; letter-spacing:.6px; }
.tabs .plan { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; opacity:.7; font-weight:500; }
.tabs .chip { font-size:15px; white-space:nowrap; }
.tabs .sig { white-space:nowrap; }
.tabs .sig.al { color:var(--al); text-shadow:0 0 6px color-mix(in srgb, var(--al) 40%, transparent); }
.subs { display:flex; gap:24px; padding:5px 0 0 38px; font-size:19px; height:32px; }
.subs button { opacity:.36; } .subs button.on { opacity:1; } .subs button:hover { opacity:.8; }
#view { flex:1; min-height:0; padding-top:8px; overflow:auto; }
.vt { margin:0 0 6px; padding:0 10px; font-size:14px; font-weight:700; letter-spacing:.9px; opacity:.55; }
.foot { display:flex; gap:6px; margin-top:8px; font-size:19px; font-weight:700; }
.foot .seg { background:var(--gf); padding:3px 14px; display:flex; align-items:center; gap:10px; white-space:nowrap; }
.foot .grow { flex:1; min-width:0; }
.foot .grow em { font-style:normal; font-weight:500; font-size:16px; overflow:hidden; text-overflow:ellipsis; }
.foot .bar { flex:1; height:13px; border:2px solid var(--g); min-width:60px; }
.foot .bar i { display:block; height:100%; background:var(--g); }
.foot .seg.al { background:var(--al); color:var(--ink); text-shadow:none; }
.foot .lim .bar { flex:none; width:56px; min-width:0; }
.foot .seg.al .bar { border-color:var(--ink); } .foot .seg.al .bar i { background:var(--ink); }
.hrow { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; } .hrow h4 { margin:0; }
.screen .copy { font:700 12px 'Roboto Condensed', sans-serif; letter-spacing:1px; color:var(--al); background:none; border:1.5px solid var(--al); padding:1px 8px; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; text-shadow:0 0 6px color-mix(in srgb, var(--al) 40%, transparent); }
.screen .copy:hover, .screen .copy.ok { background:var(--al); color:var(--ink); text-shadow:none; }

/* Every view's columns sit under its title, which takes the other 24px. The
   grids are classes, not inline styles, so the widths below can redraw them. */
.cols { display:grid; gap:18px; height:calc(100% - 24px); }
.cols.agents { grid-template-columns: 270px 1fr 300px; }
.cols.inv, .cols.quests { grid-template-columns: 1fr 380px; }
.cols.nums { grid-template-columns: 1fr 1fr; }
.cols.lanes { grid-template-columns: 1fr 220px; }
.cols.radio { grid-template-columns: 290px 1fr; }
.cols.radio > .col:last-child { overflow:hidden; }
.col { min-height:0; overflow:auto; }
.gh { font-size:14px; opacity:.55; padding:8px 10px 2px; letter-spacing:.9px; font-weight:700; }
.li { position:relative; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:2px 10px 2px 24px; cursor:pointer; white-space:nowrap; }
.li:hover:not(.sel) { background:var(--gf); }
.li.sel { background:var(--g); color:var(--ink); text-shadow:none; }
.li.kid { padding-left:42px; }
.li.run::before { content:""; position:absolute; left:9px; top:50%; width:7px; height:7px; margin-top:-3.5px; background:currentColor; }
.li.kid.run::before { left:27px; }
.tg { font-size:14px; font-weight:700; padding:0 6px; letter-spacing:.5px; }
.tg.bad { background:var(--al); color:var(--ink); text-shadow:none; }
.tg.warn { outline:1.5px dashed var(--al); outline-offset:-1px; color:var(--al); }
.li.sel .tg.bad { background:var(--ink); color:var(--al); }
.li.sel .tg.warn { outline-color:var(--ink); color:var(--ink); }
.kv { display:flex; justify-content:space-between; gap:10px; padding:3px 10px; background:var(--gf); margin-bottom:3px; }
.kv > span:first-child { opacity:.8; }
.pn { margin-bottom:12px; }
.pn h4 { margin:0 0 5px; font-size:14px; font-weight:700; opacity:.6; letter-spacing:1px; }
.note { padding:6px 10px; background:var(--gf); border-left:3px solid var(--g); }
.note.bad { border-left-color:var(--al); color:var(--al); }
.ac { display:grid; grid-template-columns: 62px 66px 1fr; gap:6px; font-size:16px; padding:2px 0; border-bottom:1px solid var(--gf); }
.ac .o { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ac.bad { color:var(--al); }
.lnk { text-decoration:underline; cursor:pointer; }
.icons { display:flex; gap:3px; flex-wrap:nowrap; justify-content:center; }
.icons .ic { display:flex; align-items:center; gap:6px; background:var(--gf); padding:5px 8px; font-size:20px; font-weight:700; white-space:nowrap; }
.icons .ic div { display:flex; flex-direction:column; line-height:1; }
.icons .ic small { font-size:11px; opacity:.7; font-weight:500; letter-spacing:.6px; margin-bottom:2px; }
.hero { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; }
.hero .who { font-size:24px; font-weight:700; letter-spacing:.4px; }
.hero .now { font-size:18px; max-width:330px; min-height:44px; }
/* agents: a row is a button. A button does not stretch on its own, and
   `.screen button` outranks `.li` and drops its padding: both put back. */
button.li { width:100%; box-sizing:border-box; text-align:left; padding:2px 10px 2px 24px; }
button.li > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.li .tg { flex:none; }
.note .tx { white-space:pre-line; overflow-wrap:anywhere; }
.note .cmd { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:6px; }
.note .cmd code { overflow-wrap:anywhere; }
.li.alert { cursor:default; }
.li.alert .go { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; text-align:left; }
.li.alert .act { display:flex; align-items:center; gap:8px; }

/* ---------- the operator: two frames, one shown at a time */
.vb { position:relative; display:inline-block; line-height:0; filter: drop-shadow(0 0 5px var(--gd)); }
.vb.al { --fig:var(--al); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--al) 45%, transparent)); }
.vb .q2 { position:absolute; left:0; top:0; opacity:0; }
@keyframes q-half { 0% { opacity:0 } 50% { opacity:1 } }
@keyframes q-wink { 0% { opacity:0 } 93% { opacity:1 } 98% { opacity:0 } }
@keyframes q-half-1 { 0% { opacity:1 } 50% { opacity:0 } }
@keyframes q-wink-1 { 0% { opacity:1 } 93% { opacity:0 } 98% { opacity:1 } }
/* Important author rules outrank animations: frame 1 and only frame 1. */
body.frozen .vb .q2 { opacity:0 !important; }
body.frozen .vb .q1 { opacity:1 !important; }

/* condition */
.cond { position:relative; height:calc(100% - 24px); display:flex; flex-direction:column; }
.cond .stage { position:relative; flex:1; min-height:0; }
.cond .fig { position:absolute; left:50%; top:50%; transform:translate(-50%,-52%); }
.dash { position:absolute; display:flex; flex-direction:column; gap:3px; cursor:pointer; font-size:15px; font-weight:700; letter-spacing:.5px; }
.dash i { display:block; height:7px; background:var(--g); box-shadow:0 0 8px var(--gd); }
.dash.bad { color:var(--al); } .dash.bad i { background:var(--al); }
.dash span { opacity:.85; white-space:nowrap; }

/* inv */
.tbl { width:100%; border-collapse:collapse; font-size:17px; }
.tbl th { text-align:left; font-weight:700; font-size:13px; opacity:.6; padding:2px 8px; letter-spacing:.8px; }
.tbl td { padding:2px 8px; white-space:nowrap; }
.tbl tr.r { cursor:pointer; } .tbl tr.r:not(.sel):hover td { background:var(--gf); }
.tbl tr.sel td { background:var(--g); color:var(--ink); text-shadow:none; }
.tbl tr.sel .tg.bad { background:var(--ink); color:var(--al); }
.tbl tr.sel .tg.warn { outline-color:var(--ink); color:var(--ink); }
.tries { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
.tries span { background:var(--gf); padding:1px 8px; }
.tries span.f { color:var(--al); outline:1.5px solid var(--al); outline-offset:-1.5px; }
.rec .rt { font-size:22px; font-weight:700; margin:2px 0 4px; }
.rec .kv > span:last-child { min-width:0; text-align:right; overflow-wrap:anywhere; }
.rec .val { padding:3px 10px; background:var(--gf); overflow-wrap:anywhere; }
.pn.bad h4 { color:var(--al); opacity:1; }

/* data */
.qt { font-size:22px; font-weight:700; margin:2px 0 4px; }
.logbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 8px; padding:0 10px; }
.logbar input { font:inherit; font-size:16px; color:inherit; text-shadow:inherit; background:var(--gf); border:1.5px solid var(--gd); border-radius:0;
  padding:2px 8px; min-width:220px; -webkit-appearance:none; appearance:none; }
.logbar input::placeholder { color:var(--gd); }
.logbar input:focus-visible { outline:2px solid var(--g); outline-offset:2px; }
.logbar .tg { border:1.5px solid var(--gd); padding:1px 8px; }
.logbar .tg.on { background:var(--g); color:var(--ink); text-shadow:none; }
.loglist { height:calc(100% - 64px); }
.ac.lr { grid-template-columns: 76px 150px 96px 1fr; }
.ac.lr > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ac.lr.err { color:var(--al); }
/* wrapped: every cell breaks onto lines instead of clipping */
.loglist.wrap .ac.lr > span { white-space:normal; overflow-wrap:anywhere; text-overflow:clip; }

/* map: px geometry that never scales with the screen; a wide run scrolls */
.map { position:relative; border:2px solid var(--gd); overflow-x:auto; }
.map .mapd { position:relative; min-width:100%;
  background-image: linear-gradient(color-mix(in srgb, var(--g) 6%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--g) 6%, transparent) 1px, transparent 1px); background-size: 32px 32px; }
.map svg.route { position:absolute; left:0; top:0; pointer-events:none; }
.map .trk { fill:none; stroke:var(--g); stroke-width:2; opacity:.3; }
.map .ctr { fill:none; stroke:var(--g); stroke-width:3; opacity:.35; }
.map .xe { fill:none; stroke:var(--g); stroke-width:1.6; stroke-dasharray:6 5; opacity:.8; }
.map .ml { position:absolute; left:8px; transform:translateY(-50%); font-size:16px; font-weight:700; opacity:.6; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* A node's box is its square and its name; the operator hangs above it, out
   of the flow, so a column's left edge never moves. */
.map .mn { position:absolute; width:64px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:14px; font-weight:700; letter-spacing:.5px; line-height:1.2; }
.map div.mn { cursor:default; }
.map .mn > i { display:block; box-sizing:border-box; width:14px; height:14px; border:2px solid var(--g); background:var(--ink); }
.map .mn.done > i { background:var(--g); box-shadow:0 0 8px var(--gd); }
.map .mn.al { color:var(--al); text-shadow:0 0 6px color-mix(in srgb, var(--al) 40%, transparent); }
.map .mn.al > i { border-color:var(--al); }
.map .mn.pend { opacity:.55; }
.map .mn small { max-width:74px; font-size:12px; font-weight:500; opacity:.75; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.map .mn .op { position:absolute; left:50%; bottom:100%; transform:translateX(-50%); margin-bottom:3px; line-height:0; }
.lg { display:flex; align-items:flex-end; gap:10px; margin:2px 0; }
.lg .lgf { width:36px; display:flex; justify-content:center; }
.lg > span:last-child { padding-bottom:4px; }

/* radio */
.scope { position:relative; height:160px; }
.scope svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--g) 55%, transparent)); }
.scope .ax { fill:none; stroke:var(--g); stroke-width:2.5; }
.scope .tk { fill:none; stroke:var(--g); stroke-width:1.4; opacity:.85; }
.scope #wv { fill:none; stroke:var(--g); stroke-width:2.2; stroke-linejoin:round; }
pre.out { margin:10px 0 0; font-family:'Roboto Condensed', sans-serif; font-size:16px; line-height:1.25; white-space:pre-wrap; overflow:auto; height:calc(100% - 200px); }
.onair { background:var(--g); color:var(--ink); text-shadow:none; padding:0 6px; font-size:14px; font-weight:700; }
.rhead { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px; font-size:22px; font-weight:700; }
.rhead > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bars div { display:grid; grid-template-columns: 120px 1fr 90px; gap:10px; align-items:center; margin:4px 0; }
.bars i { display:block; height:11px; background:var(--g); }

/* what an agent wrote, rendered by md() */
.md p, .md ul, .md ol, .md pre, .md blockquote { margin:0 0 6px; }
.md pre { white-space:pre-wrap; font-family:inherit; }
.md ul.tick { list-style:none; padding-left:4px; }
.md ul.tick li { display:flex; gap:6px; align-items:flex-start; }

/* the empty state: a plan that has not been analysed */
.empty { min-height:100%; box-sizing:border-box; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
.empty .msg p { margin:0; font-size:20px; }
.empty .cmdrow { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; }
/* The plan's path is one long token: it breaks anywhere rather than run off
   both sides of a centred row. */
.empty .cmdrow code { min-width:0; overflow-wrap:anywhere; }

@media (prefers-reduced-motion: no-preference) {
  .screen::before { animation: roll 8s linear infinite; }
  .blink { animation: blink 1s step-end infinite; }
  .tg.bad { animation: blinkbg 1.2s step-end infinite; }
  .li.sel .tg.bad, .tbl tr.sel .tg.bad { animation: none; }
  .dash.bad i { animation: blink 1s step-end infinite; }
  .onair { animation: blink 1.4s step-end infinite; }
  /* Cycle and per-operator delay come from fig(), as custom properties. */
  .vb svg { animation-duration: var(--cy); animation-delay: var(--dl); animation-timing-function: step-end; animation-iteration-count: infinite; }
  .vb.half .q1 { animation-name: q-half-1; } .vb.half .q2 { animation-name: q-half; }
  .vb.wink .q1 { animation-name: q-wink-1; } .vb.wink .q2 { animation-name: q-wink; }
  body.frozen .screen::before, body.frozen .blink, body.frozen .tg.bad, body.frozen .dash.bad i,
  body.frozen .onair, body.frozen .vb svg { animation-play-state: paused !important; }
}

/* Widths (B §6.9). From 1100 px up, the prototype's layout above. Below it,
   STAT keeps the crew beside the hero and puts the details under the hero,
   and INV puts the record under the table; the body scrolls instead of each
   column. */
@media (width < 1100px) {
  .tabs, .tabs .tablist { gap:24px; }
  /* The run line is the one that grows, so on its own it would never wrap:
     it keeps room to be read and the rest goes to a second row. */
  .foot { flex-wrap:wrap; }
  .foot .grow { min-width:180px; }
  .cols.agents { grid-template-columns: 270px 1fr; grid-template-rows: auto 1fr; height:auto; }
  .cols.agents > .col:first-child { grid-row: span 2; }
  .icons { flex-wrap:wrap; }
  .cols.inv { grid-template-columns: 1fr; height:auto; }
  /* NAME takes what the other columns leave, and no more (columns: T, NAME,
     LANE, EFFORT, TRIES, TIME, $, STATE, WAITING ON). */
  .tbl td:nth-child(2) { max-width:0; width:100%; overflow:hidden; text-overflow:ellipsis; }
}

/* Below 700 px, one column: the tabs scroll sideways with the chip and the
   stream kept in view, the footer takes two rows, the map scrolls without
   shrinking, and INV's table keeps T, NAME, STATE (and WAITING ON) — the
   record under it has the rest. */
@media (width < 700px) {
  .screen { padding:8px 10px; }
  .tabs, .tabs .tablist { gap:16px; }
  .tabs { padding:0 6px; font-size:19px; }
  .tabs .plan { display:none; }
  .tabs .tablist { flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden; padding:0 6px; }
  .tabs .tablist::-webkit-scrollbar { height:3px; }
  .tabs .right { flex:none; gap:10px; }
  .subs { gap:14px; padding-left:10px; font-size:16px; overflow-x:auto; }
  .foot { font-size:15px; }
  .foot .seg { padding:3px 8px; }
  .foot .grow { min-width:140px; }
  .cols.agents, .cols.quests, .cols.nums, .cols.lanes, .cols.radio { grid-template-columns: 1fr; grid-template-rows: none; height:auto; }
  .cols.agents > .col:first-child { grid-row: auto; }
  .tbl th:nth-child(n+3):nth-child(-n+7), .tbl td:nth-child(n+3):nth-child(-n+7) { display:none; }
  /* CONDITION stacks: the operator, then every dash in a column. The dashes
     carry their place on the stage as inline styles, hence the !important. */
  .cond { height:auto; }
  .cond .stage { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .cond .fig { position:static; transform:none; order:-1; }
  .cond .dash { position:static !important; transform:none !important; align-items:center !important; }
  .ac.lr { grid-template-columns: 62px 96px 70px 1fr; }
  .cols.radio pre.out { height:auto; max-height:45vh; }
}
</style>
</head>
<body>
<div class="screen">
  <div class="tabs" id="tabs">
    <div class="tablist" role="tablist" aria-label="Views">
      <button type="button" class="tab" role="tab" data-tab="STAT" data-testid="tab-STAT" data-go="tab=STAT">STAT</button>
      <button type="button" class="tab" role="tab" data-tab="INV" data-testid="tab-INV" data-go="tab=INV">INV</button>
      <button type="button" class="tab" role="tab" data-tab="DATA" data-testid="tab-DATA" data-go="tab=DATA">DATA</button>
      <button type="button" class="tab" role="tab" data-tab="MAP" data-testid="tab-MAP" data-go="tab=MAP">MAP</button>
      <button type="button" class="tab" role="tab" data-tab="RADIO" data-testid="tab-RADIO" data-go="tab=RADIO">RADIO</button>
    </div>
    <span class="right">
      <span class="plan" id="plan"></span>
      <span id="chip"></span>
      <span class="sig" id="sig" data-testid="stream"></span>
    </span>
  </div>
  <div class="subs" id="subs" role="tablist" aria-label="Sub-views"></div>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</div>

<script>
'use strict';

/*
 * The operator panel.
 *
 * Everything on screen is derived from one snapshot the server pushes down
 * `/api/stream` and from the clock. The globals below are the contract the
 * views build on: `S` is the page state, `VIEWS[tab][sub]` paints a view into
 * the body, `agents()` is the crew in run order, `needYou()` is the one list
 * of things a human has to act on, and `whatToDo(agent)` is the command that
 * acts on it.
 */

const $ = (id) => document.getElementById(id);

// ------------------------------------------------------------------- state

const TABS = ['STAT', 'INV', 'DATA', 'MAP', 'RADIO'];
const SUBS = {
  STAT: ['AGENTS', 'CONDITION'],
  INV: ['ALL', 'PROBLEMS', 'RUNNING', 'QUEUE', 'DONE'],
  DATA: ['QUESTS', 'LOG', 'NUMBERS'],
  MAP: ['LANES'],
  RADIO: ['STATIONS'],
};
/** Sub-tab names are unique across tabs, so a sub alone names its tab. */
const TAB_OF = {};
for (const tab of TABS) for (const sub of SUBS[tab]) TAB_OF[sub] = tab;
const SEL_KEYS = ['agent', 'task', 'quest', 'station'];

const S = {
  snap: null,
  skew: 0, // server now - client now, so every clock agrees with the run
  tab: 'STAT',
  sub: Object.fromEntries(TABS.map((tab) => [tab, SUBS[tab][0]])),
  sel: { agent: null, task: null, quest: null, station: null },
  stream: 'reconnecting', // 'live' | 'quiet' | 'reconnecting'
  frozen: false,
};

// Thresholds (B §8.1, §6.1). Six minutes is one full `sleep 300` of the
// controller plus a minute: the reader sees the wait without being called.
const SILENT_MIN = 6;
const ALERT_MIN = 15;
const QUIET_MS = 30000;
const REOPEN_MS = 2000;
const COPIED_MS = 1600;
const LIMIT_AL = 0.8;

const STOPPED = new Set(['failed', 'blocked', 'interrupted', 'needs-verify']);
const WORD = {
  running: 'RUNNING', nosignal: 'NO SIGNAL', pending: 'QUEUED', done: 'DONE',
  failed: 'FAILED', blocked: 'BLOCKED', interrupted: 'INTERRUPTED', 'needs-verify': 'NEEDS VERIFY',
};

// ------------------------------------------------------------------- text

const E = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/**
 * Rewriting innerHTML that did not change destroys whatever the reader had
 * focused inside it, and a snapshot arrives about every second.
 */
function paint(el, html) {
  if (el.dataset.sig === html) return false;
  el.dataset.sig = html;
  el.innerHTML = html;
  return true;
}

const MD_FENCE = '\u0000';
const MD_CODE = '\u0001';

/** A drawn box, not a glyph: fonts disagree on the size and baseline of `☐`. */
const checkbox = (on) => `<svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true" focusable="false">`
  + `<rect x=".8" y=".8" width="11.4" height="11.4" fill="${on ? 'var(--gf)' : 'none'}" stroke="var(--g)" stroke-width="1.15" />`
  + (on ? '<path d="M3.5 6.6 L5.5 8.6 L9.5 4.5" fill="none" stroke="var(--g)" stroke-width="1.5" />' : '')
  + '</svg>';

/*
 * The smallest Markdown that covers what an agent writes back. Safety comes
 * from order: the source is escaped first, so by the time any rule runs there
 * is no `<` left in it and nothing the content says can become a tag.
 */

/** Runs on already-escaped text. Code spans are held out first: a backtick
 *  span is literal, and `a**b` must not come back bold. */
function mdInline(t) {
  const held = [];
  let out = String(t).replace(/`([^`]+)`/g, (_, c) => { held.push(c); return `${MD_CODE}${held.length - 1}${MD_CODE}`; });
  out = out
    // Only http(s). The scheme survives escaping intact, so this test is on
    // the real thing, and anything else stays the text it already was.
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => `<a href="${url}" target="_blank" rel="noreferrer noopener">${label}</a>`)
    .replace(/\*\*(\S[^*]*?)\*\*/g, '<strong>$1</strong>')
    .replace(/~~(\S[^~]*?)~~/g, '<del>$1</del>')
    // A lone marker needs a non-word neighbour on both sides, or `snake_case`
    // and `a * b` become emphasis in the middle of a path or an expression.
    .replace(/(^|[^*\w])\*(\S[^*]*?)\*(?![*\w])/g, '$1<em>$2</em>')
    .replace(/(^|[^_\w])_(\S[^_]*?)_(?![_\w])/g, '$1<em>$2</em>');
  return out.replace(new RegExp(MD_CODE + '(\\d+)' + MD_CODE, 'g'), (_, i) => `<code>${held[+i]}</code>`);
}

function md(src) {
  const source = String(src == null ? '' : src).replace(/\r\n?/g, '\n').trim();
  if (!source) return '';
  const fenced = [];
  const lines = E(source)
    .replace(/```[^\n]*\n([\s\S]*?)```/g, (_, body) => { fenced.push(body.replace(/\n+$/, '')); return `${MD_FENCE}${fenced.length - 1}${MD_FENCE}`; })
    .split('\n');

  const out = [];
  let para = [];
  let list = null;
  let quote = [];
  let table = null;
  const closePara = () => { if (para.length) { out.push(`<p>${mdInline(para.join('\n')).replace(/\n/g, '<br>')}</p>`); para = []; } };
  const closeList = () => {
    if (!list) return;
    out.push(`<${list.tag}${list.tick ? ' class="tick"' : ''}>` + list.items.map((i) => (i.box == null
      ? `<li>${mdInline(i.text)}</li>`
      : `<li class="${i.box ? 'on' : ''}">${checkbox(i.box)}<span>${mdInline(i.text)}</span></li>`)).join('') + `</${list.tag}>`);
    list = null;
  };
  const closeQuote = () => { if (quote.length) { out.push(`<blockquote>${mdInline(quote.join(' '))}</blockquote>`); quote = []; } };
  const RULE = /^\|[\s:|-]+\|$/;
  const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((c) => mdInline(c.trim()));
  const closeTable = () => {
    if (!table) return;
    const rows = table.slice();
    // A run of pipes is only a table if the second line is the rule.
    const head = rows.length > 1 && RULE.test(rows[1].trim()) ? (rows.splice(1, 1), rows.shift()) : null;
    const body = rows.filter((r) => !RULE.test(r.trim()));
    out.push('<div class="md-table"><table>'
      + (head ? `<thead><tr>${cells(head).map((c) => `<th>${c}</th>`).join('')}</tr></thead>` : '')
      + `<tbody>${body.map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
    table = null;
  };
  const close = () => { closePara(); closeList(); closeQuote(); closeTable(); };
  const item = (tag, text) => {
    closePara(); closeQuote(); closeTable();
    if (!list || list.tag !== tag) closeList(), list = { tag, items: [], tick: false };
    const box = text.match(/^\[([ xX])\]\s+(.*)$/);
    if (box) { list.tick = true; list.items.push({ box: box[1] !== ' ', text: box[2] }); }
    else list.items.push({ box: null, text });
  };

  for (const line of lines) {
    const fence = line.match(new RegExp('^' + MD_FENCE + '(\\d+)' + MD_FENCE + '$'));
    if (fence) { close(); out.push(`<pre><code>${fenced[+fence[1]]}</code></pre>`); continue; }
    if (!line.trim()) { close(); continue; }
    let m;
    // An agent's `#` is a run of prose, not a page title: two sizes only.
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { close(); out.push(`<h${m[1].length <= 2 ? 4 : 5}>${mdInline(m[2])}</h${m[1].length <= 2 ? 4 : 5}>`); continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { close(); out.push('<hr>'); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) { closePara(); closeList(); closeQuote(); (table || (table = [])).push(line.trim()); continue; }
    if ((m = line.match(/^\s*&gt;\s?(.*)$/))) { closePara(); closeList(); closeTable(); quote.push(m[1]); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { item('ul', m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { item('ol', m[1]); continue; }
    closeList(); closeQuote(); closeTable(); para.push(line);
  }
  close();
  return out.join('');
}

/** The first real line of a report, for a row. */
function gist(text, max = 150) {
  const line = String(text || '')
    .split('\n')
    .map((l) => l.replace(/^#{1,6}\s*/, '').replace(/\*\*/g, '').replace(/`/g, '').trim())
    .find((l) => l.length > 2) || '';
  return line.length > max ? `${line.slice(0, max - 1).trimEnd()}…` : line;
}

function dur(ms) {
  if (ms == null || !isFinite(ms) || ms < 0) return '–';
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = (v) => String(v).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}
const serverNow = () => Date.now() + S.skew;
const since = (iso) => (iso ? dur(serverNow() - Date.parse(iso)) : '–');
const money = (x) => (typeof x === 'number' && Number.isFinite(x) ? `$${x.toFixed(2)}` : '—');

/** HH:MM of an instant given in epoch seconds, epoch ms or ISO. */
function hhmm(t) {
  const ms = typeof t === 'number' ? (t < 1e12 ? t * 1000 : t) : Date.parse(t);
  return Number.isFinite(ms) ? new Date(ms).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
}

const minutesSince = (iso) => {
  const ms = Date.parse(iso);
  return Number.isFinite(ms) ? Math.floor((serverNow() - ms) / 60000) : null;
};

const lastLines = (text, n) => String(text || '').split('\n').filter((l) => l.trim()).slice(-n).join('\n');

/*
 * The last tool call, said as a sentence: the verb carries the meaning and the
 * argument becomes evidence, which is the order it is read in at a glance.
 */
function humanize(a) {
  if (!a) return null;
  const say = (verb, obj, kind) => ({ verb, obj, kind, ok: a.ok });
  if (a.kind === 'text') return { verb: 'thinking', obj: gist(a.text, 110), ok: true, quiet: true, kind: 'think' };
  // Neither of these is a tool call, and both reach a row: `run` opens an
  // attempt, `result` closes the spawn.
  if (a.kind === 'run') return { verb: a.label === 'started' ? 'starting up' : String(a.label || 'starting over'), obj: '', ok: true, kind: 'think' };
  if (a.kind === 'result') return { verb: a.ok === false ? 'failed' : 'finished', obj: a.text || '', ok: a.ok, kind: 'scan' };
  const t = a.target || '';
  switch (a.name) {
    case 'Bash': {
      if (/\b(vitest|jest|pytest|go test|npm test|pnpm test|yarn test)\b/.test(t)) return say('running the tests', t, 'churn');
      if (/^git commit/.test(t)) return say('committing', t, 'churn');
      if (/^git (status|log|diff|show|rev-parse)/.test(t)) return say('checking git', t, 'scan');
      if (/^git (checkout|stash|reset|merge|rebase)/.test(t)) return say('moving the tree', t, 'churn');
      if (/^(npm|pnpm|yarn) (run )?(build|typecheck|lint)/.test(t)) return say('building', t, 'churn');
      return say('running', t, 'churn');
    }
    case 'Edit': case 'MultiEdit': case 'Update': return say('editing', t, 'churn');
    case 'Write': case 'NotebookEdit': return say('writing', t, 'churn');
    case 'Read': return say('reading', t, 'scan');
    case 'Grep': case 'Glob': return say('searching', t, 'scan');
    case 'Task': case 'Agent': return say('delegating', t, 'orbit');
    case 'Skill': return say('using the skill', t, 'orbit');
    case 'TodoWrite': return say('planning', t, 'think');
    case 'WebFetch': case 'WebSearch': return say('looking it up', t, 'scan');
    case 'result': return say(a.ok === false ? 'failed' : 'finished', a.text || '', 'scan');
    default: return say(String(a.name || 'working').toLowerCase(), t, 'scan');
  }
}

const BARRIER_TIP = 'Barrier task: it runs after every lane has merged, on the combined tree — so it can touch files that the lanes were kept apart to avoid.';

// The run log's filters (DATA › LOG).
let feedQuery = '';
let feedKind = '';
let feedWrap = false;
const EDIT_TOOLS = new Set(['Edit', 'MultiEdit', 'Write', 'NotebookEdit', 'Update']);
/** Everything on a line a reader could plausibly be looking for. */
const feedText = (a) => [a.name, a.target, a.text, a.preview, a.label, a.tag].filter(Boolean).join(' ').toLowerCase();

function feedMatch(a) {
  if (feedKind === 'err' && a.ok !== false) return false;
  if (feedKind === 'bash' && a.name !== 'Bash') return false;
  if (feedKind === 'edit' && !EDIT_TOOLS.has(a.name)) return false;
  return !feedQuery || feedText(a).includes(feedQuery);
}

// ------------------------------------------------------------------- copy

const COPY_ICON = '<svg viewBox="0 0 14 14" width="12" height="12" aria-hidden="true" focusable="false">'
  + '<rect x="4.5" y="4.5" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.6"/>'
  + '<path d="M2.5 9.5 V1.5 H9.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';

function copyBtn(text, testid) {
  return `<button type="button" class="copy" data-copy="${E(text)}"${testid ? ` data-testid="${E(testid)}"` : ''}>${COPY_ICON}COPY</button>`;
}

/**
 * `navigator.clipboard` needs a secure context. Loopback is one; the address
 * `--host` hands another machine is not, and that is exactly the reader who
 * cannot retype a session id by hand. The textarea is the fallback for them.
 */
async function copyText(text) {
  try {
    if (window.isSecureContext && navigator.clipboard) { await navigator.clipboard.writeText(text); return true; }
  } catch { /* fall through */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}

async function handleCopy(btn) {
  const ok = await copyText(btn.getAttribute('data-copy') || '');
  clearTimeout(btn.restore);
  btn.classList.toggle('ok', ok);
  btn.textContent = ok ? 'COPIED ✓' : 'COPY FAILED';
  btn.restore = setTimeout(() => {
    btn.classList.remove('ok');
    btn.innerHTML = `${COPY_ICON}COPY`;
  }, COPIED_MS);
}

/** The command in the form the reader would type it: from the repo root. */
function relPlan(s) {
  const root = s.repoRoot ? `${s.repoRoot}/` : '';
  return root && s.plan && s.plan.startsWith(root) ? s.plan.slice(root.length) : (s.plan || '');
}
const cmd = (verb) => `plo ${verb} --plan ${relPlan(S.snap || {})}`;

// --------------------------------------------------------------- operator

// Each pose alternates two frames: [cycle kind, seconds per cycle] (B §7.1).
const SPRITE = { orgulho: ['wink', 3.2], trabalhando: ['half', 0.7], revisando: ['half', 1.8], travado: ['half', 0.6], falhou: ['half', 0.5], dormindo: ['half', 1.6] };
const VB = { orgulho: [280, 487], trabalhando: [237, 483], revisando: [266, 488], travado: [325, 490], falhou: [492, 376], dormindo: [294, 491] };

/** FNV-1a: a stable number per key, so an operator keeps its delay across repaints. */
function keyHash(key) {
  let h = 2166136261;
  for (const c of String(key)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/**
 * One operator: two stacked `<svg>`, one per frame. The negative delay comes
 * from the key, not from a counter, so the same agent redrawn keeps its phase
 * and two agents never blink in step. No pose, no operator (a queued task).
 */
function fig(pose, height, alert, key) {
  if (!SPRITE[pose]) return '';
  const [cycle, secs] = SPRITE[pose];
  const [vw, vh] = VB[pose];
  const h = Math.round(height * (pose === 'falhou' ? 0.6 : 0.9));
  const w = Math.round((h * vw) / vh);
  const delay = (((keyHash(key == null ? pose : key) % 1000) / 1000) * secs).toFixed(2);
  const frame = (n) => `<svg class="q${n}" width="${w}" height="${h}" aria-hidden="true" focusable="false"><use href="#op-${pose}-${n}"/></svg>`;
  return `<span class="vb ${cycle}${alert ? ' al' : ''}" style="--cy:${secs}s;--dl:-${delay}s" data-pose="${pose}">${frame(1)}${frame(2)}</span>`;
}

// ------------------------------------------------------------------ keyed

function toElement(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = String(html).trim();
  if (tpl.content.childNodes.length === 1 && tpl.content.firstElementChild) return tpl.content.firstElementChild;
  const box = document.createElement('div');
  box.append(tpl.content);
  return box;
}

/**
 * Render a list by key (B §9.4). A child whose `data-sig` did not change is
 * kept as it is: replacing an operator's markup restarts its animation, and a
 * snapshot arrives about every second. Stale children go first, so a removal
 * never moves the ones after it. Keys must be unique within `items`.
 */
function keyed(container, items) {
  const wanted = new Set(items.map((it) => String(it.key)));
  const old = new Map();
  for (const el of [...container.children]) {
    const k = el.getAttribute('data-key');
    if (k == null || !wanted.has(k) || old.has(k)) el.remove();
    else old.set(k, el);
  }
  let prev = null;
  for (const it of items) {
    const key = String(it.key);
    const sig = String(it.sig);
    let el = old.get(key);
    if (!el || el.getAttribute('data-sig') !== sig) {
      const fresh = toElement(it.html);
      fresh.setAttribute('data-key', key);
      fresh.setAttribute('data-sig', sig);
      if (el) el.replaceWith(fresh);
      el = fresh;
    }
    const want = prev ? prev.nextElementSibling : container.firstElementChild;
    if (el !== want) container.insertBefore(el, want);
    prev = el;
  }
}

// ------------------------------------------------------------------ crew

const stageOf = (key) => ((S.snap && S.snap.stages) || []).find((x) => x.key === key) || null;

/** B §7.1. A queued agent has no operator. */
function poseFor(a) {
  switch (a.status) {
    case 'running': {
      const reviewing = a.kind === 'review'
        || (a.kind === 'sub' && (a.parent === 'review' || /review/i.test((a.src && a.src.agentType) || '')));
      return reviewing ? 'revisando' : 'trabalhando';
    }
    case 'blocked': case 'needs-verify': return 'travado';
    case 'failed': return 'falhou';
    case 'nosignal': case 'interrupted': return 'dormindo';
    case 'done': return 'orgulho';
    default: return null;
  }
}

/**
 * Every agent of the run, in run order: each lane's tasks in the order of
 * `lanes`, every task followed by its subagents, then the barriers, then the
 * end of the run (the suite, the reviewer and its subagents). All statuses,
 * pending and done included; a view picks what it shows.
 *
 * `nosignal` replaces `running` for a task, barrier or reviewer whose last
 * event is SILENT_MIN or more minutes old, on the server's clock. A subagent
 * never goes silent on its own: its silence shows on its parent (B §8.1).
 */
function agents() {
  const s = S.snap;
  if (!s || !s.ready) return [];
  const i = s.integration || {};
  const out = [];
  const add = (a) => { a.pose = poseFor(a); out.push(a); return a; };
  const silence = (src) => (src.status === 'running' ? minutesSince(src.lastActivityAt) : null);
  const statusOf = (src, silentMin) => (src.status === 'running' && silentMin != null && silentMin >= SILENT_MIN
    ? 'nosignal' : src.status || 'pending');
  const subagents = (parent, src) => {
    for (const k of src.children || []) {
      const status = k.status || 'running';
      add({
        id: k.id, kind: 'sub', parent: parent.id, n: parent.n, lane: parent.lane,
        name: k.title || k.agentType || 'subagent', role: String(k.agentType || 'subagent').toUpperCase(),
        status, silentMin: null, alert: STOPPED.has(status), src: k,
      });
    }
  };
  const task = (t, kind) => {
    const silentMin = silence(t);
    const status = statusOf(t, silentMin);
    const a = add({
      id: `T${t.n}`, kind, parent: null, n: t.n, lane: t.lane || null, name: t.title, role: 'CONTROLLER',
      status, silentMin, alert: STOPPED.has(status) || status === 'nosignal', src: t,
    });
    subagents(a, t);
  };

  for (const lane of s.lanes || []) for (const t of lane.tasks || []) task(t, 'task');
  for (const t of s.barriers || []) task(t, 'barrier');

  // There is no suite object in the snapshot: it is built from its stage, its
  // live tail and the integration's verdict, once it has started.
  const suiteRec = (i.stages || {}).suite;
  if (suiteRec && suiteRec.startedAt) {
    const stage = stageOf('suite');
    const status = (stage && stage.status) || 'running';
    const result = i.suite || null;
    add({
      id: 'suite', kind: 'suite', parent: null, n: null, lane: null, name: 'Full suite', role: 'FULL SUITE',
      status, silentMin: null, alert: status === 'interrupted' || (status === 'failed' && !(result && result.skipped)),
      src: { stage, rec: suiteRec, live: s.suiteLive || null, result },
    });
  }
  if (s.reviewer) {
    const r = s.reviewer;
    const silentMin = silence(r);
    const status = statusOf(r, silentMin);
    const a = add({
      id: 'review', kind: 'review', parent: null, n: null, lane: null, name: r.title || 'Cross-lane review', role: 'CROSS-LANE REVIEWER',
      status, silentMin, alert: STOPPED.has(status) || status === 'nosignal' || Boolean(i.review && i.review.clean === false), src: r,
    });
    subagents(a, r);
  }
  return out;
}

// ------------------------------------------------------------- what to do

/**
 * B §8.3 as data. The text is built from what the run recorded; no model
 * writes advice. The verb matters: `plo resume` only runs lane tasks, and
 * barriers and the integration only run under `plo integrate`.
 */
function lastAction(a) {
  const act = (a.src && a.src.activity) || [];
  const h = humanize(act[act.length - 1]);
  if (h) return [h.verb, h.obj].filter(Boolean).join(' ');
  const t = a.src && a.src.lastTool;
  return t ? `${t.name} ${t.target || ''}`.trim() : 'nothing recorded';
}

const TODO = {
  laneStopped: { verb: 'resume', text: (a) => a.src.error || 'no error recorded' },
  laneInterrupted: { verb: 'resume', text: () => 'the process that drove it stopped' },
  barrierStopped: { verb: 'integrate', text: (a) => a.src.error || 'the process that drove it stopped' },
  mergeFailed: { verb: 'integrate', text: ({ i, stage }) => i.mergeError || (stage && stage.detail) || 'the merge failed' },
  stageInterrupted: { verb: 'integrate', text: (stage) => (stage && stage.detail) || 'the process that drove it stopped' },
  // The summary is the raw tail of the output: cleaned first, as RADIO does.
  suiteFailed: { verb: 'integrate', text: (suite) => lastLines(cleanTermLines(suite.summary).join('\n'), 6) || 'the full suite failed' },
  // No command: the findings are a report to read, so COPY takes its path.
  reviewFindings: { verb: null, text: (review) => review.verdict || 'the review has findings', copy: (review) => review.reportFile || null },
  silent: { verb: null, text: (a) => `no event for ${a.silentMin} min — last: ${lastAction(a)}` },
  rateLimit: { verb: 'resume', text: (rl) => `usage limit — resets at ${hhmm(rl.resetsAt) || '?'}` },
  planChanged: { verb: 'analyze', text: () => 'the plan changed after init — re-run analyze' },
  lanesDone: { verb: 'integrate', text: () => 'lanes done — the integration has not started' },
};

function advice(row, arg) {
  const command = row.verb ? cmd(row.verb) : null;
  return { text: row.text(arg), command, copy: row.copy ? row.copy(arg) : command };
}

/** Nobody working, every lane task done, and the integration never began. */
function lanesDoneIdle(s) {
  const laneTasks = (s.lanes || []).flatMap((l) => l.tasks || []);
  const i = s.integration || {};
  return !s.totals.active && laneTasks.length > 0 && laneTasks.every((t) => t.status === 'done')
    && (!i.status || i.status === 'pending');
}

/**
 * What the reader should do about one agent, or null when nothing. With no
 * agent it answers for the run: the lanes are done and nobody started the
 * integration.
 */
function whatToDo(a) {
  const s = S.snap;
  if (!s || !s.ready) return null;
  const i = s.integration || {};
  if (!a) return lanesDoneIdle(s) ? advice(TODO.lanesDone) : null;
  if (a.status === 'nosignal') return advice(TODO.silent, a);
  switch (a.kind) {
    case 'task':
      if (a.status === 'interrupted') return advice(TODO.laneInterrupted, a);
      return STOPPED.has(a.status) ? advice(TODO.laneStopped, a) : null;
    case 'barrier':
      return STOPPED.has(a.status) ? advice(TODO.barrierStopped, a) : null;
    case 'suite':
      if (a.status === 'interrupted') return advice(TODO.stageInterrupted, stageOf('suite'));
      return i.suite && i.suite.ok === false && !i.suite.skipped ? advice(TODO.suiteFailed, i.suite) : null;
    case 'review':
      if (a.status === 'interrupted') return advice(TODO.stageInterrupted, stageOf('review'));
      return i.review && i.review.clean === false ? advice(TODO.reviewFindings, i.review) : null;
    default:
      return null;
  }
}

/**
 * B §8.2: the one list behind the alerts chip, the footer's NEED YOU and the
 * ALERTS list, in agent order. Items with no agent sit where they happen in
 * the run: the merge between the lanes and the barriers, the usage limit and
 * a changed plan at the end. A skipped suite and a clean review stay out.
 */
function needYou() {
  const s = S.snap;
  if (!s || !s.ready) return [];
  const i = s.integration || {};
  const crew = agents();
  const items = [];
  const item = (key, agentId, label, tag, todo) => items.push({ key, agentId, label, tag, ...todo });
  const stopped = (a) => {
    const label = `T${a.n} ${a.name}`;
    if (STOPPED.has(a.status)) item(a.id, a.id, label, WORD[a.status], whatToDo(a));
    else if (a.status === 'nosignal' && a.silentMin >= ALERT_MIN) item(`${a.id}:silent`, a.id, label, WORD.nosignal, whatToDo(a));
  };
  const has = (id) => crew.some((a) => a.id === id);
  const stage = (key) => {
    const st = stageOf(key);
    return st && st.status === 'interrupted' ? st : null;
  };

  for (const a of crew) if (a.kind === 'task') stopped(a);
  if (i.status === 'merge-failed') item('merge-failed', null, 'MERGE', 'FAILED', advice(TODO.mergeFailed, { i, stage: stageOf('merge') }));
  else if (stage('merge')) item('stage:merge', null, 'MERGE', 'INTERRUPTED', advice(TODO.stageInterrupted, stage('merge')));
  for (const a of crew) if (a.kind === 'barrier') stopped(a);
  if (stage('suite')) item('stage:suite', has('suite') ? 'suite' : null, 'FULL SUITE', 'INTERRUPTED', advice(TODO.stageInterrupted, stage('suite')));
  else if (i.suite && i.suite.ok === false && !i.suite.skipped) item('suite-failed', has('suite') ? 'suite' : null, 'FULL SUITE', 'FAILED', advice(TODO.suiteFailed, i.suite));
  if (stage('review')) item('stage:review', has('review') ? 'review' : null, 'CROSS-LANE REVIEW', 'INTERRUPTED', advice(TODO.stageInterrupted, stage('review')));
  else if (i.review && i.review.clean === false) item('review-findings', has('review') ? 'review' : null, 'CROSS-LANE REVIEW', 'FINDINGS', advice(TODO.reviewFindings, i.review));
  const reviewer = crew.find((a) => a.id === 'review');
  if (reviewer && reviewer.status === 'nosignal' && reviewer.silentMin >= ALERT_MIN) {
    item('review:silent', 'review', 'CROSS-LANE REVIEW', WORD.nosignal, whatToDo(reviewer));
  }
  if (s.rateLimit) item('rate-limit', null, 'USAGE LIMIT', 'LIMITED', advice(TODO.rateLimit, s.rateLimit));
  if (s.planChanged) item('plan-changed', null, 'PLAN', 'CHANGED', advice(TODO.planChanged));
  return items;
}

// ------------------------------------------------- from the run, for views

/** What holds a queued task up. A lane is strictly sequential and barriers
 *  run in order after the merge, so the answer is always the thing in front. */
function queueAfter(t, s) {
  if (t.barrier) {
    const i = s.barriers.findIndex((b) => b.n === t.n);
    const prev = i > 0 ? s.barriers[i - 1] : null;
    return prev ? `after T${prev.n}` : 'after the merge';
  }
  const lane = s.lanes.find((l) => l.id === t.lane);
  if (!lane) return '';
  const i = lane.tasks.findIndex((x) => x.n === t.n);
  const prev = lane.tasks.slice(0, i).reverse().find((x) => x.status !== 'done');
  return prev ? `after T${prev.n}` : 'next in the lane';
}

/** What the parallelism bought, once there is nothing left to run. Only on a
 *  clean finish: a run that ended blocked has a report to read first. */
function outcomeOf(s, tasks) {
  if (!s.totals.total || s.totals.done !== s.totals.total) return null;
  const at = (iso) => { const ms = Date.parse(iso); return Number.isFinite(ms) ? ms : null; };
  const starts = tasks.map((t) => at(t.startedAt)).filter((x) => x != null);
  const ends = tasks.map((t) => at(t.endedAt)).filter((x) => x != null);
  if (!starts.length || !ends.length) return null;
  const i = s.integration || {};
  return {
    // Floored, like `dur()`, so it agrees with the run clock to the second.
    wallSeconds: Math.max(1, Math.floor((Math.max(...ends) - Math.min(...starts)) / 1000)),
    agentSeconds: Math.round(tasks.reduce((n, t) => {
      const a = at(t.startedAt), b = at(t.endedAt);
      return n + (a != null && b != null && b > a ? (b - a) / 1000 : 0);
    }, 0)),
    commits: tasks.reduce((n, t) => n + (t.commits ? t.commits.length : 0), 0),
    suite: i.suite || null,
    review: i.review || null,
  };
}

// ------------------------------------------------------------------ views

const viewTitle = (sub) => `<h2 class="vt" data-testid="view-title">${E(sub)}</h2>`;

/** `VIEWS[tab][sub](el)` paints one view into the body. These are markers;
 *  each tab's task replaces its own. */
const VIEWS = Object.fromEntries(TABS.map((tab) => [tab, Object.fromEntries(SUBS[tab].map((sub) => [
  sub, (el) => keyed(el, [{ key: 'title', sig: sub, html: viewTitle(sub) }]),
]))]));

function renderEmpty(view, s) {
  if (view.dataset.view !== 'empty') { view.innerHTML = ''; view.dataset.view = 'empty'; }
  const command = cmd('analyze');
  const html = '<div class="empty" data-testid="empty-state">'
    + fig('dormindo', 200, false, 'empty')
    + `<div class="msg">${md(s.error || s.message || 'Nothing to show yet.')}</div>`
    + `<div class="cmdrow"><code>${E(command)}</code>${copyBtn(command, 'copy-cmd')}</div>`
    + '</div>';
  keyed(view, [{ key: 'empty', sig: html, html }]);
}

// ------------------------------------------------------------------- STAT

// The attempt cap a lane task resumes against (src/state.js MAX_ATTEMPTS).
// A barrier has none: `integrate` has no cap (B §6.2).
const MAX_TRIES = 3;

/** A task that has not reported did not spend nothing, so nothing is `—`. */
const tokens = (v) => {
  if (typeof v !== 'number' || v <= 0) return '—';
  if (v >= 1e6) return `${(v / 1e6).toFixed(2)}M`;
  if (v >= 1e4) return `${Math.round(v / 1000)}k`;
  if (v >= 1000) return `${(v / 1000).toFixed(1)}k`;
  return String(v);
};

/** HH:MM:SS of an ISO instant, for a row of actions. */
function hms(iso) {
  const ms = Date.parse(iso);
  return Number.isFinite(ms) ? new Date(ms).toLocaleTimeString('en-GB', { hour12: false }) : '';
}

const clipText = (t, max = 140) => (t.length > max ? `${t.slice(0, max - 1).trimEnd()}…` : t);

const svgIcon = (body) => `<svg viewBox="0 0 18 18" width="20" height="20" aria-hidden="true" focusable="false">${body}</svg>`;
const ICON = {
  eff: '<svg viewBox="0 0 16 18" width="16" height="20" aria-hidden="true" focusable="false"><path d="M9.5 1 L3 10.5 H8 L6 17 L13.5 7 H8.7 Z" fill="currentColor"/></svg>',
  tries: svgIcon('<path d="M3 9a6 6 0 0 1 10-4.5M15 9a6 6 0 0 1-10 4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 1v4h-4M5 17v-4h4" fill="none" stroke="currentColor" stroke-width="2"/>'),
  turns: svgIcon('<path d="M15 9a6 6 0 1 1-2-4.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M13.5 1.5 V5.5 H9.5" fill="none" stroke="currentColor" stroke-width="2.2"/>'),
  time: svgIcon('<circle cx="9" cy="9" r="7.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 4.5v4.8l3.2 2" fill="none" stroke="currentColor" stroke-width="2"/>'),
  cost: svgIcon('<circle cx="9" cy="9" r="7.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11.6 6.4c-1-1.1-5.2-1.1-5.2 1 0 2 5.2 1 5.2 3.2 0 2.1-4.2 2.1-5.2 1M9 3.8v10.4" fill="none" stroke="currentColor" stroke-width="1.6"/>'),
  out: svgIcon('<path d="M3 4h12M3 9h12M3 14h8" stroke="currentColor" stroke-width="2.4"/>'),
  type: svgIcon('<path d="M2 3h7l7 7-6 6-7-7z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="7" r="1.4" fill="currentColor"/>'),
  cmd: svgIcon('<path d="M2.5 4.5 7 9l-4.5 4.5M9 14h6.5" fill="none" stroke="currentColor" stroke-width="2.2"/>'),
  exit: svgIcon('<path d="M8 3H3v12h5M7 9h9M12.5 5.5 16 9l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2"/>'),
};

const TAG_BAD = new Set(['failed', 'blocked', 'needs-verify']);
const TAG_WARN = new Set(['nosignal', 'interrupted']);
/** A state as its tag: solid amber when it broke, dashed amber when it went
 *  quiet or was cut off (B §8.1). */
function stateTag(status, testid) {
  const cls = TAG_BAD.has(status) ? ' bad' : TAG_WARN.has(status) ? ' warn' : '';
  return `<span class="tg${cls}"${testid ? ` data-testid="${E(testid)}"` : ''}>${E(WORD[status] || String(status || '').toUpperCase())}</span>`;
}

/*
 * LINES of the full suite (B §6.2): the lines the page has seen for this suite
 * run, keyed by its start. The snapshot carries only the last SUITE_WINDOW
 * cleaned lines and no total (src/monitor.js SUITE_LINES), so each window is
 * laid over the one before and only what comes past the overlap counts. The
 * longest overlap wins, so a log that repeats lines is undercounted, never
 * overcounted, and the same snapshot read twice adds nothing. A first window
 * that is already full means lines scrolled out before the page connected,
 * and a full window that shares nothing with the one before means lines
 * scrolled out between two snapshots (a fast suite, a dropped stream): either
 * way the figure carries a `+` from then on.
 */
const SUITE_WINDOW = 40;
const suiteSeen = { startedAt: null, lines: [], count: 0, partial: false };

function countSuiteLines(s) {
  const live = s && s.ready ? s.suiteLive : null;
  if (!live || !Array.isArray(live.lines)) return;
  const cur = live.lines;
  if (suiteSeen.startedAt !== live.startedAt) {
    Object.assign(suiteSeen, { startedAt: live.startedAt, lines: cur, count: cur.length, partial: cur.length >= SUITE_WINDOW });
    return;
  }
  const old = suiteSeen.lines;
  suiteSeen.lines = cur;
  if (!old.length) { suiteSeen.count += cur.length; return; }
  // The old window's last line may have been half written, so it is laid over
  // again instead of trusted. It was counted once already.
  const head = old.slice(0, -1);
  const fits = (k) => {
    for (let j = 0; j < k; j += 1) if (head[head.length - k + j] !== cur[j]) return false;
    return true;
  };
  let k = Math.min(head.length, cur.length);
  while (k > 0 && !fits(k)) k -= 1;
  // No overlap and a full window: more lines came than the window holds, and
  // the ones in between were never seen.
  if (k === 0 && head.length && cur.length >= SUITE_WINDOW) suiteSeen.partial = true;
  suiteSeen.count += Math.max(0, cur.length - k - 1);
}

function suiteLinesFigure(a) {
  const startedAt = (a.src.live && a.src.live.startedAt) || (a.src.rec && a.src.rec.startedAt) || null;
  if (startedAt == null || suiteSeen.startedAt !== startedAt) return '—';
  return `${suiteSeen.count}${suiteSeen.partial ? '+' : ''}`;
}

const suiteCommand = (a) => (a.src.live && a.src.live.command) || (a.src.rec && a.src.rec.command) || (S.snap && S.snap.testCommand) || '—';

/** What holds the run up while nobody works: the first stage not done. */
function idleLine(s) {
  const next = (s.stages || []).find((x) => x.status !== 'done');
  return next ? `nobody working — waiting on ${String(next.label).toLowerCase()}` : 'nobody working — run over';
}

/**
 * Who STAT › AGENTS lists, in groups (B §6.2): each lane task that is working
 * or stopped under its own header (the old crew filter, plus NO SIGNAL), the
 * barriers that are, then END OF RUN. A listed task brings every subagent it
 * dispatched, whatever its state. END OF RUN shows once the suite or the
 * review has started and stays until the run is over with nothing left that
 * needs a human; while it shows, it holds both and the reviewer's subagents.
 */
function crewGroups(all, items) {
  const s = S.snap;
  const listed = (a) => a.status === 'running' || a.status === 'nosignal' || STOPPED.has(a.status);
  const withSubs = (a) => [a, ...all.filter((x) => x.kind === 'sub' && x.parent === a.id)];
  const groups = [];
  for (const a of all) {
    if (a.kind === 'task' && listed(a)) {
      groups.push({ key: a.id, head: `LANE ${String(a.lane || '').toUpperCase()} · T${a.n} ${a.name}`, members: withSubs(a) });
    }
  }
  const barriers = all.filter((a) => a.kind === 'barrier' && listed(a));
  if (barriers.length) groups.push({ key: 'barriers', head: 'BARRIERS', members: barriers.flatMap(withSubs) });
  const end = all.filter((a) => a.kind === 'suite' || a.kind === 'review');
  if (end.length && !(s.runOver && !items.length)) {
    groups.push({ key: 'end', head: 'END OF RUN', members: end.flatMap((a) => (a.kind === 'review' ? withSubs(a) : [a])) });
  }
  return groups;
}

/**
 * The agent in the hero. A pick (a click, the hash, a link) is looked up in
 * the whole run, so a pinned agent that finishes stays on screen. With none,
 * the first that needs you, else the first at work, else the first listed —
 * worked out on every render and never written back, so the default follows
 * the run instead of pinning an alert that has since cleared.
 */
function heroAgent(all, shown, items) {
  const id = S.sel.agent;
  const picked = id != null ? all.find((a) => a.id === id) : null;
  if (picked) return { agent: picked, picked: true };
  const need = items.find((it) => it.agentId && all.some((a) => a.id === it.agentId));
  const agent = (need && all.find((a) => a.id === need.agentId))
    || shown.find((a) => a.status === 'running' || a.status === 'nosignal') || shown[0] || null;
  return { agent, picked: false };
}

function heroTitle(a) {
  const type = () => String((a.src && a.src.agentType) || 'subagent').toUpperCase();
  switch (a.kind) {
    case 'suite': return 'FULL SUITE';
    case 'review': return 'CROSS-LANE REVIEW';
    case 'sub': return a.parent === 'review' ? `REVIEW · ${type()}` : `T${a.n} · ${type()}`;
    default: return `T${a.n} · CONTROLLER`;
  }
}

/** What it is doing now: the last event, as the old crew row said it. */
function doing(a) {
  if (a.kind === 'suite') {
    const r = a.src.result;
    if (a.status === 'running') return `running ${suiteCommand(a)}`;
    if (r) return r.skipped ? 'not run — no test command' : r.ok ? 'passed' : 'failed';
    return String(WORD[a.status] || a.status || '').toLowerCase();
  }
  if (a.status === 'pending') return a.kind === 'sub' ? 'queued' : `queued — ${queueAfter(a.src, S.snap)}`;
  if (a.status === 'done') return 'finished';
  if (STOPPED.has(a.status)) return `stopped — last: ${lastAction(a)}`;
  return lastAction(a);
}

/** B §6.2's five numbers, by kind of agent: [icon, label, value as HTML]. */
function heroNumbers(a) {
  const src = a.src || {};
  const live = a.status === 'running' || a.status === 'nosignal';
  // A running clock is a `data-since` for paintTimes: text only, so the
  // markup, and the signature with it, stays the same every second.
  const time = (from, to) => (live && from ? `<span data-since="${E(from)}"></span>`
    : from && to ? E(dur(Date.parse(to) - Date.parse(from))) : '—');
  const turns = () => (a.status === 'pending' || typeof src.turns !== 'number' ? '—' : String(src.turns));
  const noTry = [ICON.tries, 'TRY', '—'];
  switch (a.kind) {
    case 'task': case 'barrier': {
      const e = src.effort;
      const effort = e ? `${e.used ?? e.planned}${e.raised ? ' ↑' : ''}` : 'inherited';
      const tries = src.attempts ? (a.kind === 'task' ? `${src.attempts}/${MAX_TRIES}` : String(src.attempts)) : '—';
      return [[ICON.eff, 'EFFORT', E(effort)], [ICON.tries, 'TRY', E(tries)], [ICON.turns, 'TURNS', turns()],
        [ICON.time, 'TIME', time(src.startedAt, src.endedAt)], [ICON.cost, 'COST', E(money(src.costUsd))]];
    }
    case 'sub':
      return [[ICON.type, 'TYPE', E(src.agentType || '—')], noTry, [ICON.turns, 'TURNS', turns()],
        [ICON.time, 'TIME', time(src.startedAt, src.endedAt)], [ICON.out, 'OUTPUT', E(tokens(src.outputTokens))]];
    case 'review':
      return [[ICON.eff, 'EFFORT', 'inherited'], noTry, [ICON.turns, 'TURNS', turns()],
        [ICON.time, 'TIME', time(src.startedAt, src.endedAt)], [ICON.cost, 'COST', E(money(src.costUsd))]];
    default: {
      const rec = src.rec || {};
      const r = src.result;
      return [[ICON.cmd, 'COMMAND', E(suiteCommand(a))], noTry, [ICON.out, 'LINES', E(suiteLinesFigure(a))],
        [ICON.time, 'TIME', time(rec.startedAt, rec.endedAt)], [ICON.exit, 'EXIT', r && typeof r.code === 'number' ? String(r.code) : '—']];
    }
  }
}

function heroItems(a) {
  const name = heroTitle(a);
  const now = `<div class="now">${E(clipText(doing(a)))}${a.status === 'running' ? '<span class="blink">_</span>' : ''}</div>`;
  const tagHtml = stateTag(a.status, 'hero-tag');
  return [
    // Its own child, signed by what it looks like only: the numbers beside it
    // change every second, and repainting it would restart its animation.
    { key: 'fig', sig: `${a.id}|${a.pose}|${a.alert}`, html: fig(a.pose, 240, a.alert, a.id) || '<span></span>' },
    { key: 'name', sig: name, html: `<div class="who" data-testid="hero-name">${E(name)}</div>` },
    { key: 'tag', sig: tagHtml, html: tagHtml },
    { key: 'now', sig: now, html: now },
    { key: 'icons', sig: 'icons', html: '<div class="icons"></div>' },
  ];
}

// The label and the value sit apart in the markup, so the cell reads
// "EFFORT high" and not "EFFORThigh"; the flex column hides the space.
const heroCell = ([icon, label, value]) => `<div class="ic">${icon}<div><small>${label}</small> ${value}</div></div>`;

function actRow(x) {
  const [what, obj] = x.kind === 'text' ? ['think', x.text]
    : x.kind === 'run' ? ['start', x.label]
      : x.kind === 'result' ? ['result', x.text]
        : [x.name, x.target || x.preview];
  return `<div class="ac${x.ok === false ? ' bad' : ''}"><span>${E(hms(x.at))}</span><span>${E(what || '')}</span>`
    + `<span class="o" title="${E(obj || '')}">${E(obj || '')}</span></div>`;
}

function detailItems(a, all) {
  const out = [];
  const todo = whatToDo(a);
  if (todo) {
    // The heading sits outside `whattodo`: the block starts with the advice.
    out.push({
      key: 'todo',
      html: `<div class="pn"><h4>WHAT TO DO</h4><div class="note${a.alert ? ' bad' : ''}" data-testid="whattodo"><span class="tx">${E(todo.text)}</span>`
        + (todo.copy ? `<div class="cmd"><code>${E(todo.copy)}</code>${copyBtn(todo.copy, 'copy-cmd')}</div>` : '')
        + '</div></div>',
    });
  }
  if (a.kind !== 'suite') {
    const acts = ((a.src && a.src.activity) || []).slice(-8).reverse();
    out.push({
      key: 'acts',
      html: `<div class="pn"><h4>LAST ACTIONS</h4>${acts.length ? acts.map(actRow).join('') : '<div class="kv dim"><span>nothing recorded</span></div>'}</div>`,
    });
  }
  const subs = all.filter((x) => x.kind === 'sub' && x.parent === a.id);
  if (subs.length) {
    out.push({
      key: 'subs',
      html: '<div class="pn"><h4>SUBAGENTS</h4>' + subs.map((k) => `<button type="button" class="li${k.status === 'running' ? ' run' : ''}" data-go="${E(`agent=${encodeURIComponent(k.id)}`)}">`
        + `<span>${E(k.role)}</span>${stateTag(k.status)}</button>`).join('') + '</div>',
    });
  }
  const owner = a.kind === 'sub' ? all.find((x) => x.id === a.parent) : a;
  if (owner && (owner.kind === 'task' || owner.kind === 'barrier')) {
    const commits = ((owner.src && owner.src.commits) || []).length;
    out.push({
      key: 'card',
      html: '<div class="pn"><h4>TASK</h4>'
        + `<div class="kv"><span>T${owner.n}</span><span>${E(owner.name)}</span></div>`
        + `<div class="kv"><span>${owner.kind === 'barrier' ? 'barrier' : `lane ${E(String(owner.lane || '').toUpperCase())}`} · commits</span><span>${commits}</span></div>`
        + `<button type="button" class="lnk" data-go="${E(`tab=INV&task=${owner.n}`)}">open in INV ▸</button> &nbsp; `
        + `<button type="button" class="lnk" data-go="${E(`tab=DATA&sub=QUESTS&quest=${owner.n}`)}">see quest ▸</button></div>`,
    });
  }
  if (a.kind === 'suite') {
    const live = a.src.live;
    // As many as the box shows: it is repainted every snapshot, and the
    // newest line must not sit below a scroll that resets to the top. The
    // live lines arrive clean; the finished summary is the raw tail.
    const lines = live ? (live.lines || []).slice(-8)
      : (a.src.result ? lastLines(cleanTermLines(a.src.result.summary).join('\n'), 8).split('\n') : []);
    out.push({
      key: 'live',
      html: `<div class="pn"><h4>${live ? 'LIVE OUTPUT' : 'OUTPUT'}</h4>`
        + `<pre class="out" data-testid="live-output" style="height:auto;max-height:170px;margin:0">${E(lines.join('\n'))}</pre>`
        + `<button type="button" class="lnk" data-go="${E('tab=RADIO&station=suite')}">listen on RADIO ▸</button></div>`,
    });
  }
  return out.map((it) => ({ ...it, sig: it.html }));
}

function crewRow(a, selId) {
  const label = a.kind === 'barrier' ? `T${a.n} · ${a.role}` : a.role;
  const run = a.status === 'running' || a.status === 'nosignal';
  return `<button type="button" class="li${a.kind === 'sub' ? ' kid' : ''}${run ? ' run' : ''}${a.id === selId ? ' sel' : ''}"`
    + ` data-testid="agent-${E(a.id)}" data-go="${E(`agent=${encodeURIComponent(a.id)}`)}"><span>${E(label)}</span>${stateTag(a.status)}</button>`;
}

const AGENT_COLS = '<div class="cols agents">'
  + '<div class="col"></div><div class="hero" data-testid="hero"></div><div class="col" data-testid="details"></div></div>';

/** STAT › AGENTS (B §6.2): the crew, the selected agent, its details. */
function viewAgents(view) {
  const s = S.snap;
  const all = agents();
  const items = needYou();
  const groups = crewGroups(all, items);
  const shown = groups.flatMap((g) => g.members);
  const { agent, picked } = heroAgent(all, shown, items);
  const title = { key: 'title', sig: 'AGENTS', html: viewTitle('AGENTS') };

  if (!shown.length && !picked) {
    const todo = whatToDo(null);
    const copy = (todo && todo.copy) || (items[0] && items[0].copy) || null;
    const html = '<div class="empty" style="min-height:calc(100% - 24px)">'
      + fig('dormindo', 200, false, 'agents-empty')
      + `<div class="msg"><p>${E(idleLine(s))}</p></div>`
      + (copy ? `<div class="cmdrow"><code>${E(copy)}</code>${copyBtn(copy, 'copy-cmd')}</div>` : '')
      + '</div>';
    keyed(view, [title, { key: 'idle', sig: html, html }]);
    return;
  }

  // The skeleton is kept from render to render; only its columns' children
  // are keyed, so nothing the stream did not change is rebuilt.
  keyed(view, [title, { key: 'cols', sig: 'cols', html: AGENT_COLS }]);
  const [list, hero, details] = view.querySelector(':scope > [data-key="cols"]').children;

  const rows = [];
  for (const g of groups) {
    rows.push({ key: `gh:${g.key}`, sig: g.head, html: `<div class="gh">${E(g.head)}</div>` });
    // Signed without the selection, which is a class toggled below: a row the
    // reader just clicked keeps its node, and the focus with it.
    for (const a of g.members) rows.push({ key: `a:${a.id}`, sig: crewRow(a, null), html: crewRow(a, agent.id) });
  }
  if (!rows.length) {
    const line = `<div class="kv dim"><span>${E(idleLine(s))}</span></div>`;
    rows.push({ key: 'idle', sig: line, html: line });
  }
  keyed(list, rows);
  for (const el of list.children) if (el.matches('button.li')) el.classList.toggle('sel', el.getAttribute('data-key') === `a:${agent.id}`);

  keyed(hero, heroItems(agent));
  keyed(hero.querySelector(':scope > [data-key="icons"]'), heroNumbers(agent).map((c, i) => {
    const html = heroCell(c);
    return { key: i, sig: html, html };
  }));

  keyed(details, detailItems(agent, all));
}

const COND_HTML = '<div class="cond"><div class="stage"></div><div class="pn" style="margin:6px 0 0"></div></div>';

/** The top of the stage: the end of the run, by the stage that is going. */
function endOfRunDash(s) {
  const keys = new Set(['merge', 'barriers', 'suite', 'review']);
  const stages = (s.stages || []).filter((x) => keys.has(x.key));
  const done = stages.filter((x) => x.status === 'done').length;
  const i = s.integration || {};
  // A suite skipped for want of a test command is `failed` in the stages and
  // is not a stop (B §8.2).
  const stopped = stages.find((x) => x.status === 'interrupted'
    || (x.status === 'failed' && !(x.key === 'suite' && i.suite && i.suite.skipped)));
  let text;
  if (s.integrationRunning) {
    const at = endOfRun(s);
    text = `<span class="blink">${E(at.label)} <span data-since="${E(at.since || '')}"></span></span>`;
  } else if (stopped) {
    text = E(`${String(stopped.label).toUpperCase()} ${stopped.key === 'review' && stopped.status === 'failed' ? 'FINDINGS' : WORD[stopped.status]}`);
  } else {
    text = `${done}/${stages.length}`;
  }
  const width = Math.max(8, Math.round((70 * done) / Math.max(1, stages.length)));
  return {
    key: 'end',
    html: `<button type="button" class="dash${stopped ? ' bad' : ''}" data-go="${E('tab=MAP')}" style="left:50%;top:2%;transform:translateX(-50%);align-items:center">`
      + `<span>END OF RUN · ${text}</span><i style="width:${width}px"></i></button>`,
  };
}

/** One lane, on its side of the operator. Its click opens the lane's current
 *  task: the first that stopped or went quiet, else the one running, else the
 *  next not done, else the last. */
function laneDash(lane, index, rows, all) {
  const tasks = (lane.tasks || []).map((t) => all.find((a) => a.id === `T${t.n}`)).filter(Boolean);
  const done = tasks.filter((a) => a.status === 'done').length;
  const hurt = tasks.find((a) => a.alert);
  const current = hurt || tasks.find((a) => a.status === 'running') || tasks.find((a) => a.status !== 'done') || tasks[tasks.length - 1];
  const row = Math.floor(index / 2);
  const [from, to] = rows <= 2 ? [24, 62] : [16, 76];
  const top = rows === 1 ? 43 : from + (row * (to - from)) / (rows - 1);
  const side = index % 2 === 0 ? 'right:calc(50% + 120px);align-items:flex-end' : 'left:calc(50% + 120px)';
  const label = `LANE ${lane.label || String(lane.id).toUpperCase()} · ${hurt ? `${WORD[hurt.status]} T${hurt.n}` : `${done}/${tasks.length}`}`;
  const width = Math.max(8, Math.round((70 * done) / Math.max(1, tasks.length)));
  const go = current ? ` data-go="${E(`sub=AGENTS&agent=${encodeURIComponent(current.id)}`)}"` : '';
  return {
    key: `lane:${lane.id}`,
    html: `<button type="button" class="dash${hurt ? ' bad' : ''}" data-testid="cond-lane-${E(lane.id)}"${go} style="${side};top:${top.toFixed(1)}%">`
      + `<span>${E(label)}</span><i style="width:${width}px"></i></button>`,
  };
}

/** The bottom of the stage: the next barrier, or the last one once all ran. */
function barrierDash(s, all) {
  const pos = 'left:50%;bottom:0;transform:translateX(-50%);align-items:center';
  const bars = (s.barriers || []).map((t) => all.find((a) => a.id === `T${t.n}`)).filter(Boolean);
  const next = bars.find((a) => a.status !== 'done') || bars[bars.length - 1];
  if (!next) return { key: 'barrier', html: `<div class="dash" style="${pos};cursor:default"><span>no barrier</span></div>` };
  return {
    key: 'barrier',
    html: `<button type="button" class="dash${next.alert ? ' bad' : ''}" data-go="${E(`tab=INV&task=${next.n}`)}" style="${pos}">`
      + `<i style="width:${next.status === 'done' ? 70 : 8}px"></i><span>BARRIER T${next.n} · ${E(WORD[next.status] || next.status)}</span></button>`,
  };
}

/** B §8.2 as rows: what happened, the tag, and the COPY that resolves it —
 *  the command, or the report's path for review findings (B §8.3). */
function alertItems(items) {
  const head = { key: 'head', sig: 'head', html: '<h4>ALERTS</h4>' };
  if (!items.length) return [head, { key: 'none', sig: 'none', html: '<div class="kv"><span>none</span><span>nothing needs you</span></div>' }];
  return [head, ...items.map((it, i) => {
    const warn = /^(NO SIGNAL|INTERRUPTED|FINDINGS|CHANGED)$/.test(it.tag);
    const what = `${E(it.label)} — ${E(gist(it.text, 200))}`;
    const html = `<div class="li alert" data-testid="alert-${i}">`
      + (it.agentId
        ? `<button type="button" class="go" data-go="${E(`sub=AGENTS&agent=${encodeURIComponent(it.agentId)}`)}">${what}</button>`
        : `<span class="go">${what}</span>`)
      + `<span class="act"><span class="tg ${warn ? 'warn' : 'bad'}">${E(it.tag)}</span>${it.copy ? copyBtn(it.copy, `copy-alert-${i}`) : ''}</span></div>`;
    return { key: it.key, sig: html, html };
  })];
}

/** STAT › CONDITION (B §6.2): the operator, the lanes around it, the end of
 *  the run above, the next barrier below, and the alerts. */
function viewCondition(view) {
  const s = S.snap;
  const all = agents();
  const items = needYou();
  keyed(view, [{ key: 'title', sig: 'CONDITION', html: viewTitle('CONDITION') }, { key: 'cond', sig: 'cond', html: COND_HTML }]);
  const [stage, alerts] = view.querySelector(':scope > [data-key="cond"]').children;

  const lanes = s.lanes || [];
  const rows = Math.ceil(lanes.length / 2);
  // Any number of lanes: past what the screen holds, the stage grows and the
  // view scrolls instead of stacking lanes on each other.
  const minHeight = `${Math.max(330, rows * 56 + 140)}px`;
  if (stage.style.minHeight !== minHeight) stage.style.minHeight = minHeight;

  const pose = items.length ? 'travado' : 'orgulho';
  const parts = [
    endOfRunDash(s),
    ...lanes.map((lane, i) => laneDash(lane, i, rows, all)),
    barrierDash(s, all),
    { key: 'fig', html: `<div class="fig">${fig(pose, 280, items.length > 0, 'condition')}</div>` },
  ];
  keyed(stage, parts.map((p) => ({ ...p, sig: p.html })));
  keyed(alerts, alertItems(items));
}

VIEWS.STAT.AGENTS = viewAgents;
VIEWS.STAT.CONDITION = viewCondition;

// -------------------------------------------------------------------- INV

/** Which tasks each INV sub-tab lists, by the derived state (B §6.3). */
const INV_FILTER = {
  ALL: () => true,
  PROBLEMS: (a) => STOPPED.has(a.status) || a.status === 'nosignal',
  RUNNING: (a) => a.status === 'running' || a.status === 'nosignal',
  QUEUE: (a) => a.status === 'pending',
  DONE: (a) => a.status === 'done',
};

const isLive = (a) => a.status === 'running' || a.status === 'nosignal';
// The figures STAT's hero reads (heroNumbers), so a task says the same thing
// in both places.
const effortFigure = (e) => (e ? `${e.used ?? e.planned}${e.raised ? ' ↑' : ''}` : 'inherited');
const triesFigure = (a, attempts) => (attempts ? (a.kind === 'task' ? `${attempts}/${MAX_TRIES}` : String(attempts)) : '—');

/** A running clock is a `data-since` for paintTimes, never a number. */
function taskTime(a) {
  const t = a.src;
  if (isLive(a) && t.startedAt) return `<span data-since="${E(t.startedAt)}"></span>`;
  return t.startedAt && t.endedAt ? E(dur(Date.parse(t.endedAt) - Date.parse(t.startedAt))) : '—';
}

const laneCell = (a) => (a.kind === 'barrier'
  ? `<td title="${E(BARRIER_TIP)}">BARRIER</td>`
  : `<td>${E(String(a.lane || '—').toUpperCase())}</td>`);

/** A row is a `<tr>` for the table and a `<button>` in its T cell for the
 *  keyboard (B §6.8); both carry the same `data-go`. */
function invRow(a, queue) {
  const t = a.src;
  const go = E(`task=${a.n}`);
  return `<tr class="r" data-testid="row-T${E(a.n)}" data-go="${go}">`
    + `<td><button type="button" data-go="${go}">T${E(a.n)}</button></td><td>${E(a.name)}</td>${laneCell(a)}`
    + `<td>${E(effortFigure(t.effort))}</td><td>${E(triesFigure(a, t.attempts))}</td><td>${taskTime(a)}</td>`
    + `<td>${E(money(t.costUsd))}</td><td>${stateTag(a.status)}</td>`
    + (queue ? `<td>${E(queueAfter(t, S.snap))}</td>` : '')
    + '</tr>';
}

/*
 * The record: `/api/task` for the selected task, fetched when it is selected
 * and again when its status, attempts or turns move in the snapshot. `key`
 * is the one wanted now; a response for any other key is dropped, so a newer
 * selection always wins over an older fetch. `slot` is the view's own copy:
 * INV's is REC, and DATA › QUESTS keeps one of its own (QREC).
 */
const REC = { key: null, n: null, task: null, error: null };

const recKey = (a) => `${a.n}|${a.src.status}|${a.src.attempts}|${a.src.turns}`;

async function loadRecord(n, key, slot = REC) {
  slot.key = key;
  let task = null;
  let error = null;
  try {
    const r = await fetch(`/api/task?n=${encodeURIComponent(n)}`);
    const body = await r.json().catch(() => ({}));
    if (r.ok && body.task) task = body.task;
    else error = body.error || `HTTP ${r.status}`;
  } catch (e) {
    error = e.message;
  }
  if (slot.key !== key) return;
  Object.assign(slot, { n, task, error });
  render();
}

const recKv = (k, v) => `<div class="kv"><span>${E(k)}</span><span>${v}</span></div>`;

/** A value with its COPY in the block's header (B §6.7). */
const copyBlock = (head, value, testid) => `<div class="pn"><div class="hrow"><h4>${E(head)}</h4>${copyBtn(value, testid)}</div>`
  + `<div class="val">${E(value)}</div></div>`;

/** The record's parts as [key, html]: the header from the snapshot, the rest
 *  from `/api/task` once it answered. */
function recordParts(a, t, err) {
  const parts = [];
  const where = a.kind === 'barrier' ? `<span title="${E(BARRIER_TIP)}">BARRIER</span>` : `LANE ${E(String(a.lane || '—').toUpperCase())}`;
  parts.push(['head', `<div class="pn"><h4>${where}</h4><div class="rt">T${E(a.n)} · ${E(a.name)}</div>${stateTag(a.status)}</div>`]);
  if (err) parts.push(['fail', `<div class="pn"><div class="note bad">${E(err)}</div></div>`]);
  if (!t) {
    if (!err) parts.push(['wait', '<div class="kv dim"><span>loading the record…</span></div>']);
    return parts;
  }

  if (t.error) {
    parts.push(['error', `<div class="pn bad" data-testid="error-block"><div class="hrow"><h4>${a.status === 'blocked' ? 'WHY IT STOPPED' : 'ERROR'}</h4>`
      + `${copyBtn(t.error, 'copy-error')}</div><div class="note bad md">${md(t.error)}</div></div>`]);
  }
  const todo = whatToDo(a);
  if (todo && todo.command) {
    parts.push(['cmd', `<div class="pn"><h4>COMMAND</h4><div class="note"><div class="cmd" style="margin:0"><code>${E(todo.command)}</code>`
      + `${copyBtn(todo.command, 'copy-cmd')}</div></div></div>`]);
  }

  const e = t.effort;
  const source = e && (e.used ? `used${e.planned && e.planned !== e.used ? ` · planned ${e.planned}` : ''}` : 'planned');
