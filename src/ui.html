  parts.push(['effort', '<div class="pn" data-testid="record-effort"><h4>EFFORT</h4>'
    + recKv('level', E(effortFigure(e)))
    + (e ? recKv('source', E(source)) + recKv('why', E(e.reason || '—')) : '')
    + '</div>']);

  // One link per attempt, and the one in flight at the end.
  const chain = (t.tries || []).map((x) => ({ text: `${x.effort || 'inherited'} ${x.status}`, bad: STOPPED.has(x.status) }));
  if (isLive(a)) chain.push({ text: `${(e && (e.used || e.planned)) || 'inherited'} running`, bad: false });
  parts.push(['tries', '<div class="pn"><h4>TRIES</h4><div class="tries" data-testid="record-tries">'
    + (chain.length ? chain.map((x) => `<span${x.bad ? ' class="f"' : ''}>${E(x.text)}</span>`).join(' › ') : '<span class="dim">none yet</span>')
    + '</div></div>']);

  parts.push(['kv', '<div class="pn"><h4>RECORD</h4>'
    + recKv('status', E(`${WORD[a.status] || a.status}${a.kind === 'barrier' ? ' · barrier' : ''}`))
    + recKv('lane', a.lane ? E(String(a.lane).toUpperCase()) : '—')
    + recKv('duration', taskTime(a))
    + recKv('turns', E(String(t.turns || 0)))
    + recKv('attempts', E(triesFigure(a, t.attempts)))
    + recKv('output tokens', E(tokens(t.outputTokens)))
    + recKv('cost', E(money(t.costUsd)))
    + recKv('model', E(t.model || '—'))
    + recKv('commits', (t.commits || []).length ? E(t.commits.map((c) => String(c).slice(0, 7)).join(' ')) : '—')
    + '</div>']);
  if (t.sessionId) parts.push(['session', copyBlock('SESSION', t.sessionId, 'copy-session')]);
  if (t.logFile) parts.push(['log', copyBlock('LOG', t.logFile, 'copy-log')]);

  // A blocked task's error IS its final message; printing both reads as two
  // findings when there is one. The stored error keeps the report's line
  // breaks and the digest collapses them, so compare on flattened text.
  const flat = (x) => String(x || '').replace(/\s+/g, ' ').trim();
  const resultText = t.result && (t.result.body || t.result.text);
  const duplicated = resultText && t.error
    && (flat(t.error).includes(flat(resultText).slice(0, 60)) || flat(resultText).includes(flat(t.error).slice(0, 60)));
  if (resultText && !duplicated) {
    parts.push(['result', `<div class="pn"><h4>AGENT RESULT${t.result.clipped ? ' · CLIPPED' : ''}</h4><div class="note md">${md(resultText)}</div></div>`]);
  }
  const files = (head, list) => `<div class="pn"><h4>${head}</h4>${list.map((f) => `<div class="val">${E(f)}</div>`).join('')}</div>`;
  if (t.files && t.files.writes.length) parts.push(['writes', files('DECLARED WRITES', t.files.writes)]);
  if (t.files && t.files.excluded.length) parts.push(['excluded', files('EXCLUDED BY NEGATION', t.files.excluded)]);
  if (t.steps && t.steps.length) {
    parts.push(['steps', '<div class="pn"><h4>PLAN STEPS</h4><div class="md"><ul class="tick">'
      + t.steps.map((st) => `<li class="${st.checked ? 'on' : ''}">${checkbox(st.checked)}<span>${mdInline(E(st.text))}</span></li>`).join('')
      + '</ul></div></div>']);
  }
  const acts = (t.activity || []).slice().reverse();
  parts.push(['acts', `<div class="pn"><h4>ACTIVITY${t.truncated ? ' · TAIL' : ''}</h4>`
    + (acts.length ? acts.map(actRow).join('') : '<div class="kv dim"><span>no agent events recorded</span></div>') + '</div>']);
  parts.push(['agent', `<button type="button" class="lnk" data-go="${E(`tab=STAT&agent=${encodeURIComponent(a.id)}`)}">see the agent in STAT ▸</button>`]);
  return parts;
}

/** INV (B §6.3): the tasks and barriers of the run, filtered by sub-tab, and
 *  the record of the selected one. No selection, no record. */
function viewInv(view, sub) {
  const all = agents().filter((a) => a.kind === 'task' || a.kind === 'barrier').sort((x, y) => x.n - y.n);
  const queue = sub === 'QUEUE';
  const heads = ['T', 'NAME', 'LANE', 'EFFORT', 'TRIES', 'TIME', '$', 'STATE', ...(queue ? ['WAITING ON'] : [])];
  const cols = '<div class="cols inv">'
    + `<div class="col"><table class="tbl" data-testid="inv-table"><thead><tr>${heads.map((h) => `<th>${E(h)}</th>`).join('')}</tr></thead><tbody></tbody></table></div>`
    + '<div class="col"></div></div>';
  keyed(view, [{ key: 'title', sig: sub, html: viewTitle(sub) }, { key: 'cols', sig: cols, html: cols }]);
  const [left, right] = view.querySelector(':scope > [data-key="cols"]').children;
  const body = left.querySelector('tbody');

  // Signed without the selection, a class toggled below: the row the reader
  // just clicked keeps its node, and the focus with it.
  const rows = all.filter(INV_FILTER[sub]).map((a) => {
    const html = invRow(a, queue);
    return { key: a.id, sig: html, html };
  });
  if (!rows.length) {
    const html = `<tr><td colspan="${heads.length}" class="dim">nothing here</td></tr>`;
    rows.push({ key: 'none', sig: html, html });
  }
  keyed(body, rows);
  const selKey = S.sel.task == null ? null : `T${S.sel.task}`;
  for (const tr of body.children) tr.classList.toggle('sel', tr.getAttribute('data-key') === selKey);

  const n = S.sel.task;
  const a = n == null ? null : all.find((x) => x.n === n);
  if (!a) {
    REC.key = null;
    const html = `<div class="kv dim"><span>${E(n == null ? 'select a task to open its record' : `no task ${n} in this run`)}</span></div>`;
    keyed(right, [{ key: 'hint', sig: html, html }]);
    return;
  }
  const key = recKey(a);
  if (REC.key !== key) loadRecord(a.n, key);
  keyed(right, [{ key: `rec:${a.n}`, sig: 'rec', html: '<div class="rec" data-testid="record"></div>' }]);
  const mine = REC.n === a.n;
  keyed(right.firstElementChild, recordParts(a, mine ? REC.task : null, mine ? REC.error : null).map(([k, html]) => ({ key: k, sig: html, html })));
}

VIEWS.INV.ALL = (el) => viewInv(el, 'ALL');
VIEWS.INV.PROBLEMS = (el) => viewInv(el, 'PROBLEMS');
VIEWS.INV.RUNNING = (el) => viewInv(el, 'RUNNING');
VIEWS.INV.QUEUE = (el) => viewInv(el, 'QUEUE');
VIEWS.INV.DONE = (el) => viewInv(el, 'DONE');

// ------------------------------------------------------------------- DATA

/** The quest groups (B §6.4): going or stopped, waiting, done. */
const QUEST_GROUPS = [
  ['IN PROGRESS', (a) => a.status === 'running' || a.status === 'nosignal' || STOPPED.has(a.status)],
  ['QUEUED', (a) => a.status === 'pending'],
  ['DONE', (a) => a.status === 'done'],
];

/** QUESTS' own record: its selection is not INV's, so neither is its fetch. */
const QREC = { key: null, n: null, task: null, error: null };

function questRow(a) {
  return `<button type="button" class="li${a.status === 'running' ? ' run' : ''}" data-testid="quest-T${E(a.n)}" data-go="${E(`quest=${a.n}`)}">`
    + `<span>T${E(a.n)} ${E(a.name)}</span>${a.status === 'done' ? '' : stateTag(a.status)}</button>`;
}

/** The plan's own steps, ticked or not (INV's PLAN STEPS markup). */
function objectivesHtml(t, err) {
  if (err) return `<div class="note bad">${E(err)}</div>`;
  if (!t) return '<div class="kv dim"><span>loading the objectives…</span></div>';
  if (!t.steps || !t.steps.length) return '<div class="kv dim"><span>the plan lists no steps for this task</span></div>';
  return '<div class="md"><ul class="tick" data-testid="objectives">'
    + t.steps.map((st) => `<li class="${st.checked ? 'on' : ''}">${checkbox(st.checked)}<span>${mdInline(E(st.text))}</span></li>`).join('')
    + '</ul></div>';
}

/** The selected quest as [key, html]: the header and the reason it stopped
 *  from the snapshot, the objectives from `/api/task` once it answered. */
function questParts(a, t, err) {
  const where = a.kind === 'barrier' ? 'QUEST · BARRIER' : `QUEST · LANE ${String(a.lane || '—').toUpperCase()}`;
  const e = a.src.effort;
  const parts = [
    ['head', `<div class="pn"><h4>${E(where)}</h4><div class="qt">T${E(a.n)} ${E(a.name)}</div>`
      + `<span class="dim">effort ${E(effortFigure(e))}${e && e.reason ? ` — ${E(e.reason)}` : ''}</span></div>`],
    ['goals', `<div class="pn"><h4>OBJECTIVES</h4>${objectivesHtml(t, err)}</div>`],
  ];
  if (STOPPED.has(a.status)) {
    const why = a.src.error || (whatToDo(a) || {}).text || 'no error recorded';
    parts.push(['why', `<div class="pn bad"><div class="hrow"><h4>WHY IT STOPPED</h4>${copyBtn(why, 'copy-error')}</div>`
      + `<div class="note bad md">${md(why)}</div></div>`]);
  }
  parts.push(['inv', `<button type="button" class="lnk" data-go="${E(`tab=INV&task=${a.n}`)}">details in INV ▸</button>`]);
  return parts;
}

/** DATA › QUESTS (B §6.4): every task and barrier as a quest, and the
 *  objectives of the selected one. The default pick is worked out on every
 *  render and never written to the hash. */
function viewQuests(view) {
  const all = agents().filter((a) => a.kind === 'task' || a.kind === 'barrier').sort((x, y) => x.n - y.n);
  const groups = QUEST_GROUPS.map(([head, test]) => [head, all.filter(test)]);
  const picked = S.sel.quest == null ? null : all.find((a) => a.n === S.sel.quest);
  const q = picked || groups.map(([, list]) => list[0]).find(Boolean) || null;
  const cols = '<div class="cols quests"><div class="col"></div><div class="col"></div></div>';
  keyed(view, [{ key: 'title', sig: 'QUESTS', html: viewTitle('QUESTS') }, { key: 'cols', sig: cols, html: cols }]);
  const [left, right] = view.querySelector(':scope > [data-key="cols"]').children;

  // Signed without the selection, a class toggled below: the quest the reader
  // just clicked keeps its node, and the focus with it.
  const rows = [];
  for (const [head, list] of groups) {
    rows.push({ key: `gh:${head}`, sig: head, html: `<div class="gh">${E(head)}</div>` });
    for (const a of list) {
      const html = questRow(a);
      rows.push({ key: `q:${a.id}`, sig: html, html });
    }
    if (!list.length) rows.push({ key: `none:${head}`, sig: 'none', html: '<div class="kv dim"><span>none</span></div>' });
  }
  keyed(left, rows);
  for (const el of left.children) if (el.matches('button.li')) el.classList.toggle('sel', Boolean(q) && el.getAttribute('data-key') === `q:${q.id}`);

  if (!q) {
    QREC.key = null;
    const html = '<div class="kv dim"><span>no task in this run</span></div>';
    keyed(right, [{ key: 'hint', sig: html, html }]);
    return;
  }
  const key = recKey(q);
  if (QREC.key !== key) loadRecord(q.n, key, QREC);
  const mine = QREC.n === q.n;
  keyed(right, questParts(q, mine ? QREC.task : null, mine ? QREC.error : null).map(([k, html]) => ({ key: k, sig: html, html })));
}

const FEED_FILTERS = [['all', ''], ['errors', 'err'], ['bash', 'bash'], ['edits', 'edit']];

/** Who did it: `T7` for a task's own event, `T7 › implementer` for one of its
 *  subagents'. A done task keeps no children, so the type falls back to the
 *  spawn call in the feed itself. */
function feedWho(ev, all, feed) {
  if (!ev.sub) return `T${ev.n}`;
  const kid = all.find((a) => a.kind === 'sub' && a.n === ev.n && a.id === ev.parentId);
  const spawn = kid ? null : feed.find((x) => x.id && x.id === ev.parentId);
  return `T${ev.n} › ${(kid && kid.src.agentType) || (spawn && spawn.agentType) || 'subagent'}`;
}

/** The run feed and the reviewer's own events as one list, newest on top. An
 *  event with no time takes the last one its own source had. */
function logEvents(s, all) {
  const feed = s.feed || [];
  const last = new Map();
  const timed = (ev, source, tag) => {
    const at = ev.at || last.get(source) || null;
    if (at) last.set(source, at);
    return { ...ev, at, tag };
  };
  const out = [
    ...feed.map((ev) => timed(ev, `T${ev.n}`, feedWho(ev, all, feed))),
    ...((s.reviewer && s.reviewer.activity) || []).map((ev) => timed(ev, 'review', 'review')),
  ];
  const ms = (ev) => { const v = Date.parse(ev.at); return Number.isFinite(v) ? v : 0; };
  return out.sort((x, y) => ms(x) - ms(y)).reverse();
}

/** One line of the log: time, who, tool, target (as actRow maps them). */
function logRow(ev) {
  const [what, obj] = ev.kind === 'text' ? ['think', ev.text]
    : ev.kind === 'run' ? ['start', ev.label]
      : ev.kind === 'result' ? ['result', ev.text]
        : [ev.name, ev.target || ev.preview];
  return `<div class="ac lr${ev.ok === false ? ' err' : ''}" data-testid="log-row"><span>${E(hms(ev.at))}</span>`
    + `<span class="who" title="${E(ev.tag)}">${E(ev.tag)}</span><span>${E(what || '')}</span>`
    + `<span class="o" title="${E(obj || '')}">${E(obj || '')}</span></div>`;
}

/** Built once per visit: the query rides in as the box's first value only. */
const logBar = () => '<div class="logbar">'
  + `<input type="search" data-testid="log-search" placeholder="search the log" aria-label="Search the log" autocomplete="off" spellcheck="false" value="${E(feedQuery)}">`
  + FEED_FILTERS.map(([name, kind]) => `<button type="button" class="tg" data-testid="log-filter-${name}" data-feed="${kind}" aria-pressed="false">${name.toUpperCase()}</button>`).join('')
  + '<button type="button" class="tg" data-testid="log-wrap" data-wrap aria-pressed="false">WRAP</button>'
  + '</div>';

/** DATA › LOG (B §6.4): the run feed plus the reviewer, with search, filter
 *  and wrap. The suite's lines live in RADIO, not here. */
function viewLog(view) {
  const s = S.snap;
  const events = logEvents(s, agents());
  const shown = events.filter(feedMatch);
  keyed(view, [
    { key: 'title', sig: 'LOG', html: viewTitle('LOG') },
    // A constant signature: the search box keeps its node, focus, caret and
    // value through every repaint. What is pressed is toggled below.
    { key: 'bar', sig: 'bar', html: logBar() },
    { key: 'list', sig: 'list', html: '<div class="col loglist" data-testid="log-list"></div>' },
  ]);
  const bar = view.querySelector(':scope > [data-key="bar"]');
  const list = view.querySelector(':scope > [data-key="list"]');
  for (const b of bar.querySelectorAll('[data-feed]')) {
    const on = b.getAttribute('data-feed') === feedKind;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
  }
  const wrap = bar.querySelector('[data-wrap]');
  wrap.classList.toggle('on', feedWrap);
  wrap.setAttribute('aria-pressed', String(feedWrap));
  list.classList.toggle('wrap', feedWrap);

  const seen = new Map();
  const rows = shown.map((ev) => {
    const base = `${ev.tag}|${ev.at || ''}|${ev.kind}|${ev.id || ev.name || ev.label || ''}|${keyHash(`${ev.text || ''}|${ev.target || ''}|${ev.preview || ''}`)}`;
    const k = seen.get(base) || 0;
    seen.set(base, k + 1);
    const html = logRow(ev);
    return { key: k ? `${base}#${k}` : base, sig: html, html };
  });
  if (!rows.length) {
    const html = `<div class="kv dim"><span>${events.length ? 'no event matches' : 'no agent events yet'}</span></div>`;
    rows.push({ key: 'empty', sig: html, html });
  }
  keyed(list, rows);
}

/** A stage's span, compact: `30s`, `1m`, `1m 30s`, `2h`, `2h 5m`. Clocks
 *  keep `dur()`. */
function compactDur(ms) {
  if (ms == null || !Number.isFinite(ms) || ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m${s % 60 ? ` ${s % 60}s` : ''}`;
  const m = Math.floor((s % 3600) / 60);
  return `${Math.floor(s / 3600)}h${m ? ` ${m}m` : ''}`;
}

/** The stage's live state first: a re-run suite keeps its old skipped result
 *  until it returns, and must not read as not run while it runs or after it
 *  died. */
function stageFigure(x, i) {
  if (x.status === 'running') return 'running';
  if (x.status === 'interrupted') return 'interrupted';
  if (x.key === 'suite' && i.suite && i.suite.skipped) return 'not run — no test command';
  if (x.startedAt && x.endedAt) return compactDur(Date.parse(x.endedAt) - Date.parse(x.startedAt));
  return '—';
}

const EFFORT_LEVELS = ['low', 'medium', 'high', 'xhigh', 'max'];

// Label, bar and value sit apart in the markup, and so do the rows, so a row
// reads "medium 4 tasks" and a panel never runs two rows into one word; the
// layout hides the spaces.
const barRow = (label, pct, value) => ` <div><span>${label}</span> <i style="width:${pct}%"></i> <span>${value}</span></div>`;
const numKv = (k, v) => ` <div class="kv"><span>${E(k)}</span> <span>${v}</span></div>`;

/** NUMBERS' four panels, as HTML: cost per lane, effort in the plan, the
 *  stages, the run. */
function numbersPanels(s) {
  const i = s.integration || {};
  const lanes = s.lanes || [];
  const tasks = [...lanes.flatMap((l) => l.tasks || []), ...(s.barriers || [])];

  const costs = lanes.map((l) => {
    const ts = l.tasks || [];
    const paid = ts.map((t) => t.costUsd).filter((c) => typeof c === 'number' && Number.isFinite(c));
    return {
      label: `LANE ${l.label || String(l.id).toUpperCase()} · ${ts.filter((t) => t.status === 'done').length}/${ts.length}`,
      cost: paid.length ? paid.reduce((a, b) => a + b, 0) : null,
    };
  });
  const dearest = Math.max(0, ...costs.map((c) => c.cost || 0));
  const lanecost = '<div class="pn" data-testid="numbers-lanecost"><h4>COST PER LANE</h4><div class="bars">'
    + costs.map((c) => barRow(E(c.label), dearest > 0 && c.cost ? Math.round((100 * c.cost) / dearest) : 0, E(money(c.cost)))).join('')
    + '</div></div>';

  const count = Object.fromEntries(EFFORT_LEVELS.map((k) => [k, 0]));
  let inherited = 0;
  for (const t of tasks) {
    const p = t.effort && t.effort.planned;
    if (!p) inherited += 1;
    else if (p in count) count[p] += 1;
  }
  const share = (n) => Math.round((100 * n) / Math.max(1, tasks.length));
  const raised = tasks.filter((t) => t.effort && t.effort.raised);
  const effort = '<div class="pn" data-testid="numbers-effort"><h4>EFFORT IN PLAN</h4><div class="bars">'
    + EFFORT_LEVELS.map((k) => barRow(k, share(count[k]), `${count[k]} tasks`)).join('')
    + (inherited ? barRow('inherited', share(inherited), `${inherited} tasks`) : '')
    + '</div>'
    + numKv('raised', E(`${raised.length}${raised.length ? ` · ${raised.map((t) => `T${t.n}`).join(', ')}` : ''}`))
    + '</div>';

  const stages = '<div class="pn" data-testid="numbers-stages"><h4>STAGES</h4>'
    + (s.stages || []).map((x) => numKv(x.label, E(stageFigure(x, i)))).join('')
    + '</div>';

  const o = outcomeOf(s, tasks);
  const base = s.base || {};
  const running = (key) => (s.stages || []).some((x) => x.key === key && x.status === 'running');
  const suite = running('suite') ? 'running'
    : i.suite ? (i.suite.skipped ? 'not run' : i.suite.ok ? 'pass' : 'fail') : '—';
  const review = running('review') ? 'running'
    : i.review ? (i.review.verdict ? mdInline(E(i.review.verdict)) : i.review.clean ? 'clean' : 'findings') : '—';
  const run = '<div class="pn" data-testid="numbers-run"><h4>RUN</h4>'
    + numKv('plan', E(s.title || '—'))
    + numKv('base', E(base.branch ? `${base.branch} @ ${String(base.commit || '').slice(0, 7)}` : '—'))
    + numKv('test command', E(s.testCommand || '—'))
    + numKv('lanes', E(`${lanes.length} · max ${s.maxLanes ?? '—'}`))
    + numKv('wall clock', E(o ? dur(o.wallSeconds * 1000) : '—'))
    + numKv('agent time', E(o ? dur(o.agentSeconds * 1000) : '—'))
    + numKv('gain', E(o ? `${(o.agentSeconds / o.wallSeconds).toFixed(1)}×` : '—'))
    + numKv('tokens', E(tokens(s.totals.outputTokens)))
    + numKv('commits', E(String(tasks.reduce((n, t) => n + (t.commits || []).length, 0))))
    + numKv('full suite', E(suite))
    + numKv('review', review)
    + '</div>';
  return { lanecost, effort, stages, run };
}

/** DATA › NUMBERS (B §6.4). No "time stopped waiting for people": nothing
 *  in the run records it. */
function viewNumbers(view) {
  const p = numbersPanels(S.snap);
  const cols = '<div class="cols nums"><div class="col"></div><div class="col"></div></div>';
  keyed(view, [{ key: 'title', sig: 'NUMBERS', html: viewTitle('NUMBERS') }, { key: 'cols', sig: cols, html: cols }]);
  const [left, right] = view.querySelector(':scope > [data-key="cols"]').children;
  const items = (list) => list.map(([key, html]) => ({ key, sig: html, html }));
  keyed(left, items([['lanecost', p.lanecost], ['effort', p.effort]]));
  keyed(right, items([['stages', p.stages], ['run', p.run]]));
}

VIEWS.DATA.QUESTS = viewQuests;
VIEWS.DATA.LOG = viewLog;
VIEWS.DATA.NUMBERS = viewNumbers;

// -------------------------------------------------------------------- MAP

/** The map's geometry, in px. It never scales with the screen: a run wider
 *  than the view scrolls sideways (B §6.5). `top` leaves room above the first
 *  track for an operator; `row` keeps one track's names clear of the next
 *  track's operators. */
const MAP_GRID = { left: 56, top: 58, row: 82, col: 78, gap: 44, node: 64, sq: 14, right: 24, bottom: 44 };

/**
 * Every lane task's column (B §6.5): the longest path to it, over the plan's
 * edges between lane tasks plus an implicit edge from each task to the next
 * in its lane, which runs in sequence. An edge naming a task outside the
 * lanes is dropped. One that would close a cycle is ignored, lane order going
 * in first, so a bad graph still draws. Returns the columns, each task's lane
 * index, and the kept edges between two lanes, the only ones drawn.
 */
function mapColumns(lanes, edges) {
  const laneIx = new Map();
  lanes.forEach((lane, i) => { for (const t of lane.tasks || []) if (!laneIx.has(t.n)) laneIx.set(t.n, i); });
  const out = new Map([...laneIx.keys()].map((n) => [n, new Set()]));
  const reaches = (from, to) => {
    const seen = new Set([from]);
    const stack = [from];
    while (stack.length) {
      const v = stack.pop();
      if (v === to) return true;
      for (const w of out.get(v)) if (!seen.has(w)) { seen.add(w); stack.push(w); }
    }
    return false;
  };
  const link = (from, to) => {
    if (from === to || out.get(from).has(to) || reaches(to, from)) return false;
    out.get(from).add(to);
    return true;
  };
  lanes.forEach((lane, i) => {
    const ns = (lane.tasks || []).map((t) => t.n).filter((n) => laneIx.get(n) === i);
    for (let k = 1; k < ns.length; k += 1) link(ns[k - 1], ns[k]);
  });
  const cross = [];
  for (const e of edges || []) {
    const from = Number(e && e.from);
    const to = Number(e && e.to);
    if (!laneIx.has(from) || !laneIx.has(to)) continue;
    if (link(from, to) && laneIx.get(from) !== laneIx.get(to)) cross.push({ from, to });
  }
  // Longest path in topological order; the graph is acyclic by construction.
  const col = new Map([...out.keys()].map((n) => [n, 0]));
  const indeg = new Map([...out.keys()].map((n) => [n, 0]));
  for (const ws of out.values()) for (const w of ws) indeg.set(w, indeg.get(w) + 1);
  const queue = [...out.keys()].filter((n) => indeg.get(n) === 0);
  for (let q = 0; q < queue.length; q += 1) {
    for (const w of out.get(queue[q])) {
      col.set(w, Math.max(col.get(w), col.get(queue[q]) + 1));
      indeg.set(w, indeg.get(w) - 1);
      if (indeg.get(w) === 0) queue.push(w);
    }
  }
  return { col, laneIx, cross };
}

/** A task's node (B §6.5): full when done, blinking while it runs, amber once
 *  it stopped or went quiet, dim while it waits. */
const nodeClass = (a) => (a.status === 'done' ? 'done' : a.status === 'running' ? 'run' : a.alert ? 'al' : 'pend');

/** The same four for a stage at the end of the run. A suite skipped for want
 *  of a test command is `failed` in the stages and is no stop (B §8.2). */
function stageClass(key) {
  const st = stageOf(key);
  const status = st ? st.status : 'pending';
  if (status === 'done') return 'done';
  if (status === 'running') return 'run';
  if (status === 'interrupted') return 'al';
  if (status === 'failed') {
    const i = S.snap.integration || {};
    return key === 'suite' && i.suite && i.suite.skipped ? 'pend' : 'al';
  }
  return 'pend';
}

/** One node: a button when a click opens something, its operator above it. */
function mapNode(n) {
  const tag = n.go ? 'button' : 'div';
  const go = n.go ? ` type="button" data-go="${E(n.go)}"` : '';
  return `<${tag} class="mn ${n.cls}" data-testid="node-${E(n.id)}"${go} title="${E(n.title)}" style="left:${n.x}px;top:${n.y}px">`
    + (n.op ? `<span class="op">${n.op}</span>` : '')
    + `<i${n.cls === 'run' ? ' class="blink"' : ''}></i><span>${E(n.label)}</span>`
    + (n.detail ? `<small>${E(n.detail)}</small>` : '')
    + `</${tag}>`;
}

/** The drawing as keyed children: the routes, the lane names, the nodes. A
 *  node's signature is its markup, so one that did not change keeps its
 *  operator, and the operator its animation. */
function mapItems(s, all) {
  const G = MAP_GRID;
  const lanes = s.lanes || [];
  const byId = new Map(all.map((a) => [a.id, a]));
  const { col, laneIx, cross } = mapColumns(lanes, s.edges);
  const last = Math.max(-1, ...col.values());
  const rowY = (i) => G.top + i * G.row;
  const cy = lanes.length ? (rowY(0) + rowY(lanes.length - 1)) / 2 : G.top;
  const colX = (c) => G.left + c * G.col;
  const endX = (k) => colX(last + 1) + (last >= 0 ? G.gap : 0) + k * G.col;
  const mid = (x) => x + G.node / 2;
  const top = (y) => y - G.sq / 2;
  const seen = new Set();
  const nodes = [];

  const taskNode = (a, x, y, barrier) => {
    const cls = nodeClass(a);
    nodes.push({
      id: a.id, label: a.id, cls, x, y: top(y), go: `tab=INV&task=${a.n}`,
      op: cls === 'run' || cls === 'al' ? fig(a.pose, 44, a.alert, a.id) : '',
      title: [a.id, a.name, barrier && 'barrier', WORD[a.status] || a.status].filter(Boolean).join(' · '),
    });
  };
  // MERGE has no click and no operator; SUITE and REVIEW open their station,
  // and carry their agent's operator while their stage runs.
  const stageNode = (key, id, x, go, crew) => {
    const st = stageOf(key);
    const a = crew ? byId.get(crew) : null;
    const pose = (a && a.pose) || poseFor({ kind: crew, status: 'running' });
    nodes.push({
      id, label: id, cls: stageClass(key), x, y: top(cy), go,
      op: crew && st && st.status === 'running' ? fig(pose, 44, Boolean(a && a.alert), crew) : '',
      title: st ? [st.label, st.detail].filter(Boolean).join(' · ') : id,
      detail: st ? st.detail : '',
    });
  };

  lanes.forEach((lane, i) => {
    for (const t of lane.tasks || []) {
      const a = byId.get(`T${t.n}`);
      if (!a || laneIx.get(t.n) !== i || seen.has(t.n)) continue;
      seen.add(t.n);
      taskNode(a, colX(col.get(t.n)), rowY(i), false);
    }
  });
  let k = 0;
  stageNode('merge', 'MERGE', endX(k++), null, null);
  for (const t of s.barriers || []) {
    const a = byId.get(`T${t.n}`);
    if (!a || seen.has(t.n)) continue;
    seen.add(t.n);
    taskNode(a, endX(k++), cy, true);
  }
  stageNode('suite', 'SUITE', endX(k++), 'tab=RADIO&station=suite', 'suite');
  stageNode('review', 'REVIEW', endX(k), 'tab=RADIO&station=review', 'review');

  const width = endX(k) + G.node + G.right;
  const height = Math.max(rowY(Math.max(0, lanes.length - 1)), cy) + G.bottom;
  const mergeX = mid(endX(0));
  const runEnd = mid(colX(Math.max(0, last)));
  const bend = (mergeX - runEnd) / 2;
  // Each lane is a track that runs to the last column and bends into MERGE;
  // the end of the run is one line; an edge between lanes is dashed.
  let svg = `<svg class="route" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-hidden="true" focusable="false">`;
  lanes.forEach((lane, i) => {
    const y = rowY(i);
    svg += `<path class="trk" d="M${G.left} ${y} H${runEnd} C${runEnd + bend} ${y} ${mergeX - bend} ${cy} ${mergeX} ${cy}"/>`;
  });
  svg += `<path class="ctr" d="M${mergeX} ${cy} H${mid(endX(k))}"/>`;
  for (const e of cross) {
    const x1 = mid(colX(col.get(e.from)));
    const y1 = rowY(laneIx.get(e.from));
    const x2 = mid(colX(col.get(e.to)));
    const y2 = rowY(laneIx.get(e.to));
    const mx = (x1 + x2) / 2;
    svg += `<path class="xe" data-testid="map-edge" data-from="${e.from}" data-to="${e.to}" d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}"/>`;
  }
  svg += '</svg>';

  const names = lanes.map((lane, i) => {
    const name = lane.label || String(lane.id).toUpperCase();
    return { key: `lane:${i}`, html: `<span class="ml" title="${E(`LANE ${name}`)}" style="top:${rowY(i)}px;width:${G.left - 14}px">${E(name)}</span>` };
  });
  const items = [{ key: 'svg', html: svg }, ...names, ...nodes.map((n) => ({ key: `node:${n.id}`, html: mapNode(n) }))];
  return { items: items.map((it) => ({ ...it, sig: it.html })), width, height };
}

const MAP_LEGEND = '<div class="pn" data-testid="map-legend"><h4>LEGEND</h4>'
  + [['trabalhando', 'running', false], ['travado', 'stuck · needs you', true], ['falhou', 'failed', true], ['dormindo', 'no signal', true], ['orgulho', 'done', false]]
    .map(([pose, text, al]) => `<div class="lg"><span class="lgf">${fig(pose, 44, al, `legend-${pose}`)}</span><span>${text}</span></div>`).join('')
  + '</div><div class="note">Click a task to open it in INV; SUITE or REVIEW to listen on RADIO. A dashed line is a task waiting on one in another lane.</div>';

const MAP_COLS = '<div class="cols lanes">'
  + '<div class="col"><div class="map" data-testid="map"><div class="mapd"></div></div></div><div class="col"></div></div>';

/** MAP › LANES (B §6.5): one track per lane, in the order of `lanes`, that
 *  converge in MERGE, then the barriers in order, SUITE and REVIEW. */
function viewMap(view) {
  keyed(view, [{ key: 'title', sig: 'LANES', html: viewTitle('LANES') }, { key: 'cols', sig: 'cols', html: MAP_COLS }]);
  const [left, right] = view.querySelector(':scope > [data-key="cols"]').children;
  const draw = left.querySelector('.mapd');
  const { items, width, height } = mapItems(S.snap, agents());
  if (draw.style.width !== `${width}px`) draw.style.width = `${width}px`;
  if (draw.style.height !== `${height}px`) draw.style.height = `${height}px`;
  keyed(draw, items);
  keyed(right, [{ key: 'legend', sig: 'legend', html: MAP_LEGEND }]);
}

VIEWS.MAP.LANES = viewMap;

// ------------------------------------------------------------------ RADIO

/*
 * RADIO › STATIONS (B §6.6): every source of live output is a station. The
 * suite and the review are always on the list; a lane task or barrier is while
 * it runs and has a test run on record, and leaves the list when it stops.
 */

/** The L axis: a base with ticks pointing up and a ruler on the right with
 *  ticks pointing left. No box, no grid. */
const SCOPE_AXES = (() => {
  let d = '';
  for (let x = 16; x < 390; x += 8) d += `M${x} 152 V${x % 40 ? 148.5 : 145}`;
  for (let y = 140; y > 6; y -= 11) d += `M392 ${y} H${(152 - y) % 44 ? 388 : 383}`;
  return '<path class="ax" vector-effect="non-scaling-stroke" d="M4 152 H392 M392 4 V152"/>'
    + `<path class="tk" vector-effect="non-scaling-stroke" d="${d}"/>`;
})();
const WAVE_FLAT = '8,110 388,110';
const SCOPE_HTML = '<div class="scope"><svg viewBox="0 0 400 160" preserveAspectRatio="none" aria-hidden="true" focusable="false">'
  + `${SCOPE_AXES}<polyline id="wv" vector-effect="non-scaling-stroke" points="${WAVE_FLAT}"/></svg></div>`;

/**
 * A terminal's output as the lines a person saw, cleaned exactly as
 * src/monitor.js `cleanTermLines` does (the page has no build step to share
 * it): colour codes out, the last `\r` segment of each line, plo's own
 * `# <iso> $ <command>` header dropped. The suite's live lines arrive clean;
 * its finished summary is the raw tail of the output.
 */
function cleanTermLines(text) {
  const lines = String(text == null ? '' : text)
    .replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, '')
    .split('\n')
    .map((l) => l.replace(/\r+$/, '').split('\r').pop())
    .filter((l) => !/^# \d{4}-\d\d-\d\dT\S+ \$ /.test(l));
  if (lines.length && lines[lines.length - 1] === '') lines.pop();
  return lines;
}

const offAir = (text) => `<span class="tg dim">${E(text)}</span>`;

/*
 * A station: `lines` for radio-out, `onAir`, `tag` (the header's word when it
 * is off air) and `mark`, whose change while on air is "a new line" (B §6.6):
 * it bursts the wave.
 */

function suiteStation(s) {
  const base = { id: 'suite', label: 'FULL SUITE', onAir: false, tag: '', mark: null };
  const live = s.suiteLive;
  // A live run first, always: a re-run is never shadowed by an older result.
  // Its "new line" is the page's running count, not the window's length,
  // which stops growing once the window is full.
  if (live) return { ...base, onAir: true, lines: live.lines || [], mark: `${live.startedAt}|${suiteSeen.count}` };
  const result = (s.integration || {}).suite || null;
  if (result) {
    const lines = cleanTermLines(result.summary);
    const verdict = result.skipped ? 'not run — no test command' : result.ok ? 'pass' : 'fail';
    return {
      ...base,
      lines: lines.length ? [...lines, '', verdict] : [verdict],
      tag: result.skipped ? offAir('NOT RUN') : stateTag(result.ok ? 'done' : 'failed'),
    };
  }
  const stage = stageOf('suite');
  if (stage && (stage.status === 'interrupted' || stage.status === 'failed')) {
    return { ...base, lines: [stage.status], tag: stateTag(stage.status) };
  }
  return { ...base, lines: ['no signal — starts after the merge'], tag: offAir('OFF AIR') };
}

/** One line per event of the reviewer and of its subagents, oldest first. */
function reviewStation(s) {
  const base = { id: 'review', label: 'CROSS-LANE REVIEW', onAir: false, tag: '', mark: null };
  const r = s.reviewer;
  if (!r) return { ...base, lines: ['no signal — starts after the full suite'], tag: offAir('OFF AIR') };
  const events = [
    ...(r.activity || []).map((a) => ({ a, who: 'reviewer' })),
    ...(r.children || []).flatMap((k) => (k.activity || []).map((a) => ({ a, who: k.title || k.agentType || 'subagent' }))),
  ];
  const at = (e) => { const ms = Date.parse(e.a.at); return Number.isFinite(ms) ? ms : 0; };
  events.sort((x, y) => at(x) - at(y));
  const lines = events.map(({ a, who }) => {
    const h = humanize(a);
    return [hms(a.at), who, [h.verb, h.obj].filter(Boolean).join(' ')].filter(Boolean).join('  ');
  });
  const newest = events[events.length - 1];
  const onAir = r.status === 'running';
  return {
    ...base,
    onAir,
    lines: lines.length ? lines : ['no events yet'],
    tag: onAir ? '' : stateTag(r.status),
    mark: newest ? `${newest.a.at}|${newest.a.text || newest.a.target || ''}` : null,
  };
}

/** The last test the task's agents ran: always on air while listed. */
function taskStation(t) {
  const lt = t.lastTest;
  const done = lt.ok === true || lt.ok === false;
  // The tail is the runner's raw output, colour codes and `\r` included.
  const tail = lt.tail ? cleanTermLines(lt.tail) : [];
  return {
    id: `T${t.n}`, label: `T${t.n} · LANE TESTS`, onAir: true, tag: '',
    lines: [`$ ${lt.command || ''}`, done ? (lt.ok ? 'pass' : 'fail') : 'running', ...(tail.length ? ['', ...tail] : [])],
    mark: `${lt.at}|${done}`,
  };
}

/** The suite, the review, then one station per running lane task or barrier
 *  with a test run, by task number. A silent task is still running. */
function stations(s) {
  const tasks = [...(s.lanes || []).flatMap((l) => l.tasks || []), ...(s.barriers || [])]
    .filter((t) => t.status === 'running' && t.lastTest)
    .sort((a, b) => a.n - b.n);
  return [suiteStation(s), reviewStation(s), ...tasks.map(taskStation)];
}

// The wave (B §6.6; the algorithm is prototipo.html's 50 ms loop).
const WAVE_MS = 50;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
const wave = { t: 0, burst: 0, spikes: [], station: null, live: false, mark: null, timer: null };

function flatWave() {
  const wv = $('wv');
  if (wv && wv.getAttribute('points') !== WAVE_FLAT) wv.setAttribute('points', WAVE_FLAT);
}

/** One frame. On air, a mix of sines with spikes born on the left that travel
 *  right and fade; off air, flat with a hiss under one unit. */
function waveFrame() {
  const wv = $('wv');
  if (!wv) return;
  const w = wave;
  const live = w.live;
  w.t += 1;
  w.burst *= 0.94;
  // Any station on air but the suite crackles now and then on its own.
  if (live && w.station !== 'suite' && Math.random() < 0.015) w.burst = Math.max(w.burst, 0.6);
  const loud = live ? 0.5 + 0.18 * Math.sin(w.t / 23) + 0.1 * Math.sin(w.t / 7) + 0.7 * w.burst : 0;
  if (live && Math.random() < 0.1 + 0.5 * w.burst) {
    w.spikes.push({ x: 8, h: (16 + Math.random() * 30) * (loud + 0.2) * (Math.random() < 0.6 ? 1 : -0.6) });
  }
  for (const k of w.spikes) { k.x += 3.2; k.h *= 0.975; }
  w.spikes = w.spikes.filter((k) => k.x < 320 && Math.abs(k.h) > 1);
  const pts = [];
  for (let x = 8; x <= 388; x += 2) {
    const env = Math.exp(-(x - 8) / 110);
    const t = w.t;
    const music = 0.5 * Math.sin(x / 6 - t * 0.55) + 0.25 * Math.sin(x / 2.7 - t * 1.1) + 0.35 * Math.sin(x / 15 - t * 0.25);
    let y = 110 - loud * (30 * env * music + 2 * (1 - env) * Math.sin(x / 20 - t * 0.2));
    for (const k of w.spikes) { const d = Math.abs(x - k.x); if (d < 4) y -= k.h * (1 - d / 4); }
    if (!live) y += (Math.random() - 0.5) * 0.8;
    pts.push(`${x},${Math.max(8, Math.min(146, y)).toFixed(1)}`);
  }
  wv.setAttribute('points', pts.join(' '));
}

/** Follow the station on screen. A new station, a fresh view or a station
 *  that went off air starts over flat, so nothing lingers from before; a new
 *  line on air is a burst. */
function tuneWave(cur, fresh) {
  const w = wave;
  const restart = fresh || w.station !== cur.id || (w.live && !cur.onAir);
  const fired = !restart && cur.onAir && cur.mark !== w.mark;
  Object.assign(w, { station: cur.id, live: cur.onAir, mark: cur.mark });
  if (restart) {
    Object.assign(w, { t: 0, burst: 0, spikes: [] });
    flatWave();
    // With less motion no loop lifts it again: an on-air station would lie
    // flat, the off-air look, until its next line. One still frame instead.
    // (The gate cannot force reduced motion — smoke/PROJECT.md.)
    if (cur.onAir && reduceMotion.matches && !S.frozen) waveFrame();
    return;
  }
  if (!fired) return;
  w.burst = 1;
  // With less motion there is no loop: one frame per new line.
  if (reduceMotion.matches && !S.frozen) waveFrame();
}

/** The loop runs only while it can be seen and means something: RADIO open,
 *  the document visible, the stream up, motion allowed. With the stream down
 *  the wave lies flat. Called after every render, on `visibilitychange` and
 *  when the stream drops. */
function syncWave() {
  const run = S.tab === 'RADIO' && Boolean($('wv')) && document.visibilityState === 'visible'
    && !S.frozen && !reduceMotion.matches;
  if (run && !wave.timer) wave.timer = setInterval(waveFrame, WAVE_MS);
  else if (!run && wave.timer) { clearInterval(wave.timer); wave.timer = null; }
  if (S.frozen) flatWave();
}

document.addEventListener('visibilitychange', syncWave);

/** radio-out keeps its node per station, so a snapshot never resets the
 *  reader's scroll; it follows the newest line unless the reader scrolled up. */
function paintOut(pre, html) {
  if (pre.painted === html) return;
  const follow = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 8;
  pre.painted = html;
  pre.innerHTML = html;
  if (follow) pre.scrollTop = pre.scrollHeight;
}

function stationRow(x, selId) {
  const on = x.id === selId;
  return `<button type="button" class="li${x.onAir ? ' run' : ''}${on ? ' sel' : ''}" aria-pressed="${on}"`
    + ` data-testid="station-${E(x.id)}" data-go="${E(`station=${x.id}`)}"><span>${E(x.label)}</span>`
    + `${x.onAir ? '<span class="tg">ON AIR</span>' : ''}</button>`;
}

const RADIO_COLS = '<div class="cols radio"><div class="col"></div><div class="col"></div></div>';
const RADIO_NOTE = '<div class="note" style="margin-top:14px">ON AIR = output arriving right now. The full suite is the one plo runs'
  + ' at the end of the run; a lane\'s is the last test its agents ran inside the task.</div>';

/** RADIO › STATIONS: the stations, and the selected one's wave and output. */
function viewRadio(view) {
  const fresh = !view.querySelector(':scope > [data-key="cols"]');
  keyed(view, [{ key: 'title', sig: 'STATIONS', html: viewTitle('STATIONS') }, { key: 'cols', sig: 'cols', html: RADIO_COLS }]);
  const [left, right] = view.querySelector(':scope > [data-key="cols"]').children;
  const list = stations(S.snap);
  // A station that is not on the list (its task stopped) shows the suite;
  // the address keeps what the reader asked for.
  const cur = list.find((x) => x.id === S.sel.station) || list[0];

  // Signed without the selection, which is toggled below: the station just
  // clicked keeps its node, and the focus with it.
  keyed(left, [
    ...list.map((x) => ({ key: `st:${x.id}`, sig: stationRow(x, null), html: stationRow(x, cur.id) })),
    { key: 'note', sig: 'note', html: RADIO_NOTE },
  ]);
  for (const el of left.querySelectorAll(':scope > button.li')) {
    const on = el.getAttribute('data-key') === `st:${cur.id}`;
    el.classList.toggle('sel', on);
    el.setAttribute('aria-pressed', String(on));
  }

  const head = `<div class="rhead"><span>${E(cur.label)}</span>${cur.onAir ? '<span class="onair">ON AIR</span>' : cur.tag}</div>`;
  keyed(right, [
    { key: 'head', sig: head, html: head },
    // Constant per station: a snapshot never redraws the wave under the loop.
    { key: 'scope', sig: `scope:${cur.id}`, html: SCOPE_HTML },
    { key: 'out', sig: `out:${cur.id}`, html: '<pre class="out" data-testid="radio-out"></pre>' },
  ]);
  paintOut(right.querySelector(':scope > [data-key="out"]'),
    E(cur.lines.join('\n')) + (cur.onAir ? '<span class="blink">_</span>' : ''));
  tuneWave(cur, fresh);
}

VIEWS.RADIO.STATIONS = viewRadio;

// ------------------------------------------------------------------ frame

let lastSnapAt = 0;
let lastDerived = '';

function renderTabs() {
  for (const b of document.querySelectorAll('#tabs [data-tab]')) {
    const on = b.dataset.tab === S.tab;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  }
  const subs = $('subs');
  if (subs.dataset.tab !== S.tab) {
    subs.dataset.tab = S.tab;
    subs.innerHTML = SUBS[S.tab].map((sub) => `<button type="button" role="tab" data-sub="${sub}" data-testid="sub-${sub}" data-go="${E(`sub=${sub}`)}">${sub}</button>`).join('');
  }
  for (const b of subs.children) {
    const on = b.dataset.sub === S.sub[S.tab];
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  }
}

function renderSignal() {
  const el = $('sig');
  const text = S.stream === 'live' ? '● LIVE'
    : S.stream === 'quiet' ? `QUIET ${dur(Date.now() - lastSnapAt)}`
      : 'RECONNECTING…';
  if (el.textContent !== text) el.textContent = text;
  el.classList.toggle('al', S.stream === 'reconnecting');
  document.body.classList.toggle('frozen', S.frozen);
}

function renderHead(items) {
  const s = S.snap;
  $('plan').textContent = (s && s.title) || '';
  paint($('chip'), items.length
    ? `<button type="button" class="chip tg bad" data-testid="alerts-chip" data-go="${E('tab=STAT&sub=CONDITION')}">! ${items.length} ALERTS</button>`
    : '');
  renderSignal();
}

/** The one stage of the end of the run that is going right now. */
function endOfRun(s) {
  const running = (key) => (s.stages || []).find((x) => x.key === key && x.status === 'running');
  const merge = running('merge');
  if (merge) return { label: 'MERGE', since: merge.startedAt };
  const barrier = (s.barriers || []).find((b) => b.status === 'running');
  if (barrier) return { label: `BARRIER T${barrier.n}`, since: barrier.startedAt };
  const suite = running('suite');
  if (suite) return { label: 'FULL SUITE', since: suite.startedAt };
  const review = running('review');
  if (review) return { label: 'CROSS-LANE REVIEW', since: review.startedAt };
  return { label: 'INTEGRATION', since: null };
}

/**
 * The run bar, by phase (B §6.1). The fill counts tasks plus the three
 * integration stages: `run` and `barriers` are aggregates of the tasks
 * themselves and would count them twice.
 */
function runLine(s) {
  const t = s.totals;
  const lanesRunning = (s.lanes || []).filter((l) => (l.tasks || []).some((x) => x.status === 'running')).length;
  const stagesDone = (s.stages || []).filter((x) => ['merge', 'suite', 'review'].includes(x.key) && x.status === 'done').length;
  const pct = Math.min(100, Math.round((100 * (t.done + stagesDone)) / (t.total + 3)));
  let html;
  if (lanesRunning) html = `RUN · ${lanesRunning} LANES`;
  else if (s.integrationRunning) {
    const at = endOfRun(s);
    html = `END OF RUN · ${E(at.label)} <span data-since="${E(at.since || '')}"></span> — not over yet`;
  } else if (s.runOver) html = 'RUN OVER';
  else {
    const next = (s.stages || []).find((x) => x.status !== 'done');
    html = next ? `WAITING · ${E(String(next.label).toUpperCase())}` : 'WAITING';
  }
  return { html, pct };
}

/** Counts while the run is active; otherwise the span to the last known end
 *  of any task or stage, standing still. */
function runClock() {
  const s = S.snap;
  if (!s || !s.ready) return '';
  const first = s.totals.firstStartedAt;
  if (!first) return '–';
  if (s.totals.active) return since(first);
  const ends = [
    ...(s.lanes || []).flatMap((l) => l.tasks || []), ...(s.barriers || []), ...(s.stages || []),
  ].map((x) => Date.parse(x.endedAt)).filter(Number.isFinite);
  return ends.length ? dur(Math.max(...ends) - Date.parse(first)) : since(first);
}

function renderFoot(items) {
  const s = S.snap;
  const foot = $('foot');
  if (!s || !s.ready) { keyed(foot, []); return; }
  const t = s.totals;
  const run = runLine(s);
  const segs = [`<span class="seg" data-testid="foot-tasks">TASKS ${t.done}/${t.total}</span>`];
  if (items.length) segs.push(`<span class="seg al" data-testid="foot-needyou">${items.length} NEED YOU</span>`);
  segs.push(`<span class="seg grow" data-testid="foot-run"><em>${run.html}</em><span class="bar"><i style="width:${run.pct}%"></i></span></span>`);
  const u = s.usage5h;
  if (u && typeof u.utilization === 'number') {
    const pct = Math.round(u.utilization * 100);
    const at = hhmm(u.resetsAt);
    segs.push(`<span class="seg lim${u.utilization >= LIMIT_AL ? ' al' : ''}" data-testid="foot-limit"${at ? ` title="resets at ${E(at)}"` : ''}>`
      + `5H LIMIT<span class="bar"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></span>${pct}%</span>`);
  }
  segs.push(`<span class="seg" data-testid="foot-cost">${E(money(t.costUsd))}</span>`);
  // Text-free, so its signature never changes: tick() writes the time.
  segs.push('<span class="seg" data-testid="foot-clock" id="clock"></span>');
  keyed(foot, segs.map((html) => ({ key: /data-testid="([^"]+)"/.exec(html)[1], sig: html, html })));
}

/** The clock and every `[data-since]`: text only, never markup. */
function paintTimes() {
  const c = $('clock');
  if (c) { const v = runClock(); if (c.textContent !== v) c.textContent = v; }
  for (const el of document.querySelectorAll('[data-since]')) {
    const v = since(el.getAttribute('data-since'));
    if (el.textContent !== v) el.textContent = v;
  }
}

const derivedSig = (items) => `${items.map((x) => x.key).join(',')}|${agents().map((a) => `${a.id}:${a.status}:${a.silentMin ?? ''}`).join(',')}`;

function render() {
  const s = S.snap;
  const items = needYou();
  lastDerived = derivedSig(items);
  renderTabs();
  renderHead(items);
  renderFoot(items);
  if (!s) { syncWave(); return; }
  const view = $('view');
  if (!s.ready) {
    document.title = s.title ? `plo · ${s.title}` : 'plo';
    renderEmpty(view, s);
  } else {
    document.title = `${items.length ? '⚠ ' : ''}${s.totals.done}/${s.totals.total} · ${s.title}`;
    const want = `${S.tab}/${S.sub[S.tab]}`;
    if (view.dataset.view !== want) { view.innerHTML = ''; view.dataset.view = want; }
    VIEWS[S.tab][S.sub[S.tab]](view);
  }
  syncWave();
  if (!S.frozen) paintTimes();
}

/** Every second: clocks, the quiet signal, and a redraw only when something
 *  derived changed on its own: a status, or a silent agent's minute count, so
 *  "no event for N min" keeps counting with no new snapshot. Nothing moves
 *  while the stream is down. */
function tick() {
  if (S.frozen) return;
  if (S.stream === 'live' && lastSnapAt && Date.now() - lastSnapAt >= QUIET_MS) S.stream = 'quiet';
  renderSignal();
  paintTimes();
  if (S.snap && derivedSig(needYou()) !== lastDerived) render();
}

// ------------------------------------------------------------------ address

/** The old link form, `#task=4`, still opens task 4 (B §6.8). */
const hashTask = () => {
  const m = /^#task=(\d+)$/.exec(location.hash || '');
  return m ? Number(m[1]) : null;
};

const selValue = (k, v) => (v == null || v === '' ? null
  : (k === 'task' || k === 'quest') && /^\d+$/.test(String(v)) ? Number(v) : String(v));

function readHash() {
  const n = hashTask();
  if (n != null) { S.tab = 'INV'; S.sub.INV = 'ALL'; S.sel.task = n; return; }
  const p = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const tab = p.get('tab');
  const sub = p.get('sub');
  if (tab && SUBS[tab]) S.tab = tab;
  else if (sub && TAB_OF[sub]) S.tab = TAB_OF[sub];
  if (sub && SUBS[S.tab].includes(sub)) S.sub[S.tab] = sub;
  for (const k of SEL_KEYS) S.sel[k] = selValue(k, p.get(k));
}

function hashFor() {
  const parts = [`tab=${S.tab}`, `sub=${S.sub[S.tab]}`];
  for (const k of SEL_KEYS) if (S.sel[k] != null) parts.push(`${k}=${encodeURIComponent(S.sel[k])}`);
  return `#${parts.join('&')}`;
}

/** `replaceState` never fires `hashchange`, so the page never hears itself. */
function writeHash() {
  const want = hashFor();
  if (location.hash !== want) history.replaceState(null, '', want);
}

/** Move the page: any of tab, sub, agent, task, quest, station. `null` clears
 *  a selection; a key left out stays as it was. */
function go(next = {}) {
  const tab = next.tab && SUBS[next.tab] ? next.tab : next.sub && TAB_OF[next.sub] ? TAB_OF[next.sub] : null;
  if (tab) S.tab = tab;
  if (next.sub && SUBS[S.tab].includes(next.sub)) S.sub[S.tab] = next.sub;
  for (const k of SEL_KEYS) if (k in next) S.sel[k] = selValue(k, next[k]);
  writeHash();
  render();
}

window.addEventListener('hashchange', () => { readHash(); writeHash(); render(); });

document.addEventListener('click', (e) => {
  const cp = e.target.closest('[data-copy]');
  if (cp) { handleCopy(cp); return; }
  const el = e.target.closest('[data-go]');
  if (el) go(Object.fromEntries(new URLSearchParams(el.getAttribute('data-go'))));
});

// DATA › LOG's search, filter and wrap: page state, never in the hash.
document.addEventListener('input', (e) => {
  if (!(e.target instanceof Element) || !e.target.matches('[data-testid=log-search]')) return;
  feedQuery = e.target.value.trim().toLowerCase();
  render();
});

document.addEventListener('click', (e) => {
  const kind = e.target.closest('[data-feed]');
  if (kind) { feedKind = kind.getAttribute('data-feed'); render(); return; }
  if (e.target.closest('[data-wrap]')) { feedWrap = !feedWrap; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.sel.task != null) go({ task: null });
});

// --------------------------------------------------------------- transport

let reopenTimer = null;

function connect() {
  reopenTimer = null;
  const es = new EventSource('/api/stream');
  es.addEventListener('snapshot', (e) => {
    let payload;
    try { payload = JSON.parse(e.data); } catch { return; }
    S.skew = typeof payload.now === 'number' ? payload.now - Date.now() : 0;
    S.snap = payload.snapshot || null;
    countSuiteLines(S.snap);
    lastSnapAt = Date.now();
    S.stream = 'live';
    S.frozen = false;
    render();
  });
  // A dropped stream retries on its own; a closed one has to be reopened.
  es.addEventListener('error', () => {
    S.stream = 'reconnecting';
    S.frozen = true;
    renderSignal();
    syncWave();
    if (es.readyState === EventSource.CLOSED && !reopenTimer) reopenTimer = setTimeout(connect, REOPEN_MS);
  });
}

/** The operators' sprite goes in first, hidden, so the first frame has them. */
async function boot() {
  try {
    const res = await fetch('/assets/operador.svg');
    if (res.ok) {
      const holder = document.createElement('div');
      holder.className = 'sprite';
      holder.setAttribute('aria-hidden', 'true');
      holder.innerHTML = await res.text();
      document.body.prepend(holder);
    }
  } catch { /* the panel still reads without its operators */ }
  readHash();
  writeHash();
  render();
  connect();
  setInterval(tick, 1000);
}

boot();
</script>
