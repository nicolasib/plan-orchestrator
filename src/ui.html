  if (!isFinite(ms) || ms < 1000) return '';
  return ms < 60000 ? `${Math.round(ms / 1000)}s` : dur(ms);
}

/** Where an event came from, two characters wide. A barrier has no lane, so
 *  it reads `T3` — the shape itself says "this one is not a lane". */
const whoLabel = (a) => (a.lane ? `${String(a.lane).toUpperCase()}${a.n}` : `T${a.n}`);
const whoTitle = (a) => (a.lane ? `Lane ${String(a.lane).toUpperCase()} · Task ${a.n}` : `Barrier · Task ${a.n}`);

function activityHtml(a, who = false) {
  const at = `<span class="at">${esc(clock(a.at))}</span>`;
  // Deliberately not a button: sixty of them would be sixty tab stops through
  // near-identical labels, and the same task is one keystroke away on the
  // board, the alerts and the lane table.
  const tag = who ? `<span class="who${a.barrier ? ' barrier' : ''}" title="${esc(whoTitle(a))}">${esc(whoLabel(a))}</span>` : '';
  const bad = a.ok === false ? ' bad' : '';
  const open = `<div class="ln${bad}">${at}${tag}`;

  if (a.kind === 'text') return `${open}<span class="ico"></span><span class="say" title="${esc(a.text)}">${esc(a.text)}</span></div>`;
  if (a.kind === 'run') return `${open}<span class="ico">${resultIcon(null)}</span><span class="name sub">${esc(a.label || 'run')}</span></div>`;
  if (a.kind === 'result') {
    const ran = a.durationMs > 1000 ? dur(a.durationMs) : '';
    return `${open}<span class="ico">${resultIcon(a.ok)}</span><span class="name">${esc(a.label || 'result')}</span><span class="arg" title="${esc(a.text || '')}">${esc(a.text || '')}</span><span class="took">${esc(ran)}</span></div>`;
  }
  // A failed call's preview is the whole reason the line is red; it rides in
  // the target column after the target, and the tooltip carries both in full.
  const why = a.ok === false && a.preview ? `<span class="why"> ${esc(a.preview)}</span>` : '';
  return `${open}<span class="ico">${resultIcon(a.ok)}</span>`
    + `<span class="name${a.sub ? ' sub' : ''}">${a.sub ? '↳ ' : ''}${esc(a.name)}</span>`
    + `<span class="arg" title="${esc([a.target, a.ok === false ? a.preview : ''].filter(Boolean).join(' — '))}">${esc(a.target || '')}${why}</span>`
    + `<span class="took">${esc(took(a))}</span></div>`;
}

function feedPlaceholder(t) {
  if (t.status === 'pending') return 'waiting for its turn';
  if (t.status === 'running') return 'started — no agent events yet';
  return t.error ? gist(t.error, 90) : STATUS_WORD[t.status] || t.status;
}

/**
 * One card, whether it holds a lane or the barrier that runs after them all.
 * A barrier gets the same treatment because during integration it is the only
 * thing running, and a thin row under three "lane complete" cards is not a
 * report on it.
 */
function cardHtml({ kind, label, sub, subTitle, copy, tasks, current }) {
  const live = current && current.status === 'running';
  const feed = live && current.activity.length
    ? current.activity.slice().reverse().map((a) => activityHtml(a)).join('')
    : `<div class="empty">${current ? esc(feedPlaceholder(current)) : 'every task settled'}</div>`;

  return `
    <div class="head">
      <span class="kind ${kind}">${kind === 'barrier' ? mergeIcon() : ''}${esc(label)}</span>
      <div class="grow"></div>
      ${!sub ? '' : copy
        ? copyBtnHtml(copy, 'the lane branch', { label: sub, cls: 'branch', title: `${subTitle || sub} — click to copy the branch` })
        : `<span class="branch" title="${esc(subTitle || sub)}">${esc(sub)}</span>`}
    </div>
    ${chipsHtml(tasks)}
    <div class="now">
      ${current
        ? `<div class="title">${statusIcon(current.status)}<span class="tno">T${current.n}</span><span class="label">${esc(current.title)}</span></div>
           <div class="meta">
             <span class="clock"${live ? ` data-since="${esc(current.startedAt || '')}"` : ''}>${live ? '–' : esc(span(current))}</span>
             <span>${plural(current.turns || 0, 'turn')}</span>
             ${current.attempts > 1 ? `<span>attempt ${current.attempts}</span>` : ''}
             ${current.lastTool ? `<span class="tool">${esc(current.lastTool.name)}</span>` : ''}
           </div>`
        : '<div class="title"><span class="label">Every task settled</span></div>'}
    </div>
    <div class="feed">${feed}</div>
    <div class="foot">
      <span>${plural(sumTurns(tasks), 'turn')}</span>
      <span>${plural(sumCommits(tasks), 'commit')}</span>
      <span>${sumTokens(tasks) ? `${tokens(sumTokens(tasks))} tokens` : '—'}</span>
    </div>`;
}

/**
 * Cards go to whatever is still working; everything finished collapses into a
 * one-line strip. Before this, integration showed three "lane complete" cards
 * and hid the running barrier in a thin row underneath.
 */
function renderBoard(s) {
  const cards = s.lanes.filter((l) => !l.settled).map((lane) => ({
    key: `lane:${lane.id}`,
    sig: JSON.stringify(lane),
    html: cardHtml({
      kind: 'lane', label: `Lane ${lane.label}`, sub: lane.branch || 'no branch yet',
      subTitle: lane.worktree, copy: lane.branch || '', tasks: lane.tasks, current: currentOf(lane.tasks),
    }),
  }));

  if (s.activeBarrier != null) {
    cards.push({
      key: 'barrier',
      sig: JSON.stringify(s.barriers),
      html: cardHtml({
        kind: 'barrier', label: 'Barrier', sub: 'merged tree',
        subTitle: 'Barrier tasks run after every lane has merged',
        tasks: s.barriers, current: s.barriers.find((t) => t.n === s.activeBarrier),
      }),
    });
  }

  const host = $('board');
  for (const card of cards) {
    let el = host.querySelector(`[data-card="${CSS.escape(card.key)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'card';
      el.dataset.card = card.key;
      host.appendChild(el);
    }
    // Rebuild only what changed: an untouched card keeps its feed scrolled
    // where the reader left it.
    if (el.dataset.sig !== card.sig) {
      el.dataset.sig = card.sig;
      el.innerHTML = card.html;
    }
  }
  const wanted = cards.map((c) => c.key);
  for (const el of [...host.children]) if (!wanted.includes(el.dataset.card)) el.remove();

  const settled = s.lanes.filter((l) => l.settled);
  $('settled-section').hidden = !settled.length;
  const head = `<div class="row lane head" role="row">
      <span role="columnheader">Lane</span>
      <span role="columnheader">Tasks</span>
      <span role="columnheader">Branch</span>
      <span class="num" role="columnheader">Turns</span>
      <span class="num" role="columnheader">Commits</span>
      <span class="num" role="columnheader">Tokens</span>
    </div>`;
  paint($('settled'), !settled.length ? '' : `<div class="grid" role="rowgroup">` + head + settled.map((lane) => `<div class="row lane" role="row">
      <span class="tag" role="cell">Lane ${esc(lane.label)}</span>
      <span class="cell" role="cell">${chipsHtml(lane.tasks)}</span>
      <span class="cell" role="cell">${lane.branch
        ? copyBtnHtml(lane.branch, 'the lane branch', { label: lane.branch, cls: 'cp-row', title: `${lane.worktree || lane.branch} — click to copy the branch` })
        : ''}</span>
      <span class="num" role="cell"><b>${sumTurns(lane.tasks)}</b></span>
      <span class="num" role="cell"><b>${sumCommits(lane.tasks)}</b></span>
      <span class="num" role="cell"><b>${tokens(sumTokens(lane.tasks))}</b></span>
    </div>`).join('') + totalsRow(settled, s.lanes.length) + '</div>');
}

/**
 * The row that closes the columns above it. It sums the lanes in the table,
 * never the whole run: a total that does not add up to the rows under it is
 * worse than no total.
 */
function totalsRow(lanes, allLanes) {
  const tasks = lanes.flatMap((l) => l.tasks);
  const note = lanes.length < allLanes ? `${lanes.length} of ${allLanes} lanes settled` : '';
  return `<div class="row lane foot" role="row">
      <span class="tag" role="cell">Total</span>
      <span class="cell" role="cell">${plural(tasks.length, 'task')}</span>
      <span class="mono" role="cell">${esc(note)}</span>
      <span class="num" role="cell"><b>${sumTurns(tasks)}</b></span>
      <span class="num" role="cell"><b>${sumCommits(tasks)}</b></span>
      <span class="num" role="cell"><b>${tokens(sumTokens(tasks))}</b></span>
    </div>`;
}

function rowHtml(t) {
  const bits = [];
  if (t.commits && t.commits.length) bits.push(`${plural(t.commits.length, 'commit')} ${t.commits.map(short).join(' ')}`);
  if (t.turns) bits.push(plural(t.turns, 'turn'));
  if (t.attempts > 1) bits.push(`${t.attempts} attempts`);
  if (t.reconciled) bits.push('reconciled from git');
  return `<div class="row task" data-task="${t.n}" tabindex="0" role="button" aria-controls="panel">
    <span class="ic">${statusIcon(t.status)}</span>
    <span class="tag">T${t.n}</span>
    <span class="cell">
      <span class="name">${esc(t.title)}</span>
      ${t.error ? `<span class="err">${esc(gist(t.error, 70))}</span>` : ''}
    </span>
    <span class="right">${esc(bits.join('  ·  '))}</span>
  </div>`;
}

function renderBarriers(s) {
  $('barriers-section').hidden = !s.barriers.length || s.activeBarrier != null;
  paint($('barriers'), s.barriers.map(rowHtml).join(''));
}

/**
 * The run on one clock.
 *
 * Two questions justify this tool existing — did running these lanes at the
 * same time pay, and who held the run up — and both are read off positions on
 * a shared axis. `Lane plan` listed each lane's tasks in scheduled order,
 * which answers neither.
 *
 * The blocks carry offsets in seconds and the axis carries the span; the
 * division happens in CSS, so a run that is still growing costs one property
 * write per second and never rewrites a node the reader might have focused.
 */
const QUEUE_SHOWN = 3;

function renderTimeline(s) {
  const tl = s && s.ready ? s.timeline : null;
  $('timeline-section').hidden = !tl;
  if (!tl) return;

  const ends = tl.live ? '<b>now</b>' : `<b>${esc(hhmm(new Date(Date.parse(tl.origin) + tl.span * 1000).toISOString()))}</b>`;
  // Between two times of day, a bare duration reads as a third one.
  const total = tl.live
    ? `<span class="tl-total"><b data-since="${esc(tl.origin)}">–</b> total</span>`
    : `<span class="tl-total"><b>${esc(dur(tl.span * 1000))}</b> total</span>`;

  const head = `<div class="tl-row tl-top">
      <span class="tl-lane"></span>
      <span class="tl-scale"><b>${esc(hhmm(tl.origin))}</b>${total}${ends}</span>
      <span class="tl-q">${tl.rows.some((r) => r.queued.length) ? 'queued' : ''}</span>
    </div>`;

  const rows = tl.rows.map((r) => {
    const blocks = r.blocks.map(blockHtml).join('')
      || '<span class="tl-none">not started</span>';
    const shown = r.queued.slice(0, QUEUE_SHOWN).map((t) =>
      `<button class="tl-qb" data-task="${t.n}" aria-controls="panel"
        aria-label="Task ${t.n}, ${esc(STATUS_WORD[t.status] || t.status)} — ${esc(t.title)}"
        title="T${t.n} · ${esc(t.title)}">T${t.n}</button>`).join('');
    const rest = r.queued.length - QUEUE_SHOWN;
    return `<div class="tl-row">
        <span class="tl-lane ${esc(r.kind)}">${esc(r.label)}</span>
        <span class="tl-track">${blocks}</span>
        <span class="tl-q">${shown}${rest > 0 ? `<span class="tl-more">+${rest}</span>` : ''}</span>
      </div>`;
  }).join('');

  if (paint($('timeline'), head + rows)) tick();
  layoutTimeline();
}

function blockHtml(b) {
  const open = b.to == null;
  const took = open
    ? `running since ${hhmm(b.startedAt)}`
    : `${hhmm(b.startedAt)} for ${dur((b.to - b.from) * 1000)}`;
  const name = `Task ${b.n}, ${STATUS_WORD[b.status] || b.status}, ${took} — ${b.title}`;
  return `<button class="tl-b ${esc(b.status)}${open ? ' open' : ''}" data-task="${b.n}" aria-controls="panel"
    style="--s:${b.from}${open ? '' : `;--e:${b.to}`}" data-s="${b.from}"${open ? '' : ` data-e="${b.to}"`}
    aria-label="${esc(name)}" title="T${b.n} · ${esc(b.title)}\n${esc(took)}"><span class="tl-t">T${b.n}</span></button>`;
}

/**
 * The one number the server refuses to send. While a task is running the axis
 * ends at the reader's clock, not at anything on disk — and writing it here
 * rather than into the markup keeps the painted signature stable, so the
 * blocks survive as nodes the reader can focus and click.
 */
const LABEL_MIN = 24;

function layoutTimeline() {
  const tl = snap && snap.ready ? snap.timeline : null;
  if (!tl) return;
  const host = $('timeline');
  const span = Math.max(1, Math.round(tl.live ? (Date.now() + skew - Date.parse(tl.origin)) / 1000 : tl.span));
  host.style.setProperty('--span', String(span));

  // One rect read for the whole chart. Every block's width is arithmetic from
  // there, so deciding which bars are too narrow for a label costs no layout
  // per node — this runs once a second for as long as the tab is open.
  const track = host.querySelector('.tl-track');
  const px = track ? track.getBoundingClientRect().width : 0;
  for (const b of host.querySelectorAll('.tl-b')) {
    const from = Number(b.dataset.s);
    const to = b.classList.contains('open') ? span : Number(b.dataset.e);
    b.classList.toggle('bare', Math.max(3, ((to - from) / span) * px) < LABEL_MIN);
  }
}

// ------------------------------------------------------------------ timers

function tick() {
  if (!snap || !snap.ready || document.hidden) return;
  $('m-elapsed').textContent = snap.totals.firstStartedAt ? since(snap.totals.firstStartedAt) : '–';
  for (const el of document.querySelectorAll('[data-since]')) {
    el.textContent = el.dataset.since ? since(el.dataset.since) : '–';
  }
  layoutTimeline();
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

// ------------------------------------------------------------------- panel

/**
 * The panel has two personalities and only one of them is a dialog.
 *
 * Beside the board it is a region: it takes no focus, holds no scrim, and
 * must not trap Tab — a reader can see and use the page behind it, and
 * `aria-modal` there would tell a screen reader otherwise. Below 900px there
 * is no room for two columns, it covers the page, and every one of those
 * attributes becomes true again. This is the only place they are set.
 */
function applyPanel() {
  const modal = !wide.matches;
  const open = panelOn();
  const panel = $('panel');
  const onTask = openTask != null;

  panel.classList.toggle('open', open);
  $('scrim').classList.toggle('open', modal && modalOpen);

  if (modal) {
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    if (open) panel.removeAttribute('inert');
    else panel.setAttribute('inert', '');
  } else {
    for (const attr of ['role', 'aria-modal', 'aria-hidden', 'inert']) panel.removeAttribute(attr);
  }

  $('p-feed').hidden = onTask;
  $('p-tools').hidden = onTask;
  $('d-body').hidden = !onTask;
  $('p-back').hidden = !onTask;
  $('p-count').hidden = onTask;
  $('d-close').hidden = !modal;
  if (!onTask) $('d-title').textContent = 'Run activity';
}

/** Fetch and draw, without touching what is open. The stream calls this once
 *  a second: a task that finishes while its record is up should say so. */
async function loadTask(n) {
  try {
    const r = await fetch(`/api/task?n=${encodeURIComponent(n)}`);
    const body = await r.json();
    if (openTask !== n) return; // a newer click already won the panel
    if (!r.ok) { $('d-body').innerHTML = `<pre>${esc(body.error || r.statusText)}</pre>`; return; }
    drawTask(body.task);
  } catch (e) {
    if (openTask === n) $('d-body').innerHTML = `<pre>${esc(e.message)}</pre>`;
  }
}

/**
 * `#task=4` survives a reload and pastes into Slack, which is most of what a
 * URL is for. `pushState` never fires `hashchange`, so the page can write the
 * hash without hearing itself and reopening what it just opened.
 */
const hashTask = () => {
  const m = /^#task=(\d+)$/.exec(location.hash || '');
  return m ? Number(m[1]) : null;
};

function writeHash(n) {
  const want = n == null ? '' : `#task=${n}`;
  if (location.hash === want) return;
  if (n == null) history.replaceState(null, '', location.pathname + location.search);
  else history.pushState(null, '', want);
}

window.addEventListener('hashchange', () => {
  const n = hashTask();
  if (n == null) { if (openTask != null) backToFeed(); return; }
  if (n !== openTask) showTask(n);
});

function showTask(n, trigger) {
  if (trigger) openedFrom = trigger;
  const wasModal = modalOpen;
  openTask = n;
  modalOpen = true;
  writeHash(n);
  applyPanel();
  // Only a modal takes the reader's focus. In the rail the panel simply
  // changes what it shows, and yanking focus off the row they clicked would
  // cost them their place in the list.
  if (!wide.matches && !wasModal) $('d-close').focus();
  loadTask(n);
}

/** The panel's resting state, and the only way into it below 900px. */
function showFeed(trigger) {
  if (trigger) openedFrom = trigger;
  openTask = null;
  modalOpen = true;
  writeHash(null);
  applyPanel();
  renderFeed(snap);
  if (!wide.matches) $('d-close').focus();
}

function drawTask(t) {
  $('d-title').innerHTML = `${statusIcon(t.status)}<span class="label">T${t.n} · ${esc(t.title)}</span>`;

  const statusPill = t.status === 'done' ? 'ok' : t.status === 'running' ? 'live' : t.status === 'pending' ? '' : 'bad';
  const kv = [
    ['Status', `<span class="pill ${statusPill}">${esc(STATUS_WORD[t.status] || t.status)}${t.barrier ? ' · barrier' : ''}</span>`],
    ['Lane', t.lane ? esc(String(t.lane).toUpperCase()) : '—'],
    // A running task's duration is a clock, and a clock in the payload would
    // repaint this panel every second — with the reader's focus inside it.
    ['Duration', t.status === 'running' && t.startedAt ? `<span data-since="${esc(t.startedAt)}">–</span>` : esc(span(t))],
    ['Turns', String(t.turns || 0)],
    ['Attempts', String(t.attempts || 0)],
    ['Output tokens', typeof t.outputTokens === 'number' ? t.outputTokens.toLocaleString() : '—'],
    ['Model', `<span class="mono">${esc(t.model || '—')}</span>`],
    ['Session', t.sessionId
      ? `<span class="v-cp"><span class="mono">${esc(t.sessionId)}</span>${copyBtnHtml(t.sessionId, 'the session id')}</span>`
      : '<span class="mono">—</span>'],
    ['Commits', (t.commits || []).length ? `<span class="mono">${t.commits.map((c) => esc(short(c))).join(' ')}</span>` : '—'],
    ['Log', t.logFile
      ? `<span class="v-cp"><span class="mono">${esc(t.logFile)}</span>${copyBtnHtml(t.logFile, 'the log path')}</span>`
      : '<span class="mono">—</span>'],
  ];

  // No `.pad` wrapper. The rows were inset 12px from a panel that already has
  // a gutter, so every rule between them stopped short of the edge it divided
  // — a table drawn inside a margin instead of a table drawn in the panel.
  // The padding moved onto the row, where it separates the text and not the
  // ground under it.
  const parts = [`<div class="list kv">${kv.map(([k, v]) => `<div class="kv-row"><span class="k">${KV_ICON[k] || ''}${esc(k)}</span><span class="v">${v}</span></div>`).join('')}</div>`];

  if (t.error) parts.push(`<h3>${t.status === 'blocked' ? 'Why it stopped' : 'Error'}</h3><div class="md">${md(t.error)}</div>`);
  // A blocked task's error IS its final message; printing both twice reads as
  // two findings when there is one.
  // The stored error keeps the report's line breaks; the digest collapses
  // them. Compare on flattened text or the duplicate slips through.
  const flat = (x) => String(x || '').replace(/\s+/g, ' ').trim();
  // `body` keeps the report's line breaks; `text` is the feed's one-liner and
  // only stands in for an old checkpoint that has no body.
  const resultText = t.result && (t.result.body || t.result.text);
  const duplicated = resultText && t.error
    && (flat(t.error).includes(flat(resultText).slice(0, 60)) || flat(resultText).includes(flat(t.error).slice(0, 60)));
  // Both of these are the agent's own prose — a blocked task's error IS its
  // final message — so both are Markdown. The two below stay `<pre>`: a list
  // of paths is a list of paths, and a renderer would eat the underscores.
  if (resultText && !duplicated) parts.push(`<h3>Agent result${t.result.clipped ? ' · clipped' : ''}</h3><div class="md">${md(resultText)}</div>`);
  if (t.files && t.files.writes.length) parts.push(`<h3>Declared writes</h3><pre>${t.files.writes.map(esc).join('\n')}</pre>`);
  if (t.files && t.files.excluded.length) parts.push(`<h3>Excluded by negation</h3><pre>${t.files.excluded.map(esc).join('\n')}</pre>`);
  if (t.steps && t.steps.length) {
    parts.push(`<h3>Plan steps</h3><ul class="steps tick">${t.steps.map((st) => `<li class="${st.checked ? 'on' : ''}">${checkbox(st.checked)}<span>${mdInline(esc(st.text))}</span></li>`).join('')}</ul>`);
  }
  parts.push(`<h3>Activity${t.truncated ? ' · tail' : ''}</h3><div class="pad"><div class="feed" style="margin:0;max-height:none">${
    t.activity.length ? t.activity.slice().reverse().map((a) => activityHtml(a)).join('') : '<div class="empty">no agent events recorded</div>'
  }</div></div>`);

  // Painted, not assigned: the stream redraws this every second while a task
  // is open, and an unguarded write destroys whatever the reader had focused
  // — which now includes two copy buttons.
  if (paint($('d-body'), parts.join(''))) tick();
}

/** Back to the run feed, keeping the panel where it is. */
function backToFeed() {
  openTask = null;
  writeHash(null);
  applyPanel();
  renderFeed(snap);
  $('p-feed').scrollTop = 0;
}

/** Esc and the close button: dismiss the modal below 900px, fall back to the
 *  feed above it, where there is no such thing as a closed panel. */
function closePanel() {
  if (openTask == null && !modalOpen) return;
  openTask = null;
  modalOpen = false;
  writeHash(null);
  // Focus must not stay inside a container that is about to be aria-hidden.
  if (openedFrom && document.contains(openedFrom)) openedFrom.focus();
  openedFrom = null;
  applyPanel();
  renderFeed(snap);
}

wide.addEventListener('change', applyPanel);

/** Keep Tab inside the panel while it is modal — a modal that leaks focus
 *  behind its own scrim is worse than one that never claimed to be modal.
 *  Above 900px there is nothing to trap: the page behind it is in use. */
function trapTab(e) {
  if (wide.matches || !modalOpen || e.key !== 'Tab') return;
  const focusable = [...$('panel').querySelectorAll('button, [href], [tabindex]:not([tabindex="-1"])')].filter((el) => !el.hidden && el.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

/** The feed's toolbar. It lives outside the painted region on purpose: a
 *  filter that loses what you typed once a second is not a filter. */
$('p-q').addEventListener('input', (e) => { feedQuery = e.target.value.trim().toLowerCase(); renderFeed(snap); });
$('p-kind').addEventListener('change', (e) => { feedKind = e.target.value; renderFeed(snap); });
$('p-wrap').addEventListener('click', () => {
  const on = $('p-wrap').getAttribute('aria-pressed') !== 'true';
  $('p-wrap').setAttribute('aria-pressed', String(on));
  $('p-feed').classList.toggle('wrap', on);
});

document.addEventListener('click', (e) => {
  const cp = e.target.closest('[data-copy]');
  if (cp) { handleCopy(cp); return; }
  if (e.target.closest('#p-back')) { backToFeed(); return; }
  if (e.target.closest('#open-feed')) { showFeed(e.target.closest('#open-feed')); return; }
  const hit = e.target.closest('[data-task]');
  if (hit) { showTask(Number(hit.dataset.task), hit); return; }
  if (e.target.id === 'scrim' || e.target.closest('#d-close')) closePanel();
});
document.addEventListener('keydown', (e) => {
  trapTab(e);
  if (e.key === 'Escape') closePanel();
  const hit = e.target.closest && e.target.closest('[data-task][tabindex]');
  if (hit && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showTask(Number(hit.dataset.task), hit); }
});

applyPanel();
// A link into a task opens on it, at whichever width the reader arrived with.
if (hashTask() != null) showTask(hashTask());

// --------------------------------------------------------------- transport

function setLive(on, text) {
  $('live').className = `live ${on ? 'on' : 'off'}`;
  $('live-text').textContent = text;
}

let lastEventAt = 0;
const source = new EventSource('/api/stream');
source.addEventListener('snapshot', (e) => {
  const payload = JSON.parse(e.data);
  skew = payload.now - Date.now();
  lastEventAt = Date.now();
  render(payload.snapshot);
  // The panel is a live view too — a task finishing while its record is up
  // should show that, not a frozen snapshot from when it was clicked.
  if (openTask != null && panelOn()) loadTask(openTask);
});
source.onopen = () => setLive(true, 'live');
source.onerror = () => setLive(false, 'reconnecting…');
setInterval(() => {
  if (source.readyState !== 1) return;
  const age = Math.round((Date.now() - lastEventAt) / 1000);
  setLive(true, age < 30 ? 'live' : `live · quiet ${dur(age * 1000)}`);
}, 1000);
</script>
</body>
</html>
