<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Painel do operador — protótipo</title></head>
<body style="background:#1b1b1b;color:#ddd;font-family:system-ui,sans-serif;margin:20px">
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,700;1,700&display=swap');
.scen { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0 14px; font-size:14px; }
.scen b { font-weight:600; margin-right:4px; }
.scen button { font:inherit; padding:4px 10px; border-radius:6px; border:1px solid rgba(128,128,128,.5); background:transparent; color:inherit; cursor:pointer; }
.scen button.on { background:#39ff7e; color:#06140b; border-color:#39ff7e; }
.scen .gap { width:18px; }

/* ---------- o aparelho */
.dev { --g:#39ff7e; --gd:rgba(57,255,126,.5); --gf:rgba(57,255,126,.12); --ink:#06140b; --al:#ffb13d;
  --fig:#43ff86; --ln:#052812; position:relative; margin:0 auto; }

/* ---------- a tela */
.screen { position:relative; height:620px; border-radius:14px; padding:12px 26px 12px; overflow:hidden; display:flex; flex-direction:column;
  background: radial-gradient(ellipse at 50% 42%, #133420 0%, #0b2214 50%, #050f08 100%);
  box-shadow: 0 0 0 1px rgba(57,255,126,.22), 0 14px 40px rgba(0,0,0,.45), inset 0 0 90px rgba(0,0,0,.82), inset 0 0 24px rgba(57,255,126,.07);
  color:var(--g); font-family:'Roboto Condensed', sans-serif; font-weight:500; font-size:18px; line-height:1.22; text-shadow: 0 0 6px rgba(57,255,126,.42); }
.screen::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:60;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px); }
.screen::before { content:""; position:absolute; left:0; right:0; height:140px; top:-140px; z-index:59; pointer-events:none;
  background: linear-gradient(to bottom, transparent, rgba(57,255,126,.045), transparent); animation: roll 8s linear infinite; }
@keyframes roll { to { top:110%; } }
@keyframes blink { 0%, 49% { opacity:1; } 50%, 100% { opacity:.2; } }
@keyframes blinkbg { 0%, 49% { background:var(--al); color:var(--ink); } 50%, 100% { background:transparent; color:var(--al); } }
.screen button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; text-shadow:inherit; padding:0; }
.screen ::-webkit-scrollbar { width:5px; } .screen ::-webkit-scrollbar-thumb { background:var(--gd); }
.blink { animation: blink 1s step-end infinite; } .dim { opacity:.5; }

.tabs { display:flex; gap:40px; align-items:flex-end; height:40px; padding:0 26px; border-bottom:2px solid var(--g); font-weight:700; font-size:25px; letter-spacing:.5px; }
.tabs button { position:relative; padding:0 6px 3px; opacity:.55; }
.tabs button:hover { opacity:.85; }
.tabs button.on { opacity:1; }
.tabs button.on::before, .tabs button.on::after { content:""; position:absolute; bottom:-2px; width:8px; height:62%; border-top:2px solid var(--g); }
.tabs button.on::before { left:-6px; border-left:2px solid var(--g); }
.tabs button.on::after { right:-6px; border-right:2px solid var(--g); }
.tabs .chip { margin-left:auto; align-self:center; font-size:15px; }
.subs { display:flex; gap:24px; padding:5px 0 0 38px; font-size:19px; height:32px; }
.subs button { opacity:.36; } .subs button.on { opacity:1; } .subs button:hover { opacity:.8; }
#body { flex:1; min-height:0; padding-top:8px; }
.foot { display:flex; gap:6px; margin-top:8px; font-size:19px; font-weight:700; }
.foot .seg { background:rgba(57,255,126,.14); padding:3px 14px; display:flex; align-items:center; gap:10px; white-space:nowrap; }
.foot .grow { flex:1; min-width:0; }
.foot .grow em { font-style:normal; font-weight:500; font-size:16px; overflow:hidden; text-overflow:ellipsis; }
.foot .bar { flex:1; height:13px; border:2px solid var(--g); min-width:60px; }
.foot .bar i { display:block; height:100%; background:var(--g); }
.foot .seg.bad { background:var(--al); color:var(--ink); text-shadow:none; }
.foot .lim .bar { flex:none; width:56px; min-width:0; }
.foot .seg.bad .bar { border-color:var(--ink); } .foot .seg.bad .bar i { background:var(--ink); }
.hrow { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; } .hrow h4 { margin:0; }
.screen .copy { font:700 12px 'Roboto Condensed', sans-serif; letter-spacing:1px; color:var(--al); background:none; border:1.5px solid var(--al); padding:1px 8px; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px; text-shadow:0 0 6px rgba(255,177,61,.4); }
.screen .copy:hover, .screen .copy.ok { background:var(--al); color:var(--ink); text-shadow:none; }

.cols { display:grid; gap:18px; height:100%; }
.col { min-height:0; overflow:auto; }
.gh { font-size:14px; opacity:.55; padding:8px 10px 2px; letter-spacing:.9px; font-weight:700; }
.li { position:relative; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:2px 10px 2px 24px; cursor:pointer; white-space:nowrap; }
.li:hover:not(.sel) { background:var(--gf); }
.li.sel { background:var(--g); color:var(--ink); text-shadow:none; }
.li.kid { padding-left:42px; }
.li.run::before { content:""; position:absolute; left:9px; top:50%; width:7px; height:7px; margin-top:-3.5px; background:currentColor; }
.li.kid.run::before { left:27px; }
.tg { font-size:14px; font-weight:700; padding:0 6px; letter-spacing:.5px; }
.tg.bad { background:var(--al); color:var(--ink); text-shadow:none; animation: blinkbg 1.2s step-end infinite; }
.tg.warn { outline:1.5px dashed var(--al); outline-offset:-1px; color:var(--al); }
.li.sel .tg.bad { background:var(--ink); color:var(--al); animation:none; }
.li.sel .tg.warn { outline-color:var(--ink); color:var(--ink); }
.kv { display:flex; justify-content:space-between; gap:10px; padding:3px 10px; background:var(--gf); margin-bottom:3px; }
.kv > span:first-child { opacity:.8; }
.pn { margin-bottom:12px; }
.pn h4 { margin:0 0 5px; font-size:14px; font-weight:700; opacity:.6; letter-spacing:1px; }
.note { padding:6px 10px; background:var(--gf); border-left:3px solid var(--g); }
.note.bad { border-left-color:var(--al); color:var(--al); }
.ac { display:grid; grid-template-columns: 62px 66px 1fr; gap:6px; font-size:16px; padding:2px 0; border-bottom:1px solid rgba(57,255,126,.12); }
.ac .o { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ac.bad { color:var(--al); }
.lnk { text-decoration:underline; cursor:pointer; }
.icons { display:flex; gap:3px; flex-wrap:nowrap; justify-content:center; }
.icons .ic { display:flex; align-items:center; gap:6px; background:rgba(57,255,126,.14); padding:5px 8px; font-size:20px; font-weight:700; white-space:nowrap; }
.icons .ic div { display:flex; flex-direction:column; line-height:1; }
.icons .ic small { font-size:11px; opacity:.7; font-weight:500; letter-spacing:.6px; margin-bottom:2px; }
.hero { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; }
.hero .who { font-size:24px; font-weight:700; letter-spacing:.4px; }
.hero .now { font-size:18px; max-width:330px; min-height:44px; }

.vb { position:relative; display:inline-block; line-height:0; filter: drop-shadow(0 0 5px rgba(57,255,126,.5)); }
.vb.al { --fig:var(--al); filter: drop-shadow(0 0 5px rgba(255,177,61,.45)); }
.vb .q2 { position:absolute; left:0; top:0; opacity:0; }
@keyframes q-metade { 0% { opacity:0 } 50% { opacity:1 } }
@keyframes q-piscada { 0% { opacity:0 } 93% { opacity:1 } 98% { opacity:0 } }
@keyframes q-metade-1 { 0% { opacity:1 } 50% { opacity:0 } }
@keyframes q-piscada-1 { 0% { opacity:1 } 93% { opacity:0 } 98% { opacity:1 } }

/* condição */
.cond { position:relative; height:100%; display:flex; flex-direction:column; }
.cond .stage { position:relative; flex:1; min-height:0; }
.cond .fig { position:absolute; left:50%; top:50%; transform:translate(-50%,-52%); }
.dash { position:absolute; display:flex; flex-direction:column; gap:3px; cursor:pointer; font-size:15px; font-weight:700; letter-spacing:.5px; }
.dash i { display:block; height:7px; background:var(--g); box-shadow:0 0 8px rgba(57,255,126,.5); }
.dash.bad { color:var(--al); } .dash.bad i { background:var(--al); animation: blink 1s step-end infinite; }
.dash span { opacity:.85; white-space:nowrap; }

/* inv */
.tbl { width:100%; border-collapse:collapse; font-size:17px; }
.tbl th { text-align:left; font-weight:700; font-size:13px; opacity:.6; padding:2px 8px; letter-spacing:.8px; }
.tbl td { padding:2px 8px; white-space:nowrap; }
.tbl tr.r { cursor:pointer; } .tbl tr.r:hover td { background:var(--gf); }
.tbl tr.sel td { background:var(--g); color:var(--ink); text-shadow:none; }
.tbl tr.sel .tg.bad { background:var(--ink); color:var(--al); animation:none; }
.tries { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
.tries span { background:var(--gf); padding:1px 8px; }
.tries span.f { color:var(--al); outline:1.5px solid var(--al); outline-offset:-1.5px; }

/* mapa e rádio */
.map { position:relative; border:2px solid var(--gd); aspect-ratio: 640 / 300; width:100%;
  background-image: linear-gradient(rgba(57,255,126,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(57,255,126,.06) 1px, transparent 1px); background-size: 32px 32px; }
.map svg.route { position:absolute; inset:0; width:100%; height:100%; }
.map .node { cursor:pointer; }
.map .pin { position:absolute; transform: translate(-50%, -100%); pointer-events:none; }
.scope { position:relative; height:160px; }
.scope svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; filter: drop-shadow(0 0 4px rgba(57,255,126,.55)); }
.scope .ax { fill:none; stroke:var(--g); stroke-width:2.5; }
.scope .tk { fill:none; stroke:var(--g); stroke-width:1.4; opacity:.85; }
.scope #wv { fill:none; stroke:var(--g); stroke-width:2.2; stroke-linejoin:round; }
pre.out { margin:10px 0 0; font-family:'Roboto Condensed', sans-serif; font-size:16px; line-height:1.25; white-space:pre-wrap; overflow:auto; height:calc(100% - 200px); }
.onair { background:var(--g); color:var(--ink); text-shadow:none; padding:0 6px; font-size:14px; font-weight:700; animation: blink 1.4s step-end infinite; }
.bars div { display:grid; grid-template-columns: 120px 1fr 90px; gap:10px; align-items:center; margin:4px 0; }
.bars i { display:block; height:11px; background:var(--g); }
</style>

<h2>A + C · agora com cara de Fallout</h2>
<p class="subtitle">Protótipo clicável com dados de exemplo. As abas da tela funcionam; clique nos agentes, tasks, alertas e pontos do mapa. Troque o cenário para ver o meio do run (com problemas) e o fim do run.</p>
<div class="scen">
  <b>Cenário</b>
  <button data-sc="meio" class="on">Meio do run · com problemas</button>
  <button data-sc="suite">Fim · suíte rodando</button>
  <button data-sc="revisao">Fim · revisão entre lanes</button>
</div>

<div class="dev" id="dev">
  <div class="screen" id="pb">
    <div class="tabs" id="tabs"></div>
    <div class="subs" id="subs"></div>
    <div id="body"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

  (location.hash.slice(1) || '').split('&').forEach(function (kv) { var p = kv.split('='); if (p[0] === 'tab') st.tab = decodeURIComponent(p[1]); if (p[0] === 'sub') st.sub[st.tab] = decodeURIComponent(p[1]); if (p[0] === 'sc') { st.sc = p[1]; st.agent = AGENTS[p[1]][0].id; } if (p[0] === 'agent') st.agent = p[1]; });
  render();
})();
</script>
