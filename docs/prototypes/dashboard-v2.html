  <path d="M9.1 1.7 V10.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" /></svg>`;

/*
 * Espiral de Fibonacci: o jeito de espalhar N pontos numa esfera sem que
 * eles se acumulem nos polos, que é o que qualquer distribuição ingênua por
 * latitude/longitude faz. Calculado uma vez para todos os orbs da página.
 */
const ORB_DOTS = (() => {
  const N = 26, golden = Math.PI * (3 - Math.sqrt(5));
  const out = [];
  for (let i = 0; i < N; i += 1) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = i * golden;
    out.push([(Math.cos(th) * r).toFixed(3), y.toFixed(3), (Math.sin(th) * r).toFixed(3)]);
  }
  return out;
})();

const ORB_BALL = `<span class="ball">${ORB_DOTS
  .map(([x, y, z]) => `<i style="--x:${x};--y:${y};--z:${z}"></i>`).join('')}</span>`;

/**
 * O orb de um agente. `mode` sai do estado, não do gosto: `''` trabalhando,
 * `warn` vivo depois de uma chamada que falhou, `stopped` parado.
 */
const orbHtml = (mode, r = 8.5) =>
  `<span class="orb ${mode}" style="--r:${r}px" aria-hidden="true">${ORB_BALL}</span>`;

const chevIcon = () => `<svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.4 2.6 L8 6 L4.4 9.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>`;

// ------------------------------------------------------------- avatares

/*
 * Um agente é alguém trabalhando, e alguém tem cara.
 *
 * A identidade sai do id — cor, olhos, o ângulo do topo: o mesmo agente é o
 * mesmo rosto do começo ao fim da run, e dois agentes lado a lado nunca são
 * a mesma pessoa. O humor sai do status, não do id: quem falhou não sorri.
 * Isso dá à tela a única coisa que uma lista de linhas não tem — alguém
 * reconhecível a quem atribuir o trabalho.
 */
/*
 * A cor diz a lane; o rosto diz quem.
 *
 * Antes a pele saía de `hash(id) % 8`, o que produzia duas coisas ruins ao
 * mesmo tempo: a cor que se lê de longe não se correlacionava com nada que o
 * leitor precise saber, e duas das oito peles *eram* os tokens de status
 * (`#4cb782` é `--done`), então a paleta decorativa colidia com a semântica
 * dentro de um círculo de 28px.
 *
 * Agora a cor é a lane — o único eixo que o leitor realmente rastreia — e a
 * identidade individual passou para as feições, que continuam saindo do id.
 * Duas lanes nunca são a mesma cor, dois agentes da mesma lane nunca são o
 * mesmo rosto, e nenhum deles pode ser confundido com um estado.
 *
 * Nenhum matiz aqui encosta em `--done`, `--fail`, `--warn`, `--run` ou
 * `--accent`, que são os cinco que a tela usa para dizer o que aconteceu.
 */
const LANE_SKIN = [
  { bg: '#3b9fe0', ink: '#f0fbff' },  // A
  { bg: '#a78bfa', ink: '#f7f3ff' },  // B
  { bg: '#e06cb0', ink: '#fff2f9' },  // C
  { bg: '#2dbfae', ink: '#f0fffd' },  // D
  { bg: '#7d8cc4', ink: '#f4f6ff' },  // E
  { bg: '#c98bd9', ink: '#fdf4ff' },  // F
];
/** A barreira não pertence a lane nenhuma: ela é a costura entre todas. */
const BARRIER_SKIN = { bg: '#5a5f7a', ink: '#f4f5fb' };

/** O subagente é da lane do pai, um passo atrás dele. */
function fadeSkin(skin) {
  const mix = (hex, t) => {
    const n = parseInt(hex.slice(1), 16);
    const to = [0x6a, 0x6e, 0x78];
    const out = [16, 8, 0].map((sh, i) => Math.round((((n >> sh) & 255) * (1 - t)) + (to[i] * t)));
    return `#${out.map((v) => v.toString(16).padStart(2, '0')).join('')}`;
  };
  return { bg: mix(skin.bg, 0.42), ink: skin.ink };
}

function skinFor(a) {
  if (a.barrier) return a.sub ? fadeSkin(BARRIER_SKIN) : BARRIER_SKIN;
  const i = a.lane ? (a.lane.toUpperCase().charCodeAt(0) - 65) % LANE_SKIN.length : 0;
  const skin = LANE_SKIN[i] || LANE_SKIN[0];
  return a.sub ? fadeSkin(skin) : skin;
}

function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < String(str).length; i += 1) {
    h ^= String(str).charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h);
}

/** Uma boca por humor. É a única feição que o id não escolhe. */
function mouthPath(status) {
  switch (status) {
    case 'done': return 'M8.1 14.4 q3.9 4 7.8 0';
    case 'running': return 'M8.6 15 q3.4 2.2 6.8 0';
    case 'failed': case 'blocked': return 'M8.4 16.2 q3.6 -3 7.2 0';
    case 'interrupted': return 'M9.2 15.4 q2.8 1.6 4.6 -.6';
    default: return 'M9.4 15.3 h5.2';
  }
}

function avatarSvg(seed, size, status, skin) {
  const h = hash(seed);
  const cap = [0, 35, 70, 145, 215, 250, 290, 325][(h >> 3) % 8];
  const eyeY = 10.2 + ((h >> 6) % 3) * 0.6;
  const eyeR = 1.25 + ((h >> 9) % 2) * 0.35;
  const gap = 3.4 + ((h >> 11) % 3) * 0.35;
  const closed = status === 'pending';
  const eye = (cx) => (closed
    ? `<path d="M${(cx - 1.5).toFixed(1)} ${eyeY} h3" stroke="${skin.ink}" stroke-width="1.2" stroke-linecap="round" opacity=".75" />`
    : `<circle cx="${cx.toFixed(1)}" cy="${eyeY}" r="${eyeR}" fill="${skin.ink}" />`);
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="12" fill="${skin.bg}" />
    <path d="M0 12 A12 12 0 0 1 24 12 Z" fill="rgba(0,0,0,.17)" transform="rotate(${cap} 12 12)" />
    ${eye(12 - gap)}${eye(12 + gap)}
    <path d="${mouthPath(status)}" fill="none" stroke="${skin.ink}" stroke-width="1.35" stroke-linecap="round" opacity=".92" />
  </svg>`;
}

/** O modelo mora no crachá: quem está trabalhando e com o quê, num objeto só. */
const MODEL_TAG = (m) => {
  const s = String(m || '').toLowerCase();
  if (s.includes('opus')) return 'O';
  if (s.includes('sonnet')) return 'S';
  if (s.includes('haiku')) return 'H';
  return s ? s.slice(0, 1).toUpperCase() : '?';
};

/*
 * O anel separava running de done de failed só por matiz — indigo, verde,
 * vermelho: exatamente o eixo que a deuteranopia colapsa. A régua de fases,
 * dois centímetros acima, já fazia isso certo com forma. Aqui o anel toma
 * emprestada a disciplina da própria página: cada estado encerrado ganha um
 * glifo, e a forma decide antes da cor.
 */
function statusMark(status) {
  const wrap = (cls, body) => `<span class="tick ${cls}"><svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true">${body}</svg></span>`;
  switch (status) {
    case 'done':
      return wrap('ok', '<path d="M1.8 4.6 L3.6 6.4 L7.2 2.6" fill="none" stroke="var(--on-brand)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />');
    case 'failed':
      return wrap('bad', '<path d="M2.6 2.6 l3.8 3.8 M6.4 2.6 l-3.8 3.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round" />');
    case 'blocked':
      return wrap('bad', '<path d="M2.4 4.5 h4.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />');
    case 'interrupted':
      return wrap('warn', '<path d="M3.4 2.8 v3.4 M5.6 2.8 v3.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" />');
    default:
      return '';
  }
}

function avatarHtml(a, size = 28, { plain = false } = {}) {
  const sm = size <= 22 ? ' sm' : '';
  if (plain) return `<span class="av plain">${avatarSvg(a.id, size, a.status, skinFor(a))}</span>`;
  const badge = a.model ? `<span class="badge" title="${esc(a.model)}">${esc(MODEL_TAG(a.model))}</span>` : '';
  return `<span class="av ${esc(a.status)}${sm}">
    ${avatarSvg(a.id, size, a.status, skinFor(a))}<span class="ring"></span>${statusMark(a.status)}${badge}</span>`;
}

// ------------------------------------------------------- o que ele faz

/*
 * A última chamada de tool, dita como frase.
 *
 * `Bash · npx vitest run tests/theme-toggle.test.tsx` obriga o leitor a ler o
 * comando para descobrir que são os testes rodando. O verbo carrega o sentido
 * e o argumento vira evidência — que é a ordem em que se lê de relance.
 */
function humanize(a) {
  if (!a) return null;
  if (a.kind === 'text') return { verb: 'thinking', obj: gist(a.text, 110), ok: true, quiet: true };
  const t = a.target || '';
  switch (a.name) {
    case 'Bash': {
      if (/\b(vitest|jest|pytest|go test|npm test|pnpm test|yarn test)\b/.test(t)) return { verb: 'running the tests', obj: t, ok: a.ok };
      if (/^git commit/.test(t)) return { verb: 'committing', obj: t, ok: a.ok };
      if (/^git (status|log|diff|show|rev-parse)/.test(t)) return { verb: 'checking git', obj: t, ok: a.ok };
      if (/^git (checkout|stash|reset|merge|rebase)/.test(t)) return { verb: 'moving the tree', obj: t, ok: a.ok };
      if (/^(npm|pnpm|yarn) (run )?(build|typecheck|lint)/.test(t)) return { verb: 'building', obj: t, ok: a.ok };
      return { verb: 'running', obj: t, ok: a.ok };
    }
    case 'Edit': case 'MultiEdit': case 'Update': return { verb: 'editing', obj: t, ok: a.ok };
    case 'Write': case 'NotebookEdit': return { verb: 'writing', obj: t, ok: a.ok };
    case 'Read': return { verb: 'reading', obj: t, ok: a.ok };
    case 'Grep': case 'Glob': return { verb: 'searching', obj: t, ok: a.ok };
    case 'Task': case 'Agent': return { verb: 'delegating', obj: t, ok: a.ok };
    case 'Skill': return { verb: 'using the skill', obj: t, ok: a.ok };
    case 'TodoWrite': return { verb: 'planning', obj: t, ok: a.ok };
    case 'WebFetch': case 'WebSearch': return { verb: 'looking it up', obj: t, ok: a.ok };
    case 'result': return { verb: a.ok === false ? 'failed' : 'finished', obj: a.text || '', ok: a.ok };
    default: return { verb: String(a.name || 'working').toLowerCase(), obj: t, ok: a.ok };
  }
}


// ---- herdado do ui.html sem alteração: o CSS de `.md` e `.cp` já veio junto,
// e eram as duas superfícies que o protótipo tinha jogado fora ----

const copyIcon = () => `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
  <rect x="3.7" y="3.7" width="6.8" height="6.8" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.2" />
  <path d="M8.3 1.6 H3.2 A1.6 1.6 0 0 0 1.6 3.2 V8.3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>`;

const okIcon = () => `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
  <path d="M2.4 6.3 L4.7 8.6 L9.6 3.5" fill="none" stroke="var(--done)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>`;


const MD_FENCE = '\u0000';
const MD_CODE = '\u0001';

/** Runs on already-escaped text. Code spans are held out first: a backtick
 *  span is literal, and `a**b` must not come back bold. */
function mdInline(t) {
  const held = [];
  let out = String(t).replace(/`([^`]+)`/g, (_, c) => { held.push(c); return `${MD_CODE}${held.length - 1}${MD_CODE}`; });
  out = out
    // Only http(s). The scheme survives escaping intact, so this test is on
    // the real thing, and anything else stays the text it already was.
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) => `<a href="${url}" target="_blank" rel="noreferrer noopener">${label}</a>`)
    .replace(/\*\*(\S[^*]*?)\*\*/g, '<strong>$1</strong>')
    .replace(/~~(\S[^~]*?)~~/g, '<del>$1</del>')
    // A lone marker needs a non-word neighbour on both sides, or `snake_case`
    // and `a * b` become emphasis in the middle of a path or an expression.
    .replace(/(^|[^*\w])\*(\S[^*]*?)\*(?![*\w])/g, '$1<em>$2</em>')
    .replace(/(^|[^_\w])_(\S[^_]*?)_(?![_\w])/g, '$1<em>$2</em>');
  return out.replace(new RegExp(MD_CODE + '(\\d+)' + MD_CODE, 'g'), (_, i) => `<code>${held[+i]}</code>`);
}

function md(src) {
  const raw = String(src == null ? '' : src).replace(/\r\n?/g, '\n').trim();
  if (!raw) return '';
  const fenced = [];
  const lines = esc(raw)
    .replace(/```[^\n]*\n([\s\S]*?)```/g, (_, body) => { fenced.push(body.replace(/\n+$/, '')); return `${MD_FENCE}${fenced.length - 1}${MD_FENCE}`; })
    .split('\n');

  const out = [];
  let para = [];
  let list = null;
  let quote = [];
  let table = null;
  const closePara = () => { if (para.length) { out.push(`<p>${mdInline(para.join('\n')).replace(/\n/g, '<br>')}</p>`); para = []; } };
  const closeList = () => {
    if (!list) return;
    out.push(`<${list.tag}${list.tick ? ' class="tick"' : ''}>` + list.items.map((i) => (i.box == null
      ? `<li>${mdInline(i.text)}</li>`
      : `<li class="${i.box ? 'on' : ''}">${checkbox(i.box)}<span>${mdInline(i.text)}</span></li>`)).join('') + `</${list.tag}>`);
    list = null;
  };
  const closeQuote = () => { if (quote.length) { out.push(`<blockquote>${mdInline(quote.join(' '))}</blockquote>`); quote = []; } };
  const RULE = /^\|[\s:|-]+\|$/;
  const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((c) => mdInline(c.trim()));
  const closeTable = () => {
    if (!table) return;
    const rows = table.slice();
    // A run of pipes is only a table if the second line is the rule. Without
    // it this is prose that happens to contain a pipe, and a `<table>` around
    // it would be a worse lie than the run-on paragraph it replaces.
    const head = rows.length > 1 && RULE.test(rows[1].trim()) ? (rows.splice(1, 1), rows.shift()) : null;
    const body = rows.filter((r) => !RULE.test(r.trim()));
    out.push('<div class="md-table"><table>'
      + (head ? `<thead><tr>${cells(head).map((c) => `<th>${c}</th>`).join('')}</tr></thead>` : '')
      + `<tbody>${body.map((r) => `<tr>${cells(r).map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
    table = null;
  };
  const close = () => { closePara(); closeList(); closeQuote(); closeTable(); };
  const item = (tag, text) => {
    closePara(); closeQuote(); closeTable();
    if (!list || list.tag !== tag) closeList(), list = { tag, items: [], tick: false };
    const box = text.match(/^\[([ xX])\]\s+(.*)$/);
    if (box) { list.tick = true; list.items.push({ box: box[1] !== ' ', text: box[2] }); }
    else list.items.push({ box: null, text });
  };

  for (const line of lines) {
    const fence = line.match(new RegExp('^' + MD_FENCE + '(\\d+)' + MD_FENCE + '$'));
    if (fence) { close(); out.push(`<pre><code>${fenced[+fence[1]]}</code></pre>`); continue; }
    if (!line.trim()) { close(); continue; }
    let m;
    // A panel column is not a document: an agent's `#` is a run of prose, not
    // a page title, so every level lands on one of two sizes.
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { close(); out.push(`<h${m[1].length <= 2 ? 4 : 5}>${mdInline(m[2])}</h${m[1].length <= 2 ? 4 : 5}>`); continue; }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { close(); out.push('<hr>'); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) { closePara(); closeList(); closeQuote(); (table || (table = [])).push(line.trim()); continue; }
    if ((m = line.match(/^\s*&gt;\s?(.*)$/))) { closePara(); closeList(); closeTable(); quote.push(m[1]); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { item('ul', m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { item('ol', m[1]); continue; }
    closeList(); closeQuote(); closeTable(); para.push(line);
  }
  close();
  return out.join('');
}

function copyBtnHtml(text, what, { label = '', cls = 'cp', title = '' } = {}) {
  const wide = cls === 'cp' && label ? ' wide' : '';
  return `<button class="${cls}${wide}" data-copy="${esc(text)}" data-what="${esc(what)}" data-label="${esc(label)}"`
    + ` aria-label="Copy ${esc(what)}" title="${esc(title || `Copy ${what}`)}">`
    + copyIcon() + (label ? `<span>${esc(label)}</span>` : '') + '</button>';
}

/**
 * `navigator.clipboard` needs a secure context. Loopback is one; the address
 * `--host` hands another machine is not — and that is exactly the reader who
 * cannot retype a session id by hand. The textarea is the fallback for them.
 */
async function copyText(text) {
  try {
    if (window.isSecureContext && navigator.clipboard) { await navigator.clipboard.writeText(text); return true; }
  } catch { /* fall through */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  return ok;
}

/** `done` is null at rest, true after a copy, false after a refusal. */
function paintCopyBtn(btn, done) {
  btn.classList.toggle('ok', done === true);
  btn.classList.toggle('bad', done === false);
  const label = btn.dataset.label;
  const word = done === true ? 'Copied' : done === false ? 'Copy failed' : label;
  btn.innerHTML = (done === true ? okIcon() : copyIcon()) + (label ? `<span>${esc(word)}</span>` : '');
  btn.setAttribute('aria-label', done === true ? `${btn.dataset.what} copied` : `Copy ${btn.dataset.what}`);
}

async function handleCopy(btn) {
  const ok = await copyText(btn.dataset.copy || '');
  paintCopyBtn(btn, ok);
  clearTimeout(btn.restore);
  btn.restore = setTimeout(() => paintCopyBtn(btn, null), 1400);
}

// ------------------------------------------------------------- render

let snap = null;
const openIds = new Set();   // quem o leitor abriu — sobrevive ao re-render
let feedQuery = '', feedKind = '';

function render(s) {
  snap = s;
  $('plan-title').textContent = s.plan;
  $('plan-name').textContent = s.title;
  $('m-progress').textContent = `${s.totals.done}/${s.totals.total}`;
  $('m-cost').textContent = tokens(s.totals.outputTokens);
  $('live').className = `live ${s.endedAt ? 'off' : 'on'}`;
  $('live-text').textContent = s.endedAt ? 'finished' : 'live';

  $('plan-sub').innerHTML = [
    `base <code>${esc(s.base.branch)}</code> at <code>${esc(s.base.commit)}</code>`,
    `tests <code>${esc(s.testCommand)}</code>`,
    `${plural(s.lanes, 'lane')} · max ${s.maxLanes}`,
  ].join('<span class="sep">·</span>');

  paint($('verdict'), verdictHtml(s));
  renderStages(s);
  renderAlerts(s);
  renderCrew(s);
  renderQueue(s);
  renderOutcome(s);
  renderSettled(s);
  renderFeed(s);
  tick();
}

/** A run numa frase. Agora conta gente, não só tarefa: dois agentes vivos numa
 *  tarefa só é um fato que a contagem de tarefas esconde. */
function verdictHtml(s) {
  const t = s.totals;
  const hurt = allAgents(s).filter((a) => a.status === 'failed' || a.status === 'blocked' || a.status === 'interrupted');
  const live = liveAgents(s);
  const complete = t.done === t.total;

  const parts = [complete ? `All ${plural(t.total, 'task')} done` : `${t.done} of ${t.total} done`];
  for (const a of hurt.slice(0, 2)) {
    const word = esc((STATUS_WORD[a.status] || a.status).toLowerCase());
    const held = a.endedAt ? `<span class="soft"> for <span data-since="${esc(a.endedAt)}">–</span></span>` : '';
    parts.push(`<span class="bad">${esc(a.tag)} ${word}${held}</span>`);
  }
  if (live.length) parts.push(`<span class="soft">${plural(live.length, 'agent')} working</span>`);
  else if (!complete) parts.push('<span class="soft">nobody working</span>');

  const mark = hurt.length ? hurt[0].status : live.length ? 'running' : complete ? 'done' : 'pending';
  return statusIcon(mark, 17) + parts.join('<span class="sep">·</span>');
}

const STOPPED = new Set(['failed', 'blocked', 'interrupted']);
/** A fase que está segurando a run enquanto nenhum agente está vivo. */
function runningStage(s) {
  const st = (s.stages || []).find((x) => x.status === 'running');
  if (!st) return 'waiting to start';
  return st.detail ? `${st.label.toLowerCase()} · ${st.detail}` : st.label.toLowerCase();
}

const allAgents = (s) => s.crew.flatMap((a) => [a, ...(a.children || [])]);
const liveAgents = (s) => allAgents(s).filter((a) => a.status === 'running');

function renderStages(s) {
  const stages = s.stages || [];
  $('stages').hidden = !stages.length;
  paint($('stages'), stages.map((st) => `<li class="stage ${esc(st.status)}">`
    + statusIcon(st.status, 14)
    + `<span class="st-label">${esc(st.label)}</span>`
    + (st.detail ? `<span class="st-detail" title="${esc(st.detail)}">${esc(st.detail)}</span>` : '')
    + '</li>').join(''));
}

function renderAlerts(s) {
  paint($('alerts'), (s.alerts || []).map((al) => `<div class="alert ${al.bad ? 'bad' : ''}">
      ${alertIcon(al.bad)}<div><b>${esc(al.title)}</b> ${esc(al.text)}</div>
      ${al.copy ? `<div class="acts">${copyBtnHtml(al.copy, 'the resume command', { label: 'Copy resume' })}</div>` : ''}
    </div>`).join(''));
}

// ---------------------------------------------------------- a tripulação

/*
 * O corpo da tela: uma linha por agente vivo, aninhando os subagentes que ele
 * mesmo abriu. Fora do processo do `plo`, "lane A" não trabalha — quem
 * trabalha é o agente da tarefa e os subagentes que ele despachou, e é essa a
 * unidade que a tela conta.
 */
function renderCrew(s) {
  const live = liveAgents(s).length;
  const stopped = allAgents(s).filter((a) => STOPPED.has(a.status)).length;
  const complete = s.totals.done === s.totals.total;
  // Uma run encerrada não tem tripulação; a seção sai em vez de anunciar o vazio.
  $('crew-section').hidden = !s.crew.length && complete;
  $('crew-tally').textContent = [
    live ? `${live} working` : '',
    stopped ? `${stopped} stopped` : '',
    s.crew.length ? plural(s.crew.length, 'task') : '',
  ].filter(Boolean).join(' · ');
  paint($('crew'), s.crew.length
    ? s.crew.map((a) => agentHtml(a)).join('')
    : `<div class="crew-empty">${statusIcon('running', 14)}<span>nobody working — <b>${esc(runningStage(s))}</b></span></div>`);
}

function agentHtml(a, kid = false) {
  const open = openIds.has(a.id);
  const doing = humanize(a.doing);
  const live = a.status === 'running';
  const bad = a.status === 'failed' || a.status === 'blocked';
  // Herda a natureza do pai para a cor, não para a etiqueta: um subagente
  // despachado por uma barreira está dentro de uma, não é uma.
  const isBarrierTask = a.barrier && !a.sub;

  const line = bad && a.error
    ? `<div class="ag-doing bad">${orbHtml('stopped', kid ? 7 : 8.5)}<span class="verb">${esc(STATUS_WORD[a.status] || a.status)}</span><span class="err">${esc(dedupeStatus(a.status, gist(a.error, 118)))}</span><span class="more">read it</span></div>`
    : doing
      ? `<div class="ag-doing${doing.ok === false ? ' warn' : ''}">
           ${live ? orbHtml(doing.ok === false ? 'warn' : '', kid ? 7 : 8.5) : ''}
           <span class="verb">${esc(doing.verb)}</span>
           <span class="obj" title="${esc(doing.obj)}">${esc(doing.obj)}</span>
         </div>`
      : `<div class="ag-doing">${bad ? orbHtml('stopped', kid ? 7 : 8.5) : ''}<span class="verb">${esc(STATUS_WORD[a.status] || a.status)}</span></div>`;

  const meta = [
    `<span class="clock"${live ? ` data-since="${esc(a.startedAt)}"` : ''}>${live ? '–' : esc(span(a))}</span>`,
    a.turns ? `<span class="drop">${plural(a.turns, 'turn')}</span>` : '',
    a.outputTokens ? `<span class="drop">${tokens(a.outputTokens)} tok</span>` : '',
  ].filter(Boolean).join('');

  const kids = (a.children || []).length
    ? `<div class="kids">${a.children.map((k) => `<div class="kid ag ${esc(k.status)}${openIds.has(k.id) ? ' open' : ''}">${agentHtml(k, true)}</div>`).join('')}</div>`
    : '';

  // O relatório de quem parou vem antes do log: é a resposta à pergunta que
  // fez o leitor clicar. Cortado em 130 caracteres no cabeçalho, ele existia
  // só num `title` nativo — que ninguém lê num segundo monitor.
  const report = bad && a.error
    ? `<div class="ag-report"><h3>${esc(a.status === 'blocked' ? 'Why it stopped' : 'Error')}</h3>
         <div class="md">${md(a.error)}</div>
         ${a.resume ? `<div class="acts">${copyBtnHtml(a.resume, 'the resume command', { label: 'Copy resume' })}
           ${a.branch ? copyBtnHtml(a.branch, 'the lane branch', { label: a.branch, cls: 'cp' }) : ''}</div>` : ''}
       </div>`
    : '';

  const log = open
    ? `<div class="ag-log">
         <div class="log-head"><b>${esc(a.tag)}</b> · last ${plural((a.activity || []).length, 'event')}</div>
         <div class="feed">${(a.activity || []).slice().reverse().map((ev) => activityHtml(ev)).join('')
           || '<div class="empty">no events yet</div>'}</div>
       </div>`
    : '';
  const drawer = open ? report + log : '';

  const row = `<button class="ag-row" data-agent="${esc(a.id)}" aria-expanded="${open}">
      ${avatarHtml(a, kid ? 22 : 28)}
      <span class="ag-main">
        <span class="ag-who">
          <span class="ag-tag${isBarrierTask ? ' barrier tip' : ''}"${isBarrierTask ? ` data-tip="${esc(BARRIER_TIP)}"` : ''}>${isBarrierTask ? barrierIcon(11) : ''}${esc(a.tag)}${isBarrierTask ? `<span class="sr">. ${esc(BARRIER_TIP)}</span>` : ''}</span>
          <span class="ag-name">${esc(a.title)}</span>
        </span>
        ${line}
      </span>
      <span class="ag-meta">${meta}</span>
      ${chevIcon()}
    </button>`;

  // Um subagente já vem embrulhado pelo pai; a tarefa embrulha a si mesma.
  return kid ? row + drawer : `<div class="ag ${esc(a.status)}${open ? ' open' : ''}" data-card="${esc(a.id)}">${row}${drawer}${kids}</div>`;
}

/** Tira do relato a palavra que a etiqueta ao lado já carrega. */
function dedupeStatus(status, text) {
  const word = (STATUS_WORD[status] || status).split(' ')[0];
  return String(text).replace(new RegExp(`^${word}[.:,\\s—-]+`, 'i'), '');
}

function took(a) {
  if (!a.durationMs || a.durationMs < 1000) return '';
  return a.durationMs < 60000 ? `${Math.round(a.durationMs / 1000)}s` : dur(a.durationMs);
}

function activityHtml(a, who = false) {
  const at = `<span class="at">${esc(clock(a.at))}</span>`;
  // Dois `implementer` sob rótulo idêntico, sem rosto e sem pai, na única
  // superfície cujo trabalho inteiro é desambiguar. O rosto resolve porque a
  // cor já diz a lane; o `title` carrega o caminho completo.
  const tag = who
    ? `<span class="who${a.barrier ? ' barrier' : ''}" title="${esc(a.by ? a.by.path : a.tag || '')}">`
      + (a.by ? avatarHtml(a.by, 14, { plain: true }) : '')
      + `<span>${esc(a.tag || '')}</span></span>`
    : '';
  const open = `<div class="ln${a.ok === false ? ' bad' : ''}">${at}${tag}`;
  if (a.kind === 'text') return `${open}<span class="ico"></span><span class="say" title="${esc(a.text)}">${esc(a.text)}</span></div>`;
  const why = a.ok === false && a.preview ? `<span class="why"> ${esc(a.preview)}</span>` : '';
  return `${open}<span class="ico">${resultIcon(a.ok)}</span>`
    + `<span class="name${a.sub ? ' sub' : ''}">${a.sub ? '↳ ' : ''}${esc(a.name)}</span>`
    + `<span class="arg" title="${esc([a.target, a.ok === false ? a.preview : ''].filter(Boolean).join(' — '))}">${esc(a.target || '')}${why}</span>`
    + `<span class="took">${esc(took(a))}</span></div>`;
}

// ---------------------------------------------------------------- a fila

/** O que ainda vai virar agente, e o que segura cada um. */
function renderQueue(s) {
  const q = s.queue || [];
  $('queue-section').hidden = !q.length;
  $('queue-tally').textContent = q.length ? String(q.length) : '';
  paint($('queue'), q.map((t) => `<div class="qrow">
      ${statusIcon('pending', 14)}
      <span class="ag-tag${t.barrier ? ' barrier tip' : ''}"${t.barrier ? ` data-tip="${esc(BARRIER_TIP)}" tabindex="0" role="note"` : ''}>${t.barrier ? barrierIcon(11) : ''}${esc(t.tag)}${t.barrier ? `<span class="sr">. ${esc(BARRIER_TIP)}</span>` : ''}</span>
      <span class="qtitle">${esc(t.title)}</span>
      <span class="after">${esc(t.after)}</span>
    </div>`).join(''));
}

/** O fechamento da run: o que ela custou e o que a paralelização rendeu. */
function renderOutcome(s) {
  const o = s.outcome;
  $('outcome-section').hidden = !o;
  if (!o) return;
  const gain = (o.agentSeconds / o.wallSeconds).toFixed(1);
  paint($('outcome'), `
    <div class="headline">
      <b>${esc(dur(o.wallSeconds * 1000))}</b> wall clock
      <span class="vs">against <b style="font-size:15px">${esc(dur(o.agentSeconds * 1000))}</b> of agent time —
        <b style="font-size:15px">${gain}×</b> from ${plural(s.lanes, 'lane')}</span>
    </div>
    <div class="facts">
      <span><b>${plural(s.totals.total, 'task')}</b> across ${plural(s.lanes, 'lane')}</span>
      <span><b>${tokens(s.totals.outputTokens)}</b> output tokens</span>
      <span><b>${o.commits}</b> commits</span>
      <span><b>${o.specs}</b> specs green</span>
    </div>
    <div class="review">${resultIcon(o.reviewOk)}<span>${mdInline(esc(o.review))}</span></div>`);
}

/** O que já saiu do caminho — uma faixa, não três seções. */
function renderSettled(s) {
  const done = (s.settled || []).filter((t) => t.status === 'done');
  const hurt = (s.settled || []).filter((t) => t.status !== 'done');
  $('settled-section').hidden = !done.length && !hurt.length;

  const grp = (label, items) => !items.length ? '' : `<div class="grp">
      <span class="lbl"><b>${esc(label)}</b> ${items.length}</span>
      ${items.map((t) => `<span class="ag-tag${t.tag.startsWith('Barrier') ? ' barrier' : ''}" title="${esc(t.title)}">${esc(t.tag)}</span>`).join('')}
    </div>`;

  paint($('settled'), [
    grp('Done', done),
    grp('Stopped', hurt),
    done.length ? `<span class="lbl">${tokens(done.reduce((n, t) => n + (t.outputTokens || 0), 0))} tokens · ${plural(done.reduce((n, t) => n + (t.commits || 0), 0), 'commit')}</span>` : '',
  ].filter(Boolean).join(''));
}

// -------------------------------------------------- o firehose, guardado

function feedMatch(a) {
  if (feedKind === 'err' && a.ok !== false) return false;
  if (feedKind === 'bash' && a.name !== 'Bash') return false;
  if (feedKind === 'edit' && !['Edit', 'Write', 'MultiEdit', 'NotebookEdit', 'Update'].includes(a.name)) return false;
  if (!feedQuery) return true;
  return [a.name, a.target, a.text, a.preview, a.tag].filter(Boolean).join(' ').toLowerCase().includes(feedQuery);
}

function renderFeed(s) {
  const all = (s.feed || []).filter(feedMatch);
  $('p-count').textContent = all.length ? `${all.length} events` : '';
  paint($('p-feed'), all.slice().reverse().map((a) => activityHtml(a, true)).join('')
    || '<div class="empty">nothing to show</div>');
}

// ---------------------------------------------------------- interação

document.addEventListener('click', (e) => {
  const cp = e.target.closest('[data-copy]');
  if (cp) { handleCopy(cp); return; }

  const row = e.target.closest('.ag-row');
  if (row) {
    const id = row.dataset.agent;
    if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
    renderCrew(snap);
    return;
  }
  if (e.target.closest('#open-feed')) { openPanel(true); return; }
  if (e.target.closest('#d-close') || e.target.closest('#scrim')) { openPanel(false); return; }
  // Fechar em qualquer clique fora tornava impossível segurar uma linha do
  // feed contra a linha do agente de onde ela veio — que é a razão de as duas
  // superfícies existirem. Esc, o botão e o scrim (que só cobre a tela
  // estreita) continuam fechando.
});

function openPanel(on) {
  document.body.dataset.panel = on ? 'open' : '';
  if (on) $('p-q').focus();
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') openPanel(false);
});

$('p-q').addEventListener('input', (e) => { feedQuery = e.target.value.trim().toLowerCase(); renderFeed(snap); });

/*
 * Um tooltip só sabe para onde abrir no instante em que abre: a linha rola,
 * a tripulação cresce, e a mesma âncora está no meio da tela agora e a
 * dezoito pixels do rodapé daqui a um minuto.
 */
document.addEventListener('mouseover', (e) => {
  const tip = e.target.closest('.tip');
  if (!tip) return;
  const r = tip.getBoundingClientRect();
  tip.classList.toggle('up', r.bottom + 76 > window.innerHeight);
}, true);
document.addEventListener('focusin', (e) => {
  const tip = e.target.closest('.tip');
  if (tip) tip.classList.toggle('up', tip.getBoundingClientRect().bottom + 76 > window.innerHeight);
});

/** Os relógios são o que faz uma tela parada parecer viva. */
function tick() {
  for (const el of document.querySelectorAll('[data-since]')) el.textContent = since(el.dataset.since);
  if (snap) $('m-elapsed').textContent = snap.endedAt
    ? dur(Date.parse(snap.endedAt) - Date.parse(snap.startedAt))
    : since(snap.startedAt);
}
setInterval(tick, 1000);

const last = (log, pred = () => true) => [...log].reverse().find((a) => pred(a)) || null;

/** O agente da tarefa vê o que ele mesmo chamou; o subagente vê o que é dele. */
const own = (log) => log.filter((a) => !a.sub);
const subLog = (log, from, to) => log.slice(from, to).map((a) => ({ ...a, sub: false }));

const agent = (o) => ({ children: [], activity: [], turns: 0, ...o, doing: o.doing || last(o.activity || []) });

/** Quem despachou passa lane e natureza adiante — é o que a cor lê. */
const lineage = (list) => list.map((a) => ({
  ...a,
  children: (a.children || []).map((k) => ({ ...k, lane: a.lane, barrier: a.barrier, sub: true })),
}));

}

/** O feed global sai da tripulação, nunca de uma segunda fonte. */
function buildFeed(crew) {
  const rows = [];
  const by = (a, path) => ({ id: a.id, lane: a.lane, barrier: a.barrier, sub: a.sub, status: a.status, path });
  for (const a of crew) {
    for (const ev of a.activity) rows.push({ ...ev, tag: a.tag, barrier: a.barrier, by: by(a, a.tag) });
    for (const k of a.children || []) {
      for (const ev of k.activity) rows.push({ ...ev, tag: k.tag, sub: true, by: by(k, `${a.tag} › ${k.tag}`) });
    }
  }
  return rows.sort((x, y) => Date.parse(x.at) - Date.parse(y.at));
}

/*
 * Deep link: `#scn=blocked&open=a-t1,b-t2` escolhe o cenário e já abre os
 * logs pedidos. Existe para a captura de tela e para a revisão — um estado
 * que só se alcança clicando não pode ser mostrado num link.
 */
function fromHash() {
  const q = new URLSearchParams(location.hash.replace(/^#/, ''));
  const scn = SCENARIOS[q.get('scn')] ? q.get('scn') : 'running';
  openIds.clear();
  for (const id of (q.get('open') || '').split(',').filter(Boolean)) openIds.add(id);
  for (const b of document.querySelectorAll('.mockbar button')) b.classList.toggle('on', b.dataset.scn === scn);
  render(SCENARIOS[scn]());
  openPanel(Boolean(q.get('panel')));
}
window.addEventListener('hashchange', fromHash);
